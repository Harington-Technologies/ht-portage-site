<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reporting financier — Espace consultant HT Portage</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=20261028e">
<link rel="stylesheet" href="../assets/css/espace.css?v=20261028e">
</head>
<body data-page="reporting">
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Espace consultant"></nav>
  <main class="content">
    <header class="page-head">
      <div>
        <p class="eyebrow" id="annee-label">/Reporting/</p>
        <h1 class="page-title">Reporting financier</h1>
        <p class="small" id="maj" style="font-size:14px"></p>
      </div>
      <label class="small" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)">Année
        <select class="select" id="annee" style="min-height:44px;width:auto"></select>
      </label>
    </header>

    <section class="kpis" id="cumuls" aria-label="Cumuls de l'année"><p class="loading">Chargement…</p></section>

    <section class="box" aria-labelledby="t-mois">
      <div class="box__head"><h2 class="box__title" id="t-mois">Comptes d'activité mensuels</h2><span class="small">Montants en euros</span></div>
      <div id="tableau"></div>
    </section>

    <section class="box" aria-labelledby="t-repart" id="bloc-repart" hidden>
      <h2 class="box__title" id="t-repart">Où va votre chiffre d'affaires</h2>
      <div id="repart"></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js?v=20261028e"></script>
<script src="../assets/js/espace.js?v=20261028e"></script>
<script src="../assets/js/espace-reporting.js?v=20261028e"></script>
</body>
</html>
