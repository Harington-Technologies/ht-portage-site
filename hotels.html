<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hôtels — démo filtres</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Charte inspirée d'E. Clarke Travel : ardoise, bleu océan, Outfit + Cormorant Garamond */
    --ink: #21262D; --muted: #5E656D; --line: #E2E4E6; --bg: #F5F6F4; --tint: #EEF1F3;
    --navy: #2F353D; --navy-2: #2B7499; --rose: #3990B7; --rose-50: #E6F1F7; --plum: #2B7499; --star: #8A6A36;
    --serif: 'Cormorant Garamond', Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; font-weight: 400; color: var(--ink); background: var(--bg); line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
  header { background: var(--navy); color: #fff; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  header .wrap { padding-top: 56px; padding-bottom: 52px; text-align: center; }
  header h1 { margin: 0; font-size: clamp(30px, 5vw, 52px); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.1; }
  header p { margin: 14px 0 0; color: #D9DDE1; font-family: var(--serif); font-style: italic; font-size: 21px; letter-spacing: 0.04em; }
  .source { display: inline-block; margin-top: 18px; font-size: 13px; padding: 5px 14px; border-radius: 20px; background: rgba(255,255,255,.1); letter-spacing: 0.04em; }

  .layout { display: flex; flex-wrap: wrap; gap: 24px; padding-top: 28px; padding-bottom: 64px; align-items: flex-start; }
  aside { flex: 1 1 280px; max-width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 22px; position: sticky; top: 16px; }
  main { flex: 999 1 560px; min-width: 0; }
  @media (max-width: 880px) { aside { position: static; } }

  .f { border: 0; padding: 0; margin: 0 0 22px; }
  .f:last-of-type { margin-bottom: 14px; }
  .f > legend, .f > label.t { display: block; font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px; padding: 0; color: var(--navy); }
  input[type=search], select, input[type=number] { width: 100%; min-height: 44px; padding: 10px 12px; font: inherit; font-size: 15px; border: 1px solid #9AA1A8; border-radius: 4px; background: #fff; color: var(--ink); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .chip span { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 8px 14px; border-radius: 20px; border: 1px solid #9AA1A8; background: #fff; font-size: 14px; font-weight: 500; user-select: none; }
  .chip input:checked + span { background: var(--navy-2); border-color: var(--navy-2); color: #fff; }
  .chip input:focus-visible + span { outline: 3px solid var(--rose); outline-offset: 2px; }
  .checks { display: grid; gap: 8px; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--navy-2); }
  input[type=range] { width: 100%; accent-color: var(--navy-2); height: 28px; }
  .range-val { float: right; font-weight: 600; color: var(--plum); letter-spacing: 0; text-transform: none; font-size: 14px; }
  .reset { width: 100%; min-height: 44px; border-radius: 20px; border: 0; background: var(--navy-2); color: #fff; font: inherit; font-weight: 500; letter-spacing: 0.03em; cursor: pointer; }
  .reset:hover { background: #22617F; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .count { font-size: 15px; color: var(--muted); }
  .count strong { color: var(--ink); }
  .toolbar select { width: auto; min-width: 220px; }

  .list { display: grid; gap: 16px; }
  .card { display: flex; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; transition: box-shadow .2s ease; }
  .card:hover { box-shadow: 0 10px 30px rgba(33,38,45,.08); }
  .thumb { flex: 0 0 200px; min-height: 170px; display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 40px; letter-spacing: .06em; }
  @media (max-width: 560px) { .thumb { flex-basis: 100%; min-height: 120px; } }
  .body { flex: 1 1 280px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .card h2 { margin: 0; font-size: 21px; font-weight: 500; letter-spacing: 0.02em; line-height: 1.25; }
  .stars { color: var(--star); font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
  .loc { font-size: 14px; color: var(--muted); }
  .desc { font-family: var(--serif); font-size: 17px; color: var(--muted); margin: 0; line-height: 1.45; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; background: var(--tint); color: var(--navy); }
  .tag.ok { background: #E3F1E6; color: #24603A; }
  .tag.net { background: var(--navy); color: #fff; }
  .bottom { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--tint); }
  .score { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .score b { background: var(--navy-2); color: #fff; font-size: 15px; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
  .price { text-align: right; }
  .price strong { font-size: 26px; font-weight: 500; }
  .price span { display: block; font-size: 12px; color: var(--muted); }
  .empty, .error { background: #fff; border: 1px dashed #9AA1A8; border-radius: 6px; padding: 40px 24px; text-align: center; color: var(--muted); }
  .error { border-color: #A12C3B; color: #A12C3B; }
  .more-wrap { margin-top: 20px; display: flex; justify-content: center; }
  .more { width: auto; padding: 0 28px; }
  .credit { margin-top: 24px; font-size: 13px; color: var(--muted); }
  .credit a, .site { color: var(--plum); }
  .site { font-size: 13px; font-weight: 500; }
  .price .na { font-size: 15px; color: var(--muted); font-weight: 400; }
  .stars.na { color: var(--muted); font-size: 12px; letter-spacing: 0; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Trouver un hôtel</h1>
    <p>Filtrez par étoiles, ville, prix, note et équipements.</p>
    <span class="source" id="source">Chargement…</span>
  </div>
</header>

<div class="wrap layout">
  <aside aria-label="Filtres">
    <form id="filters" onsubmit="return false">
      <div class="f">
        <label class="t" for="q">Recherche</label>
        <input type="search" id="q" name="q" placeholder="Nom d'hôtel, quartier…" autocomplete="off">
      </div>

      <div class="f">
        <label class="t" for="pays">Pays</label>
        <select id="pays" name="pays"><option value="">Tous les pays</option></select>
      </div>

      <div class="f">
        <label class="t" for="region">Région</label>
        <select id="region" name="region"><option value="">Toutes les régions</option></select>
      </div>

      <div class="f">
        <label class="t" for="ville">Ville</label>
        <select id="ville" name="ville"><option value="">Toutes les villes</option></select>
      </div>

      <fieldset class="f">
        <legend>Nombre d'étoiles</legend>
        <div class="chips" id="etoiles">
          <label class="chip"><input type="checkbox" name="etoiles" value="1"><span>1 ★</span></label>
          <label class="chip"><input type="checkbox" name="etoiles" value="2"><span>2 ★</span></label>
          <label class="chip"><input type="checkbox" name="etoiles" value="3"><span>3 ★</span></label>
          <label class="chip"><input type="checkbox" name="etoiles" value="4"><span>4 ★</span></label>
          <label class="chip"><input type="checkbox" name="etoiles" value="5"><span>5 ★</span></label>
        </div>
      </fieldset>

      <fieldset class="f">
        <legend>Prix par nuit (€)</legend>
        <div class="row2">
          <div><label for="pmin">Minimum</label><input type="number" id="pmin" name="pmin" min="0" step="10" inputmode="numeric" placeholder="0"></div>
          <div><label for="pmax">Maximum</label><input type="number" id="pmax" name="pmax" min="0" step="10" inputmode="numeric" placeholder="Illimité"></div>
        </div>
      </fieldset>

      <div class="f">
        <label class="t" for="note">Note clients minimale <span class="range-val" id="note-val">Toutes</span></label>
        <input type="range" id="note" name="note" min="0" max="9" step="0.5" value="0">
      </div>

      <fieldset class="f">
        <legend>Équipements</legend>
        <div class="checks" id="equipements"></div>
      </fieldset>

      <div class="f" id="reseau-field" hidden>
        <label class="t" for="reseau">Réseau partenaire</label>
        <select id="reseau" name="reseau"><option value="">Tous les hôtels</option></select>
      </div>

      <fieldset class="f">
        <legend>Conditions</legend>
        <div class="checks">
          <label class="check"><input type="checkbox" name="petit_dej" id="petit_dej">Petit-déjeuner inclus</label>
          <label class="check"><input type="checkbox" name="annulation" id="annulation">Annulation gratuite</label>
        </div>
      </fieldset>

      <button type="button" class="reset" id="btn-reset">Réinitialiser les filtres</button>
    </form>
  </aside>

  <main>
    <div class="toolbar">
      <p class="count" id="count" aria-live="polite"></p>
      <label class="visually-hidden" for="tri" style="position:absolute;left:-9999px">Trier par</label>
      <select id="tri" name="tri" aria-label="Trier par">
        <option value="note_desc">Trier : meilleures notes</option>
        <option value="prix_asc">Trier : prix croissant</option>
        <option value="prix_desc">Trier : prix décroissant</option>
        <option value="etoiles_desc">Trier : plus d'étoiles</option>
        <option value="distance_asc">Trier : plus proche du centre</option>
      </select>
    </div>
    <div class="list" id="list"></div>
    <div class="more-wrap"><button type="button" class="reset more" id="more" hidden>Afficher plus d'hôtels</button></div>
    <p class="credit" id="credit" hidden>Données des hôtels importés : © les contributeurs d'<a href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a> (licence ODbL). Prix et notes non disponibles pour ces hôtels.</p>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script>
// ---------------------------------------------------------------
// Configuration : si Supabase n'est pas configuré (ou la table absente
// au premier chargement), la page affiche les données de démo.
// ---------------------------------------------------------------
// Page de test intégrée au site HT Portage : reprend la configuration de assets/js/config.js.
const SUPABASE_URL = (window.HTP_CONFIG || {}).supabaseUrl || '';
const SUPABASE_KEY = (window.HTP_CONFIG || {}).supabaseAnonKey || '';

const EQUIPEMENTS = {
  wifi: 'Wi-Fi', piscine: 'Piscine', spa: 'Spa', parking: 'Parking', restaurant: 'Restaurant',
  salle_sport: 'Salle de sport', animaux: 'Animaux acceptés', clim: 'Climatisation'
};

// Données de démo (identiques au script SQL, hôtels fictifs)
const DEMO = [
  ['Le Pavillon des Arts','Paris','Le Marais',4,245,9.1,1284,0.8,['wifi','restaurant','clim','salle_sport'],true,true,'Hôtel de charme dans un hôtel particulier rénové, à deux pas de la place des Vosges.'],
  ['Hôtel Rive Gauche','Paris','Saint-Germain',3,165,8.4,932,1.2,['wifi','clim'],false,true,'Adresse intimiste et lumineuse, idéale pour découvrir le Quartier latin à pied.'],
  ['Grand Palais Opéra','Paris','Opéra',5,590,9.4,611,0.5,['wifi','spa','piscine','restaurant','salle_sport','clim'],true,true,'Palace historique avec spa, piscine intérieure et restaurant étoilé.'],
  ["Hôtel du Canal Saint-Martin",'Paris','10e arrondissement',2,98,7.6,2210,2.4,['wifi','animaux'],false,false,'Chambres simples et fonctionnelles, à deux pas du canal Saint-Martin.'],
  ['Les Jardins de Montmartre','Paris','Montmartre',3,142,8.7,745,3.1,['wifi','animaux','clim'],true,false,'Petit hôtel familial avec jardin, au pied de la butte.'],
  ['Le Quai Saint-Paul','Lyon','Vieux Lyon',4,189,9.0,518,0.6,['wifi','restaurant','clim','parking'],true,true,'Bâtisse Renaissance face à la Saône, chambres voûtées.'],
  ["Presqu'île Hôtel",'Lyon','Bellecour',3,119,8.2,877,0.3,['wifi','clim'],false,true,"Au cœur de la Presqu'île, à deux minutes de la place Bellecour."],
  ['Lyon Confluence Suites','Lyon','Confluence',4,172,8.5,402,2.8,['wifi','parking','salle_sport','clim','animaux'],false,true,'Suites contemporaines avec vue sur la confluence du Rhône et de la Saône.'],
  ['Villa Azur','Nice','Mont Boron',5,480,9.3,356,3.5,['wifi','piscine','spa','restaurant','parking','clim'],true,true,'Villa Belle Époque avec piscine à débordement face à la Baie des Anges.'],
  ['Hôtel de la Promenade','Nice','Promenade des Anglais',4,210,8.6,1190,1.0,['wifi','restaurant','clim','salle_sport'],true,false,'Chambres avec balcon face à la mer, plage privée en saison.'],
  ['Le Petit Niçois','Nice','Vieux Nice',2,89,8.0,664,0.4,['wifi','clim'],false,true,'Adresse économique et colorée dans les ruelles du Vieux Nice.'],
  ['Vieux-Port Marina','Marseille','Vieux-Port',4,198,8.8,823,0.2,['wifi','restaurant','clim','parking'],true,true,'Vue directe sur le Vieux-Port et Notre-Dame-de-la-Garde.'],
  ['Les Calanques Hôtel & Spa','Marseille','Les Goudes',5,360,9.2,287,11.5,['wifi','piscine','spa','restaurant','parking','animaux'],true,true,'Refuge face aux calanques, spa et piscine creusée dans la roche.'],
  ['Hôtel du Panier','Marseille','Le Panier',3,112,8.1,509,0.9,['wifi','animaux'],false,false,'Petit hôtel bohème dans le plus vieux quartier de Marseille.'],
  ['Chartrons Wine Hôtel','Bordeaux','Chartrons',4,179,8.9,466,1.7,['wifi','restaurant','clim','parking'],true,true,'Ancien chai reconverti, bar à vins et dégustations le soir.'],
  ['Bordeaux Centre Éco','Bordeaux','Saint-Pierre',2,79,7.4,1532,0.5,['wifi'],false,true,'Le meilleur rapport qualité-prix du centre historique.'],
  ["Le Miroir d'Eau",'Bordeaux','Quinconces',5,420,9.5,198,0.3,['wifi','spa','piscine','restaurant','salle_sport','clim'],true,true,"Hôtel de luxe face au miroir d'eau, rooftop panoramique."]
].map((r, i) => ({ id: i + 1, nom: r[0], ville: r[1], quartier: r[2], etoiles: r[3], prix_nuit: r[4], note: r[5], nb_avis: r[6],
  distance_centre_km: r[7], equipements: r[8], petit_dejeuner_inclus: r[9], annulation_gratuite: r[10], description: r[11] }));

const db = (SUPABASE_URL && SUPABASE_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat('fr-FR');

// --- Construction des filtres ---
const equipBox = $('equipements');
Object.entries(EQUIPEMENTS).forEach(([code, label]) => {
  const l = document.createElement('label'); l.className = 'check';
  const i = document.createElement('input'); i.type = 'checkbox'; i.name = 'equipements'; i.value = code;
  l.append(i, label); equipBox.append(l);
});

function readFilters() {
  const checked = (name) => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map((i) => i.value);
  return {
    q: $('q').value.trim(),
    pays: $('pays').value,
    region: $('region').value,
    reseau: $('reseau').value,
    ville: $('ville').value,
    etoiles: checked('etoiles').map(Number),
    pmin: $('pmin').value === '' ? null : Number($('pmin').value),
    pmax: $('pmax').value === '' ? null : Number($('pmax').value),
    note: Number($('note').value),
    equipements: checked('equipements'),
    petitDej: $('petit_dej').checked,
    annulation: $('annulation').checked,
    tri: $('tri').value
  };
}

const SORTS = {
  note_desc: ['note', false], prix_asc: ['prix_nuit', true], prix_desc: ['prix_nuit', false],
  etoiles_desc: ['etoiles', false], distance_asc: ['distance_centre_km', true]
};

// --- Requête Supabase (filtrage côté base) ---
const PAGE = 30;
async function fetchSupabase(f, page) {
  let q = db.from('hotels').select('*', { count: 'exact' });
  if (f.pays) q = q.eq('pays', f.pays);
  if (f.region) q = q.eq('region', f.region);
  if (f.reseau) q = q.eq('reseau', f.reseau);
  if (f.q) {
    const s = f.q.replace(/[%,()]/g, ' ');
    q = q.or(`nom.ilike.%${s}%,quartier.ilike.%${s}%,ville.ilike.%${s}%`);
  }
  if (f.ville) q = q.eq('ville', f.ville);
  if (f.etoiles.length) q = q.in('etoiles', f.etoiles);
  if (f.pmin != null) q = q.gte('prix_nuit', f.pmin);
  if (f.pmax != null) q = q.lte('prix_nuit', f.pmax);
  if (f.note > 0) q = q.gte('note', f.note);
  if (f.equipements.length) q = q.contains('equipements', f.equipements);
  if (f.petitDej) q = q.eq('petit_dejeuner_inclus', true);
  if (f.annulation) q = q.eq('annulation_gratuite', true);
  const [col, asc] = SORTS[f.tri];
  q = q.order(col, { ascending: asc, nullsFirst: false }).order('nom').range(page * PAGE, page * PAGE + PAGE - 1);
  const { data, error, count } = await q;
  if (error) throw error;
  return { rows: data, total: count };
}

// --- Même logique en local pour les données de démo ---
function filterDemo(f) {
  const norm = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const nq = norm(f.q);
  const rows = DEMO.filter((h) =>
    (!f.pays || f.pays === 'France') &&
    (!f.region || f.region === DEMO_REGION[h.ville]) &&
    !f.reseau &&
    (!nq || norm(h.nom).includes(nq) || norm(h.quartier).includes(nq) || norm(h.ville).includes(nq)) &&
    (!f.ville || h.ville === f.ville) &&
    (!f.etoiles.length || f.etoiles.includes(h.etoiles)) &&
    (f.pmin == null || h.prix_nuit >= f.pmin) &&
    (f.pmax == null || h.prix_nuit <= f.pmax) &&
    (!(f.note > 0) || h.note >= f.note) &&
    f.equipements.every((e) => h.equipements.includes(e)) &&
    (!f.petitDej || h.petit_dejeuner_inclus) &&
    (!f.annulation || h.annulation_gratuite)
  );
  const [col, asc] = SORTS[f.tri];
  rows.sort((a, b) => (asc ? a[col] - b[col] : b[col] - a[col]) || a.id - b.id);
  return { rows, total: rows.length };
}

// --- Affichage ---
const PALETTE = ['#2F353D', '#2B7499', '#4A5560', '#3A6F86', '#21262D', '#55707E'];
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function initials(n) { return n.replace(/^(le|la|les|l'|hôtel|hotel)\s+/i, '').split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase(); }

function render(rows, total, append) {
  const list = $('list'); if (!append) list.textContent = '';
  $('count').innerHTML = `<strong>${fmt.format(total)}</strong> hôtel${total > 1 ? 's' : ''} trouvé${total > 1 ? 's' : ''}`;
  if (!rows.length && !append) { list.append(el('p', 'empty', 'Aucun hôtel ne correspond à ces critères. Essayez d’élargir vos filtres.')); return; }
  rows.forEach((h) => {
    const card = el('article', 'card');
    if (h.source === 'osm') card.dataset.osm = '1';
    const thumb = el('div', 'thumb', initials(h.nom));
    thumb.style.background = PALETTE[h.id % PALETTE.length];
    thumb.setAttribute('aria-hidden', 'true');
    const body = el('div', 'body');
    const top = el('div', 'top');
    const loc = [h.quartier, h.ville, h.province && h.province !== h.ville ? h.province : null, h.pays && h.pays !== 'France' ? h.pays : null].filter(Boolean).join(', ');
    const title = el('div'); title.append(el('h2', null, h.nom), el('p', 'loc', `${loc}${h.distance_centre_km != null ? ' · ' + String(h.distance_centre_km).replace('.', ',') + ' km du centre' : ''}`));
    let stars;
    if (h.etoiles) { stars = el('span', 'stars', '★'.repeat(h.etoiles)); stars.setAttribute('aria-label', `${h.etoiles} étoile${h.etoiles > 1 ? 's' : ''}`); }
    else stars = el('span', 'stars na', 'Étoiles n.c.');
    top.append(title, stars);
    body.append(top);
    if (h.description) body.append(el('p', 'desc', h.description));
    else if (h.adresse) body.append(el('p', 'desc', h.adresse));
    const tags = el('div', 'tags');
    if (h.reseau) tags.append(el('span', 'tag net', h.reseau));
    if (h.petit_dejeuner_inclus) tags.append(el('span', 'tag ok', 'Petit-déjeuner inclus'));
    if (h.annulation_gratuite) tags.append(el('span', 'tag ok', 'Annulation gratuite'));
    (h.equipements || []).forEach((e) => tags.append(el('span', 'tag', EQUIPEMENTS[e] || e)));
    body.append(tags);
    const bottom = el('div', 'bottom');
    const score = el('div', 'score');
    if (h.note != null) { score.append(el('b', null, String(h.note).replace('.', ','))); score.append(`${fmt.format(h.nb_avis)} avis`); }
    else if (h.site_web) { const a = el('a', 'site', 'Site de l’hôtel ↗'); a.href = h.site_web; a.target = '_blank'; a.rel = 'noopener nofollow'; score.append(a); }
    const price = el('div', 'price');
    if (h.prix_nuit != null) price.append(el('strong', null, fmt.format(h.prix_nuit) + ' €'), el('span', null, 'par nuit'));
    else price.append(el('strong', 'na', 'Prix non communiqué'));
    bottom.append(score, price);
    body.append(bottom);
    card.append(thumb, body);
    list.append(card);
  });
}

let seq = 0, page = 0;
async function refresh(append) {
  const f = readFilters();
  $('note-val').textContent = f.note > 0 ? `${String(f.note).replace('.', ',')}+` : 'Toutes';
  page = append ? page + 1 : 0;
  const my = ++seq;
  try {
    const res = db ? await fetchSupabase(f, page) : filterDemo(f);
    if (my !== seq) return;
    render(res.rows, res.total, append);
    const shown = $('list').querySelectorAll('.card').length;
    $('more').hidden = shown >= res.total;
    $('credit').hidden = !$('list').querySelector('.card[data-osm]');
  } catch (err) {
    console.error(err);
    if (my !== seq) return;
    $('list').textContent = '';
    $('list').append(el('p', 'error', 'Impossible de charger les hôtels. Vérifiez la table « hotels » et la configuration Supabase (F12 › Console pour le détail).'));
    $('count').textContent = '';
  }
}

let t;
function debounced() { clearTimeout(t); t = setTimeout(refresh, 250); }
$('filters').addEventListener('input', (e) => (e.target.type === 'search' || e.target.type === 'number' ? debounced() : refresh()));
$('filters').addEventListener('change', (e) => {
  if (e.target.id === 'pays') { fillRegions(); fillVilles(); }
  if (e.target.id === 'region') fillVilles();
  refresh();
});
$('tri').addEventListener('change', () => refresh());
$('more').addEventListener('click', () => refresh(true));
$('btn-reset').addEventListener('click', () => { $('filters').reset(); fillRegions(); fillVilles(); refresh(); });

const DEMO_REGION = { Paris: 'Île-de-France', Lyon: 'Auvergne-Rhône-Alpes', Nice: 'Provence-Alpes-Côte d\'Azur', Marseille: 'Provence-Alpes-Côte d\'Azur', Bordeaux: 'Nouvelle-Aquitaine' };
let PLACES = []; // [{pays, region, ville, reseau}]
function fillSelect(sel, values) {
  const keep = sel.value;
  sel.length = 1;
  values.sort((a, b) => a.localeCompare(b, 'fr')).forEach((v) => { const o = el('option', null, v); o.value = v; sel.append(o); });
  sel.value = values.includes(keep) ? keep : '';
}
function fillRegions() {
  const pa = $('pays').value;
  fillSelect($('region'), [...new Set(PLACES.filter((p) => !pa || p.pays === pa).map((p) => p.region).filter(Boolean))]);
}
function fillVilles() {
  const pa = $('pays').value, r = $('region').value, sel = $('ville'), keep = sel.value;
  sel.length = 1;
  const villes = [...new Set(PLACES.filter((p) => (!pa || p.pays === pa) && (!r || p.region === r)).map((p) => p.ville).filter(Boolean))];
  villes.sort((a, b) => a.localeCompare(b, 'fr')).forEach((v) => { const o = el('option', null, v); o.value = v; sel.append(o); });
  sel.value = villes.includes(keep) ? keep : '';
}
async function init() {
  if (db) {
    $('source').textContent = 'Données : Supabase';
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await db.from('hotels').select('pays, region, ville, reseau').range(from, from + 999);
      if (error || !data) break;
      all.push(...data); if (data.length < 1000) break;
    }
    PLACES = all.map((p) => ({ pays: p.pays || 'France', region: p.region, ville: p.ville, reseau: p.reseau }));
  } else {
    $('source').textContent = 'Données de démo (Supabase non configuré)';
    PLACES = DEMO.map((h) => ({ pays: 'France', region: DEMO_REGION[h.ville], ville: h.ville }));
  }
  fillSelect($('pays'), [...new Set(PLACES.map((p) => p.pays).filter(Boolean))]);
  fillRegions();
  const reseaux = [...new Set(PLACES.map((p) => p.reseau).filter(Boolean))].sort();
  reseaux.forEach((v) => { const o = el('option', null, v); o.value = v; $('reseau').append(o); });
  $('reseau-field').hidden = !reseaux.length;
  fillVilles();
  refresh();
}
init();
</script>
