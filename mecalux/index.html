.cb.t-depl,.sw.t-depl{background:#1F6F78;color:#fff;border-color:#1F6F78}.cb.t-rd,.sw.t-rd{background:#8A5A00;color:#fff;border-color:#8A5A00}.cb.t-conge,.sw.t-conge{background:#2E6B4F;color:#fff;border-color:#2E6B4F}
.cb{font-size:11px}.sw{min-width:20px;width:auto;padding:0 3px}
.cb.bc{height:22px;font-size:10.5px;border-style:dashed;margin-bottom:6px}
.cb.b-H,.sw.b-H{background:#F3E6EC;color:#5f3d4d;border:1px solid #C187A1}.cb.b-J,.sw.b-J{background:#DCE5F2;color:#21324E;border:1px solid #8FA3C0}
.cb.b-P,.sw.b-P{background:#FBF0D9;color:#6B4700;border:1px solid #D9B25E}
.cal tr.rt th.cn{vertical-align:top;padding-top:6px}
.cb:disabled{cursor:default}.cb:disabled:not([class*=' t-']){opacity:.6}
.cb:focus-visible{outline:2px solid var(--plum);outline-offset:1px}
.sw{display:inline-flex;width:20px;height:20px;border-radius:5px;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:6px;border:1px solid}
.tabs button.on .sw{border-color:#fff}
.tbl th button.tri{font:inherit;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;display:inline-flex;gap:2px;align-items:center}
.tbl th button.tri:hover,.tbl th[aria-sort=ascending] button.tri,.tbl th[aria-sort=descending] button.tri{color:var(--navy)}
.tbl tr.frow th{padding:6px 6px 10px;border-bottom:1px solid var(--line2);text-transform:none;letter-spacing:0}
.tbl tr.frow input,.tbl tr.frow select{width:100%;min-width:70px;min-height:34px;padding:6px 8px;font-size:13px;font-weight:400;border-radius:8px}
.tbl tr.frow input.on,.tbl tr.frow select.on{border-color:var(--plum);background:var(--blush)}
@media(max-width:600px){.grid2{grid-template-columns:1fr}h1{font-size:26px}}
</style>

(function(){
"use strict";
/* ---------- constantes ---------- */
const COLLS=['projets','ressources','affectations','temps','frais','estimations','prefactures','calendrier'];
/* Barèmes Harington · déplacements Mecalux (livret d'accueil CDC Mecalux) */
const DEFAULT_REGLES={

     regle:'Hors Île-de-France avec hébergement : hôtel 56 € + déjeuner 20 € + dîner 20 € par jour (hôtel au réel possible si justifié). Sans hébergement : déjeuner 20 €. Location voiture 40 € par jour travaillé et facturé. Carburant, péage, avion, train, bus au réel avec justificatif.'},
    {id:'tn',nom:'Collaborateur Tunisie',hebergement:'reel',hotel:0,hotelEstime:90,dejeuner:0,diner:0,perDiem:70,location:'reel',locationJour:0,locationEstimee:50,
     regle:'Per diem 70 € par jour hors hébergement. Hébergement, billet d\'avion, location voiture, carburant, péage, train et bus au réel, justificatif obligatoire dans Pleo.'}
  ],
  estimations:{carburantKm:0.12,peageKm:0.07,carburantJourSite:10,trainAR:150,avionAR:350},
  seuilJourneeKm:80, nuitsParSemaine:4, arriveeVeille:true,
  trajetFacture:false, trajetCoef:0.5,
  margeFrais:0, fraisRefacturablesParDefaut:true
};
const CAS={
  journee:{nom:'Déplacement à la journée',desc:'Retour au domicile chaque soir, pas d\'hôtel.'},
  semaine:{nom:'Grand déplacement · retour chaque week-end',desc:'Sur site du lundi au vendredi, un aller-retour par semaine.'},
  continu:{nom:'Grand déplacement · week-ends sur place',desc:'Reste sur site les week-ends, un seul aller-retour.'},
  ponctuel:{nom:'Intervention ponctuelle',desc:'Mission courte avec un seul aller-retour.'}
};
const STATUTS_PF=['Brouillon','Envoyée à Zakia','Validée Mecalux','BDC reçu','Facturée'];
const CAT_FRAIS=['Forfait hôtel','Hôtel (au réel)','Forfait repas','Per diem','Repas','Location voiture','Carburant','Péages','Train','Avion','Bus / taxi','Parking','Divers'];
const CAT_FORFAIT=['Forfait hôtel','Forfait repas','Per diem'];
const MOIS_FR=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOIS_LONG=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ---------- état ---------- */
const S={regles:clone(DEFAULT_REGLES),moisCfg:{},pleoAlias:{}};COLLS.forEach(c=>S[c]={});
let dbState='init', readOnly=false;
const ui={filtres:{tblRes:{6:'Actif'}},dashClient:'',dashRes:'',pfMois:curMonth(),saisieMois:curMonth(),saisieProjet:'',planStart:addMonths(curMonth(),-1),projTab:'synthese',
  calc:{projetId:'',ressourceId:'',cas:'semaine',profil:'fr',jours:10,km:500,mode:'voiture',location:true,nuitPrix:'',arPrix:'',arriveeVeille:null,tjm:''}};

/* ---------- utilitaires ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0}
const fmtE=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmtE2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
function eur(v){return fmtE.format(v||0)}function eur2(v){return fmtE2.format(v||0)}function nf(v){return fmtN.format(v||0)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function curMonth(){return today().slice(0,7)}
function addMonths(m,k){let [y,mo]=m.split('-').map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+String(mo).padStart(2,'0')}
function moisLabel(m){if(!m)return'';const [y,mo]=m.split('-');return MOIS_LONG[+mo-1]+' '+y}
function moisCourt(m){const [y,mo]=m.split('-');return MOIS_FR[+mo-1]+' '+y.slice(2)}
function dateFr(d){if(!d)return'—';const [y,m,j]=d.split('-');return +j+' '+MOIS_FR[+m-1]+' '+y}
function list(c){return Object.values(S[c])}
function byId(c,id){return S[c][id]}
function monthsBetween(a,b){if(!a||!b)return[];let out=[],m=a.slice(0,7),e=b.slice(0,7),g=0;while(m<=e&&g<60){out.push(m);m=addMonths(m,1);g++}return out}
function workdays(a,b){if(!a||!b||b<a)return 0;let n=0,d=new Date(a+'T12:00:00'),e=new Date(b+'T12:00:00');while(d<=e){const w=d.getDay();if(w&&w<6)n++;d.setDate(d.getDate()+1)}return n}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function profilById(id){const P=S.regles.profils||DEFAULT_REGLES.profils;return P.find(z=>z.id===id)||P[0]}
function estActif(r){return !!r&&r.actif!==false&&!(r.dateFin&&r.dateFin<today())}
function paysOf(id){return ({fr:'FR',tn:'TN'})[id]||profilById(id).nom}
function profilOfRes(rid){const r=byId('ressources',rid);return r&&r.profil||'fr'}
const ICON={
 dash:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
 proj:'<path d="M3 21V9l6-4v4l6-4v4l6-4v16z"/>',
 res:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/>',
 plan:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h5M10 17h6"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h4"/>',
 saisie:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/>',

/* ---------- calculs métier ---------- */
function tjmFor(pid,rid,phase){const a=list('affectations').find(x=>x.projetId===pid&&x.ressourceId===rid&&x.phase===phase)||list('affectations').find(x=>x.projetId===pid&&x.ressourceId===rid);if(a&&num(a.tjm))return num(a.tjm);const r=byId('ressources',rid);return r?num(r.tjmVente):0}
function phaseOf(p,d){d=d||today();if(p.cloture)return'termine';if(p.devDebut&&d<p.devDebut)return'avenir';if(p.devFin&&d<=p.devFin)return'dev';if(p.mesDebut&&d<p.mesDebut)return'inter';if(p.mesFin&&d<=p.mesFin)return'mes';if(p.mesFin&&d>p.mesFin)return'retard';return'avenir'}
const PHASE_LBL={avenir:['À venir',''],dev:['Développement','dev'],inter:['Avant mise en service','warn'],mes:['Mise en service','mes'],retard:['Dépassement','bad'],termine:['Terminé','ok']};
function phasePill(p){const k=phaseOf(p);return '<span class="pill '+PHASE_LBL[k][1]+'">'+PHASE_LBL[k][0]+'</span>'}
function projStats(pid){
  const aff=list('affectations').filter(a=>a.projetId===pid);
  const tmp=list('temps').filter(t=>t.projetId===pid);
  const fr=list('frais').filter(f=>f.projetId===pid&&f.statut!=='ecarte');
  const est=list('estimations').filter(e=>e.projetId===pid);
  const joursPrev=aff.reduce((s,a)=>s+num(a.joursPrevus),0);
  const montPrev=aff.reduce((s,a)=>s+num(a.joursPrevus)*(num(a.tjm)||num((byId('ressources',a.ressourceId)||{}).tjmVente)),0);
  const fraisPrev=est.reduce((s,e)=>s+num(e.totalFrais),0);
  const joursReal=tmp.reduce((s,t)=>s+num(t.jours),0);
  const montReal=tmp.reduce((s,t)=>s+num(t.jours)*tjmFor(pid,t.ressourceId,t.phase),0);
  const fraisBareme=list('calendrier').filter(c=>c.projetId===pid).reduce((s,c)=>s+resumeBaremes(c.baremes).montant,0);
  const fraisReal=fr.reduce((s,f)=>s+num(f.montant),0)+fraisBareme;
  const fraisRefac=fr.filter(f=>f.refacturable!==false).reduce((s,f)=>s+num(f.montant),0);
  const resIds=[...new Set(aff.map(a=>a.ressourceId))];
  return {joursPrev,montPrev,fraisPrev,joursReal,montReal,fraisReal,fraisRefac,resIds,totalPrev:montPrev+fraisPrev,totalReal:montReal+fraisReal};
}
const RUBRIQUES=[['prestation','Jours d\'intervention'],['bareme','Frais au barème'],['frais','Frais réels']];
function pfLines(pid,mois){
  const lines=[];const m=1+num(S.regles.margeFrais)/100;const marge=m!==1?' (+'+nf(S.regles.margeFrais)+' %)':'';
  const tmp=list('temps').filter(t=>t.projetId===pid&&t.mois===mois&&num(t.jours)>0);
  const fr=list('frais').filter(f=>f.projetId===pid&&f.mois===mois&&f.refacturable!==false&&f.statut!=='ecarte');
  const cals=list('calendrier').filter(c=>c.projetId===pid&&c.mois===mois&&c.baremes&&Object.keys(c.baremes).length);
  const rids=[...new Set(tmp.map(t=>t.ressourceId).concat(cals.map(c=>c.ressourceId),fr.map(f=>f.ressourceId||'')))];
  const nomDe=rid=>(byId('ressources',rid)||{}).nom||(rid?'?':'Sans collaborateur');
  rids.sort((x,y)=>nomDe(x).localeCompare(nomDe(y))).forEach(rid=>{const r=byId('ressources',rid)||{};const collab={id:rid,nom:nomDe(rid),code:r.code||''};
    ['dev','mes'].forEach(ph=>{const t=tmp.find(x=>x.ressourceId===rid&&x.phase===ph);if(!t)return;const tj=tjmFor(pid,rid,ph);
      lines.push({type:'prestation',collab,libelle:ph==='mes'?'Mise en service sur site':'Développement',qte:num(t.jours),unite:'j',pu:tj,montant:num(t.jours)*tj})});
    const c=cals.find(x=>x.ressourceId===rid);if(c){const n={};Object.values(c.baremes).forEach(b=>{if(BAREMES_J[b])n[b]=(n[b]||0)+1});
      ORDRE_B.filter(b=>n[b]).forEach(b=>{const mb=montantBareme(b);lines.push({type:'bareme',collab,libelle:'Barème '+b+' · '+BAREMES_J[b].nom+marge,qte:n[b],unite:'j',pu:mb.v*m,montant:n[b]*mb.v*m})})}
    const g={};fr.filter(f=>(f.ressourceId||'')===rid).forEach(f=>{const k=f.categorie||'Divers';g[k]=(g[k]||0)+num(f.montant)});
    Object.keys(g).sort().forEach(k=>lines.push({type:'frais',collab,libelle:k+marge,qte:1,unite:'forfait',pu:g[k]*m,montant:g[k]*m}));
  });
  return lines;
}
function pfGroupes(L){const out=[];L.forEach(l=>{const k=l.collab?l.collab.id:'';let g=out.find(x=>x.k===k);if(!g){g={k,collab:l.collab||null,lignes:[],jours:0,presta:0,bareme:0,frais:0,total:0};out.push(g)}
  g.lignes.push(l);g.total+=num(l.montant);if(l.type==='prestation'){g.jours+=num(l.qte);g.presta+=num(l.montant)}else if(l.type==='bareme')g.bareme+=num(l.montant);else g.frais+=num(l.montant)});return out}

/* calculateur de frais */
function calcFrais(c){
  const R=S.regles,P=profilById(c.profil),E=Object.assign({},DEFAULT_REGLES.estimations,R.estimations||{});
  const jours=Math.max(0,Math.round(num(c.jours)));
  const km=num(c.km);
  const sem=Math.max(1,Math.ceil(jours/5));
  const veille=c.arriveeVeille==null?R.arriveeVeille:c.arriveeVeille;
  const cas=c.cas;
  const lines=[],warn=[];
  if(cas==='journee'&&km>num(R.seuilJourneeKm))warn.push('La distance dépasse '+R.seuilJourneeKm+' km : un déplacement à la journée semble peu réaliste, vérifiez le cas choisi.');
  let nuits=0,nbAR=1,joursWE=0;
  if(cas==='journee'){nbAR=jours}
  else if(cas==='semaine'){nbAR=sem;nuits=Math.min(Math.max(0,jours-sem),sem*num(R.nuitsParSemaine));if(veille)nuits+=sem}
  else if(cas==='continu'){joursWE=2*(sem-1);nuits=Math.max(0,jours+joursWE-1)+(veille?1:0)}
  else {nuits=Math.max(0,jours-1)+(veille?1:0)}
  const presence=jours+joursWE; // jours passés sur place (travaillés + week-ends sur site)
  const R2=v=>Math.round(v*100)/100;
  // Hébergement
  if(nuits){
    const reelSaisi=num(c.nuitPrix);
    if(P.hebergement==='forfait'&&!reelSaisi)lines.push({k:'Hôtel (forfait)',d:nuits+' nuit'+(nuits>1?'s':'')+' × '+eur2(P.hotel),v:nuits*num(P.hotel),t:'forfait'});
    else{const pu=reelSaisi||num(P.hotelEstime);lines.push({k:'Hébergement (au réel)',d:nuits+' nuit'+(nuits>1?'s':'')+' × '+eur2(pu)+(reelSaisi?' (prix saisi)':' (estimation)'),v:nuits*pu,t:'reel'})}
  }
  // Repas / per diem
  if(num(P.perDiem)){lines.push({k:'Per diem hors hébergement',d:presence+' j × '+eur2(P.perDiem),v:presence*num(P.perDiem),t:'forfait'})}
  else{
    if(num(P.dejeuner))lines.push({k:'Déjeuner (forfait)',d:presence+' j × '+eur2(P.dejeuner),v:presence*num(P.dejeuner),t:'forfait'});
    const diners=cas==='journee'?0:nuits;
    if(diners&&num(P.diner))lines.push({k:'Dîner (forfait)',d:diners+' × '+eur2(P.diner),v:diners*num(P.diner),t:'forfait'});
  }
  // Transport principal
  const mode=cas==='journee'?'voiture':c.mode;
  if(mode==='voiture'){
    const kmTot=nbAR*2*km;
    lines.push({k:'Carburant trajets (au réel)',d:nf(kmTot)+' km × '+eur2(E.carburantKm)+' (estimation)',v:kmTot*num(E.carburantKm),t:'reel'});
    if(num(E.peageKm))lines.push({k:'Péages (au réel)',d:nf(kmTot)+' km × '+eur2(E.peageKm)+' (estimation)',v:kmTot*num(E.peageKm),t:'reel'});
  }else{
    const pu=num(c.arPrix)||num(mode==='train'?E.trainAR:E.avionAR);
    lines.push({k:(mode==='train'?'Train':'Avion')+' (au réel)',d:nbAR+' A/R × '+eur2(pu)+(num(c.arPrix)?' (prix saisi)':' (estimation)'),v:nbAR*pu,t:'reel'});
  }
  // Location de voiture : jours travaillés uniquement
  if(c.location){
    if(P.location==='forfait')lines.push({k:'Location voiture (forfait)',d:jours+' j travaillés × '+eur2(P.locationJour),v:jours*num(P.locationJour),t:'forfait'});
    else lines.push({k:'Location voiture (au réel)',d:presence+' j × '+eur2(P.locationEstimee)+' (estimation)',v:presence*num(P.locationEstimee),t:'reel'});
    if(mode!=='voiture'&&num(E.carburantJourSite))lines.push({k:'Carburant sur place (au réel)',d:jours+' j × '+eur2(E.carburantJourSite)+' (estimation)',v:jours*num(E.carburantJourSite),t:'reel'});
  }
  lines.forEach(l=>l.v=R2(l.v));
  const totalFrais=lines.reduce((s,l)=>s+l.v,0);
  const forfaits=lines.filter(l=>l.t==='forfait').reduce((s,l)=>s+l.v,0);
  const tjm=num(c.tjm)||(c.ressourceId?num((byId('ressources',c.ressourceId)||{}).tjmVente):0);
  const presta=jours*tjm;
  const trajetJ=R.trajetFacture&&cas!=='journee'?nbAR*num(R.trajetCoef):0;
  const trajet=trajetJ*tjm;
  const refac=totalFrais*(1+num(R.margeFrais)/100);
  return {lines,totalFrais,forfaits,reel:totalFrais-forfaits,tjm,presta,trajetJ,trajet,refac,total:presta+trajet+totalFrais,nuits,nbAR,jours,sem,warn,mode,profil:P};
}

const MODE_DEV=true;
const TBL=c=>'mecalux_'+c;
const toSnake=k=>k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase());
function toRow(c,id,obj){const row={id};const cols=TABLES[c];Object.keys(obj).forEach(k=>{const sk=toSnake(k);if(sk==='id'||!cols.includes(sk))return;let v=obj[k];if(v===''||v===undefined)v=null;row[sk]=v});return row}
const NUMS=['tjm_vente','tjm_cout','distance_km','budget_montant','jours_prevus','tjm','jours','montant','total_frais','trajet','refac'];
function fromRow(r){const o={};Object.keys(r).forEach(k=>{let v=r[k];if(v!=null&&typeof v!=='object'&&NUMS.includes(k))v=Number(v);if(v===null)v='';o[toCamel(k)]=v});return o}
let sb=null,session=null,membre=null,authMsg='',channel=null;
async function save(c,id,obj){
  obj=Object.assign({},obj);delete obj.id;obj.majLe=new Date().toISOString();
  const prev=S[c][id];S[c][id]=Object.assign({id},obj);scheduleRender();
  const {error}=await sb.from(TBL(c)).upsert(toRow(c,id,obj));
  if(error){if(prev)S[c][id]=prev;else delete S[c][id];handleErr(error);render();return false}
  return true;
}
async function del(c,id){
  const prev=S[c][id];delete S[c][id];render();
  const {error}=await sb.from(TBL(c)).delete().eq('id',id);
  if(error){if(prev)S[c][id]=prev;handleErr(error);render()}
}

function handleErr(e){
  console.error(e);
  if(e&&e.code==='23503')toast('Impossible : cet élément est encore utilisé ailleurs (affectations, jours ou frais).');
  else if(e&&(e.code==='42501'||/row-level security/i.test(e.message||'')))toast('Accès refusé : votre adresse n\'est pas dans l\'équipe autorisée.');
  else if(e&&e.code==='23514')toast('Valeur refusée par la base (dates ou statut incohérents).');
  else toast('Enregistrement impossible : '+((e&&e.message)||'réessayez.'));
}

async function loadAll(){
  dbState='loading';render();
  try{
    if(MODE_DEV){membre=true}else{
    const {data:ok,error:e0}=await sb.rpc('mecalux_est_membre');
    if(e0)throw e0;
    membre=!!ok;}
    if(!membre){dbState='refuse';render();return}
    const res=await Promise.all(COLLS.map(c=>sb.from(TBL(c)).select('*')));
    res.forEach((r,i)=>{if(r.error)throw r.error;const o={};r.data.forEach(row=>{o[row.id]=fromRow(row)});S[COLLS[i]]=o});
    const {data:cfgs,error:e1}=await sb.from(TBL('config')).select('id,data');if(e1)throw e1;
    const cfg=(cfgs||[]).find(c=>c.id==='regles');
    S.regles=cfg&&cfg.data?Object.assign(clone(DEFAULT_REGLES),cfg.data):clone(DEFAULT_REGLES);
    S.moisCfg={};(cfgs||[]).forEach(c=>{if(/^mois_/.test(c.id))S.moisCfg[c.id.slice(5)]=c.data||{};if(c.id==='pleo_alias')S.pleoAlias=c.data||{}});
    dbState='ok';
  }catch(e){console.error(e);dbState='erreur';authMsg=(e&&e.message)||''}
  render();
  subscribe();
}
function subscribe(){
  if(channel)return;
  channel=sb.channel('mecalux').on('postgres_changes',{event:'*',schema:'public'},p=>{
    const t=String(p.table||'').replace(/^mecalux_/,'');
    if(t==='config'){if(p.new&&p.new.id==='regles'&&p.new.data){S.regles=Object.assign(clone(DEFAULT_REGLES),p.new.data);scheduleRender()}
      else if(p.new&&/^mois_/.test(p.new.id||'')){S.moisCfg[p.new.id.slice(5)]=p.new.data||{};scheduleRender()}
      else if(p.new&&p.new.id==='pleo_alias'){S.pleoAlias=p.new.data||{}}return}
    if(!S[t])return;
    if(p.eventType==='DELETE'){if(p.old&&p.old.id)delete S[t][p.old.id]}
    else if(p.new&&p.new.id){S[t][p.new.id]=fromRow(p.new)}
    scheduleRender();
  }).subscribe();
}

  h+='</div>';
  return h;

function filtreLigne(tid,cols){

function appliquerTri(tbl){const t=(ui.tri||{})[tbl.id];tbl.querySelectorAll('button.tri').forEach(b=>{const on=t&&+b.dataset.tri===t.col;b.closest('th').setAttribute('aria-sort',on?(t.dir>0?'ascending':'descending'):'none');b.querySelector('.fl').textContent=on?(t.dir>0?' ▲':' ▼'):''});
  if(!t)return;const tb=tbl.tBodies[0];const val=tr=>{const c=tr.cells[t.col];if(!c)return '';const v=c.dataset.v;if(v!=null&&v!==''&&!isNaN(+v))return +v;return (v!=null?v:c.textContent).trim().toLowerCase()};
  [...tb.rows].sort((a,b)=>{const x=val(a),y=val(b);return (x<y?-1:x>y?1:0)*t.dir}).forEach(r=>tb.appendChild(r))}
function appliquerFiltres(tbl){
  const f=ui.filtres[tbl.id]||{};const keys=Object.keys(f).filter(k=>f[k]);
  const lignes=[...tbl.tBodies[0].rows];let vis=0;
  lignes.forEach(tr=>{
    const ok=keys.every(k=>{
      const v=String(f[k]).trim().toLowerCase();const cell=tr.cells[k];if(!cell)return true;
      const txt=cell.textContent.trim().toLowerCase();

/* jours effectifs du mois : lundi-vendredi hors jours fériés français (modifiable par mois) */
function paques(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),j=((h+l-7*m+114)%31)+1;return new Date(Date.UTC(y,mo-1,j))}
function feriesFR(y){const P=paques(y),add=(d,n)=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
  return [[y+'-01-01','Jour de l\'an'],[add(P,1),'Lundi de Pâques'],[y+'-05-01','Fête du Travail'],[y+'-05-08','Victoire 1945'],[add(P,39),'Ascension'],[add(P,50),'Lundi de Pentecôte'],[y+'-07-14','Fête nationale'],[y+'-08-15','Assomption'],[y+'-11-01','Toussaint'],[y+'-11-11','Armistice'],[y+'-12-25','Noël']]}
function joursOuvres(m){const [y,mo]=m.split('-').map(Number);const fer=feriesFR(y).filter(f=>f[0].slice(0,7)===m);const fs=new Set(fer.map(f=>f[0]));let n=0;const dim=new Date(y,mo,0).getDate();
  for(let d=1;d<=dim;d++){const iso=m+'-'+String(d).padStart(2,'0');const w=new Date(Date.UTC(y,mo-1,d)).getUTCDay();if(w&&w<6&&!fs.has(iso))n++}
  return {n,feries:fer.filter(f=>{const w=new Date(f[0]+'T12:00:00Z').getUTCDay();return w&&w<6})}}
function joursEffectifs(m){const c=S.moisCfg[m];return c&&c.joursEffectifs!=null&&c.joursEffectifs!==''?num(c.joursEffectifs):joursOuvres(m).n}
function phaseDefaut(pid,rid){const ph=list('affectations').filter(a=>a.projetId===pid&&a.ressourceId===rid).map(a=>a.phase);
  if(ph.includes('mes')&&!ph.includes('dev'))return 'mes';if(ph.includes('dev')&&!ph.includes('mes'))return 'dev';
  const p=byId('projets',pid);return p&&['mes','retard'].includes(phaseOf(p))?'mes':'dev'}
async function setJours(pid,rid,m,ph,v){const id=[pid,rid,m,ph].join('_');const cur=byId('temps',id);
  if(!v){if(cur)await del('temps',id);return}
  if(!cur||num(cur.jours)!==v)await save('temps',id,{projetId:pid,ressourceId:rid,mois:m,phase:ph,jours:v})}
async function moisComplet(pid,rid,m,coche){const je=joursEffectifs(m);
  if(coche){const ph=phaseDefaut(pid,rid),autre=ph==='dev'?'mes':'dev';await setJours(pid,rid,m,autre,0);await setJours(pid,rid,m,ph,je)}
  else{await setJours(pid,rid,m,'dev',0);await setJours(pid,rid,m,'mes',0)}}

const TYPES_J={dev:{c:'D',nom:'Développement',court:'Dév.'},mes:{c:'M',nom:'Mise en service',court:'MES'},depl:{c:'DP',nom:'Déplacement',court:'Dépl.'},rd:{c:'R',nom:'R&D',court:'R&D'},conge:{c:'C',nom:'Congés',court:'Congés',nonTravaille:true}};
const totalTravaille=rs=>Object.keys(TYPES_J).filter(k=>!TYPES_J[k].nonTravaille).reduce((x,k)=>x+rs[k].total,0);
/* barème de frais du jour (montants selon le pays du collaborateur, cf. Règles de frais) */

const BAREMES_J={H:{nom:'Avec hébergement',pays:'fr'},J:{nom:'Sans hébergement',pays:'fr'},P:{nom:'Per diem',pays:'tn'}};
const ORDRE_B=['H','J','P'];
function montantBareme(code){const F=profilById('fr'),T=profilById('tn');let v=0,reel=false;
  if(code==='H'){v=num(F.dejeuner)+num(F.diner);if(F.hebergement==='forfait')v+=num(F.hotel);else reel=true}
  else if(code==='J'){v=num(F.dejeuner)}
  else if(code==='P'){v=num(T.perDiem)}
  return {v,reel}}
function detailBareme(code){const F=profilById('fr'),T=profilById('tn');
  if(code==='H')return (F.hebergement==='forfait'?'hôtel '+eur(F.hotel):'hôtel au réel')+' + déjeuner '+eur(F.dejeuner)+' + dîner '+eur(F.diner)+' = '+eur(montantBareme('H').v)+' par jour';
  if(code==='J')return 'déjeuner '+eur(F.dejeuner)+' par jour';
  if(code==='P')return 'per diem '+eur(T.perDiem)+' par jour, hors hébergement';return ''}
const JS_COURT=['D','L','M','M','J','V','S'];
function calId(pid,rid,m){return [pid,rid,m].join('_')}
function calOf(pid,rid,m){return byId('calendrier',calId(pid,rid,m))}
function joursMois(m){const [y,mo]=m.split('-').map(Number);const fer={};feriesFR(y).forEach(f=>fer[f[0]]=f[1]);const dim=new Date(y,mo,0).getDate();const out=[];
  for(let d=1;d<=dim;d++){const iso=m+'-'+String(d).padStart(2,'0');const w=new Date(Date.UTC(y,mo-1,d)).getUTCDay();out.push({iso,d,w,we:w===0||w===6,ferie:fer[iso]||''})}return out}
function resumeJours(jours,m){const info={};joursMois(m).forEach(j=>info[j.iso]=j);const r={};Object.keys(TYPES_J).forEach(t=>r[t]={ouvre:0,we:0,ferie:0,total:0});
  Object.entries(jours||{}).forEach(([iso,t])=>{const j=info[iso];if(!j||!r[t])return;r[t][j.ferie?'ferie':j.we?'we':'ouvre']++;r[t].total++});return r}
function resumeBaremes(baremes,profil){const n={};let tot=0,reel=0;Object.values(baremes||{}).forEach(b=>{if(!BAREMES_J[b])return;n[b]=(n[b]||0)+1;const x=montantBareme(b,profil);tot+=x.v;if(x.reel)reel++});return {n,montant:tot,nuitsReel:reel}}

function draftOf(pid,rid,m,kind){const D=kind==='b'?(ui.draftB=ui.draftB||{}):(ui.draft=ui.draft||{});const k=calId(pid,rid,m);if(!D[k])D[k]=Object.assign({},((calOf(pid,rid,m)||{})[kind==='b'?'baremes':'jours'])||{});return D[k]}
async function saveCal(pid,rid,m,jours,extra){
  const cur=calOf(pid,rid,m)||{};jours=jours||cur.jours||{};const baremes=(extra&&extra.baremes)||cur.baremes||{};
  const r=resumeJours(jours,m);r.baremes=resumeBaremes(baremes,(byId('ressources',rid)||{}).profil);
  const ok=await save('calendrier',calId(pid,rid,m),Object.assign({projetId:pid,ressourceId:rid,mois:m,jours,baremes,resume:r,valide:!!cur.valide,valideLe:cur.valideLe||''},extra||{},{baremes}));
  if(ok){await setJours(pid,rid,m,'dev',r.dev.total);await setJours(pid,rid,m,'mes',r.mes.total)}
  return ok;
}
function cellClass(t,j){return 'cb'+(j.we?' we':'')+(j.ferie?' fe':'')+(t?' t-'+t:'')}
function bcellClass(b,j){return 'cb bc'+(j.we?' we':'')+(j.ferie?' fe':'')+(b?' b-'+b:'')}
function infoJour(iso){return joursMois(iso.slice(0,7)).find(x=>x.iso===iso)}
function majCellule(btn,v){const kind=btn.dataset.bcell?'b':'j';const iso=(btn.dataset.cell||btn.dataset.bcell).split('|')[1];const j=infoJour(iso);
  if(kind==='b'){btn.className=bcellClass(v,j);btn.textContent=v||''}else{btn.className=cellClass(v,j);btn.textContent=v?TYPES_J[v].c:''}}
const celluleDe=el=>el&&el.closest&&el.closest('[data-cell],[data-bcell]');
function peindre(btn){if(!paint||btn.disabled)return;const kind=btn.dataset.bcell?'b':'j';if(kind!==paint.kind)return;const [rid,iso]=(btn.dataset.cell||btn.dataset.bcell).split('|');const d=draftOf(paint.pid,rid,paint.m,kind);
  if(paint.val)d[iso]=paint.val;else delete d[iso];paint.rows.add(rid);majCellule(btn,paint.val)}
function debutPeinture(b){const pid=ui.saisieProjet||(list('projets')[0]||{}).id,m=ui.saisieMois;const kind=b.dataset.bcell?'b':'j';const [rid,iso]=(b.dataset.cell||b.dataset.bcell).split('|');const cur=draftOf(pid,rid,m,kind)[iso];
  const pz=kind==='b'?ui.pinceauB:ui.pinceau;paint={pid,m,kind,val:pz&&cur!==pz?pz:'',rows:new Set()};peindre(b)}
document.addEventListener('pointerdown',e=>{const b=celluleDe(e.target);if(!b||b.disabled||e.button>0)return;e.preventDefault();debutPeinture(b)});
document.addEventListener('pointermove',e=>{if(!paint)return;const b=celluleDe(document.elementFromPoint(e.clientX,e.clientY));if(b)peindre(b)});
async function finPeinture(){if(!paint)return;const p=paint;paint=null;const D=p.kind==='b'?ui.draftB:ui.draft;
  for(const rid of p.rows){const k=calId(p.pid,rid,p.m);if(p.kind==='b')await saveCal(p.pid,rid,p.m,null,{baremes:D[k]});else await saveCal(p.pid,rid,p.m,D[k]);delete D[k]}pending=false;render()}
document.addEventListener('pointerup',finPeinture);document.addEventListener('pointercancel',finPeinture);
document.addEventListener('click',async e=>{const b=celluleDe(e.target);if(!b||b.disabled||e.detail!==0)return; // clavier (Entrée / Espace)
  const sel=b.dataset.cell?'[data-cell="'+b.dataset.cell+'"]':'[data-bcell="'+b.dataset.bcell+'"]';debutPeinture(b);await finPeinture();const nb=document.querySelector(sel);if(nb)nb.focus()});

  if(/restauration|repas/.test(c))return 'Repas';if(/parking/.test(c)||/PARKING|PARC |COMMUNE DE|INDIGO|EFFIA|SAEMES|Q-PARK/.test(m))return 'Parking';

function suggestion(cat,cp){

async function enregistrerPleo(){const P=ui.pleo;const dec=P.lignes.filter(l=>l.d&&l.rid&&l.pid);const manque=P.lignes.filter(l=>l.d&&(!l.rid||!l.pid));
  if(!dec.length){toast('Aucune ligne décidée et complète (collaborateur et projet) à enregistrer.');return}
  toast('Enregistrement de '+dec.length+' dépenses…');let ok=0;const parMP={};
  for(const l of dec){const id=l.ex||('pleo_'+l.key);const cur=byId('frais',id)||{};
    const r=await save('frais',id,Object.assign({},cur,{projetId:l.pid,ressourceId:l.rid,mois:l.iso.slice(0,7),date:l.iso,categorie:l.cat,montant:l.mont,note:cur.note||'',refacturable:l.d==='valide'?l.refac:false,justif:true,dejaFacture:false,source:'pleo',statut:l.d,motif:l.d==='ecarte'?l.motif:'',pleoRef:l.key,marchand:l.mar,categoriePleo:l.cp}));
    if(r){ok++;l.ex=id;const k=l.pid+'|'+l.iso.slice(0,7);parMP[k]=(parMP[k]||0)+1}}
  ui.pleoMois=(P.lignes.map(l=>l.iso).sort()[0]||'').slice(0,7)||ui.pleoMois;
  const reste=P.lignes.filter(l=>!l.d||!l.rid||!l.pid);
  if(!reste.length){ui.pleo=null;toast(ok+' dépenses enregistrées, réparties sur '+Object.keys(parMP).length+' projet(s) et mois')}
  else{P.lignes=reste;P.f={collab:manque.some(l=>!l.rid)?'?':'',cat:'',dec:'',proj:manque.some(l=>!l.pid)?'?':''};toast(ok+' dépenses enregistrées. Il reste '+reste.length+' ligne(s) à trier ou à compléter.')}
  render()}

function pfCsv(key){const {p,m,pf,L,tot}=pfData(key);const q=s=>'"'+String(s).replace(/"/g,'""')+'"';const n=v=>String((+v).toFixed(2)).replace('.',',');const lib=t=>(RUBRIQUES.find(r=>r[0]===(t||'frais'))||[0,''])[1];
  return '\ufeff'+[['Client','Projet','Période','BDC','Trigramme','Collaborateur','Rubrique','Désignation','Quantité','Unité','PU HT','Montant HT'].map(q).join(';')].concat(L.map(l=>[p.client,p.nom,m,pf&&pf.bdc||'',l.collab?l.collab.code:'',l.collab?l.collab.nom:'',lib(l.type),l.libelle,n(l.qte),l.unite,n(l.pu),n(l.montant)].map((v,k)=>k>=8&&k!==9?v:q(v)).join(';'))).concat(RUBRIQUES.map(([t,lb])=>['','','','','','','','Total '+lb.toLowerCase(),'','','',n(totRub(L,t))].map((v,k)=>k===11?v:q(v)).join(';')),[['','','','','','','','Total HT','','','',n(tot)].map((v,k)=>k===11?v:q(v)).join(';')]).join('\r\n')}
function pfHtml(key){const {p,m,pf,L,tot}=pfData(key);return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Préfacture '+esc(p.client)+' '+m+'</title><style>body{font-family:Arial,sans-serif;color:#1B1C1C;max-width:800px;margin:40px auto;padding:0 20px}h1{color:#21324E;font-size:22px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}td.n,th.n{text-align:right}tfoot td{font-weight:bold;border-top:2px solid #21324E}.m{color:#4A5468;font-size:13px}</style></head><body><p class="m">PRÉFACTURE · POUR VALIDATION</p><h1>'+esc(p.client)+' · '+esc(p.nom)+'</h1><p class="m">'+esc(p.site||'')+(p.refMecalux?' · Réf. Mecalux '+esc(p.refMecalux):'')+'<br>Période : '+moisLabel(m)+(pf&&pf.bdc?'<br>Bon de commande : '+esc(pf.bdc):'')+'<br>Statut : '+esc(pf&&pf.statut||'À préparer')+'</p><table><thead><tr><th>Désignation</th><th class="n">Qté</th><th class="n">PU HT</th><th class="n">Montant HT</th></tr></thead><tbody>'+pfGroupes(L).map(g=>(g.collab?'<tr><td colspan="4" style="background:#21324E;color:#fff;font-weight:bold">'+esc(g.collab.nom)+(g.collab.code?' ('+esc(g.collab.code)+')':'')+'</td></tr>':'')+RUBRIQUES.map(([t,lib])=>{const ls=g.lignes.filter(l=>(l.type||'frais')===t);return ls.length?'<tr><td colspan="4" style="color:#784E61;font-weight:bold;font-size:12px;text-transform:uppercase">'+lib+'</td></tr>'+ls.map(l=>'<tr><td style="padding-left:22px">'+esc(l.libelle)+'</td><td class="n">'+nf(l.qte)+' '+esc(l.unite)+'</td><td class="n">'+eur2(l.pu)+'</td><td class="n">'+eur2(l.montant)+'</td></tr>').join(''):''}).join('')+(g.collab?'<tr><td colspan="3" class="n m">Sous-total '+esc(g.collab.nom)+'</td><td class="n"><b>'+eur2(g.total)+'</b></td></tr>':'')).join('')+'</tbody><tfoot>'+RUBRIQUES.map(([t,lib])=>'<tr><td colspan="3" style="font-weight:normal;border-top:0">Total '+lib.toLowerCase()+'</td><td class="n" style="font-weight:normal;border-top:0">'+eur2(totRub(L,t))+'</td></tr>').join('')+'<tr><td colspan="3">Total HT</td><td class="n">'+eur2(tot)+'</td></tr></tfoot></table>'+(pf&&pf.notes?'<p><b>Notes :</b> '+esc(pf.notes)+'</p>':'')+'</body></html>'}
function dl(filename,data){
  const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':'text/html;charset=utf-8';
  const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copié dans le presse-papiers')}catch(e){toast('Copie refusée par le navigateur.')}}

/* ---------- événements ---------- */
document.addEventListener('click',async e=>{
  const tb=e.target.closest('button.tri');if(tb){const tid=tb.dataset.t,col=+tb.dataset.tri;ui.tri=ui.tri||{};const cur=ui.tri[tid];ui.tri[tid]={col,dir:cur&&cur.col===col?-cur.dir:1};const tbl=document.getElementById(tid);if(tbl)appliquerTri(tbl);return}
  const a=e.target.closest('[data-pfmois],[data-calcproj],[data-saisieproj]');
  const pm=e.target.closest('[data-pleomois]');if(pm){ui.pleoMois=pm.dataset.pleomois;setTimeout(render,0)}
  if(a){if(a.dataset.pfmois)ui.pfMois=a.dataset.pfmois;if(a.dataset.calcproj){const p=byId('projets',a.dataset.calcproj);ui.calc.projetId=p.id;if(p.distanceKm)ui.calc.km=p.distanceKm;const wd=workdays(p.mesDebut,p.mesFin);if(wd)ui.calc.jours=wd;const af=list('affectations').find(x=>x.projetId===p.id&&x.phase==='mes');if(af){ui.calc.ressourceId=af.ressourceId;ui.calc.profil=profilOfRes(af.ressourceId);if(num(af.tjm))ui.calc.tjm=af.tjm}}if(a.dataset.saisieproj)ui.saisieProjet=a.dataset.saisieproj;if(a.dataset.saisiemois)ui.saisieMois=a.dataset.saisiemois}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==='logout'){await sb.auth.signOut();return}if(act==='pwd'){formPwd();return}if(act==='reload'){loadAll();return}
  switch(act){
    case'newProjet':formProjet();break;
    case'editProjet':formProjet(byId('projets',id));break;
    case'delProjet':confirmBox('Supprimer ce projet ? Ses affectations, jours saisis, frais, estimations et préfactures seront supprimés aussi.',async()=>{await del('projets',id);location.hash='projets'});break;
    case'jeffReset':{const mm=b.dataset.m;S.moisCfg[mm]=Object.assign({},S.moisCfg[mm],{joursEffectifs:null});const {error}=await sb.from(TBL('config')).upsert({id:'mois_'+mm,data:S.moisCfg[mm],maj_le:new Date().toISOString()});if(error)handleErr(error);render();break}
    case'pinceau':ui.pinceau=b.dataset.t;render();break;
    case'pinceauB':ui.pinceauB=b.dataset.t;render();break;
    case'calBareme':case'calBaremeAll':{const pid=ui.saisieProjet||(list('projets')[0]||{}).id,m=ui.saisieMois;const bz=ui.pinceauB;
      const rids=act==='calBaremeAll'?[...new Set([...document.querySelectorAll('[data-bcell]')].filter(x=>!x.disabled).map(x=>x.dataset.bcell.split('|')[0]))]:[b.dataset.rid];let n=0;
      for(const rid of rids){const c=calOf(pid,rid,m);if(c&&c.valide)continue;const jours=(c&&c.jours)||{};const bar=Object.assign({},(c&&c.baremes)||{});
        Object.entries(jours).forEach(([iso,t])=>{if(TYPES_J[t]&&TYPES_J[t].nonTravaille)return;if(bz)bar[iso]=bz;else delete bar[iso];n++});await saveCal(pid,rid,m,null,{baremes:bar})}
      toast(n?n+' jour'+(n>1?'s':'')+' : '+(bz?BAREMES_J[bz].nom:'barème retiré'):'Aucun jour travaillé saisi : choisissez d\'abord les jours.');render();break}
    case'calFill':case'calFillAll':case'calClear':{const pid=ui.saisieProjet||(list('projets')[0]||{}).id,m=ui.saisieMois;const t=ui.pinceau||'dev';
      const rids=act==='calFillAll'?[...new Set([...document.querySelectorAll('[data-cell]')].filter(x=>!x.disabled).map(x=>x.dataset.cell.split('|')[0]))]:[b.dataset.rid];
      for(const rid of rids){const c=calOf(pid,rid,m);if(c&&c.valide)continue;const d=Object.assign({},(c&&c.jours)||{});
        if(act==='calClear'){Object.keys(d).forEach(k=>delete d[k])}else{joursMois(m).filter(j=>!j.we&&!j.ferie).forEach(j=>d[j.iso]=t)}
        await saveCal(pid,rid,m,d,act==='calClear'?{baremes:{}}:undefined)}
      toast(act==='calClear'?'Jours effacés':'Jours ouvrés remplis ('+TYPES_J[t].nom+')');render();break}
    case'calValider':case'calRouvrir':{const pid=ui.saisieProjet||(list('projets')[0]||{}).id,m=ui.saisieMois;const val=act==='calValider';
      const cs=list('calendrier').filter(c=>c.projetId===pid&&c.mois===m&&Object.keys(c.jours||{}).length);
      for(const c of cs)await saveCal(pid,c.ressourceId,m,c.jours,{valide:val,valideLe:val?new Date().toISOString():''});
      toast(val?'Mois validé : '+cs.length+' ressource'+(cs.length>1?'s':''):'Saisie rouverte');render();break}
    case'reintegrer':{const f=byId('frais',id);if(f){await save('frais',id,Object.assign({},f,{statut:'valide',motif:'',refacturable:true}));toast('Frais réintégré')}break}
    case'pleoDec':{const tr=b.closest('tr[data-pi]');const l=ui.pleo.lignes[+tr.dataset.pi];l.d=b.dataset.v;if(l.d==='ecarte'&&!l.motif)l.motif=l.aide||'';render();break}
    case'pleoMasse':{const P=ui.pleo,F=P.f;const match=l=>(!F.collab||(F.collab==='?'?!l.rid:l.rid===F.collab))&&(!F.cat||l.cat===F.cat)&&(!F.dec||(F.dec==='trier'?!l.d:l.d===F.dec))&&(!F.proj||(F.proj==='?'?!l.pid:l.pid===F.proj));
      let n=0;P.lignes.filter(match).forEach(l=>{l.d=b.dataset.v;if(l.d==='ecarte'&&!l.motif)l.motif=l.aide||'';n++});toast(n+' ligne'+(n>1?'s':'')+' mise'+(n>1?'s':'')+' à jour');render();break}
    case'pleoMasseProjet':{const P=ui.pleo,F=P.f;const v=(document.querySelector('[data-pmp]')||{}).value;if(!v){toast('Choisissez d\'abord un projet.');break}
      const match=l=>(!F.collab||(F.collab==='?'?!l.rid:l.rid===F.collab))&&(!F.cat||l.cat===F.cat)&&(!F.dec||(F.dec==='trier'?!l.d:l.d===F.dec))&&(!F.proj||(F.proj==='?'?!l.pid:l.pid===F.proj));
      let n=0;P.lignes.filter(match).forEach(l=>{l.pid=v;l.via='manuel';n++});toast(n+' ligne'+(n>1?'s':'')+' affectée'+(n>1?'s':''));render();break}
    case'pleoSave':await enregistrerPleo();break;
    case'pleoFermer':ui.pleo=null;render();break;
    case'ecarterFrais':{const f=byId('frais',id);if(!f)break;openForm('Écarter la dépense',[{k:'motif',l:'Motif d\'écart',req:true,full:true,ph:'Ex. repas couvert par le per diem, déjà facturé…'}],{motif:f.motif||''},async o=>{const ok=await save('frais',id,Object.assign({},f,{statut:'ecarte',motif:o.motif,refacturable:false}));if(ok)toast('Dépense écartée');return ok});break}
    case'razFiltres':ui.filtres[b.dataset.t]={};render();break;
    case'newRes':formRes();break;
    case'editRes':formRes(byId('ressources',id));break;
    case'newAff':formAff(id);break;
    case'editAff':{const x=byId('affectations',id);formAff(x.projetId,x);break}
    case'newFrais':formFrais();break;
    case'editFrais':formFrais(byId('frais',id));break;
    case'planPrev':ui.planStart=addMonths(ui.planStart,-3);render();break;
    case'planNext':ui.planStart=addMonths(ui.planStart,3);render();break;
    case'saveEst':{const c=ui.calc;if(!c.projetId)return;const r=calcFrais(c);const lib=(document.getElementById('estLib')||{}).value||'Estimation';
      const ok=await save('estimations',c.estId||uid('e'),{projetId:c.projetId,ressourceId:c.ressourceId,libelle:lib,params:{cas:c.cas,profil:c.profil,arPrix:c.arPrix,jours:c.jours,km:c.km,mode:c.mode,location:c.location,nuitPrix:c.nuitPrix,arriveeVeille:c.arriveeVeille,tjm:c.tjm},detail:r.lines.map(l=>({k:l.k,d:l.d,v:l.v,t:l.t})),totalFrais:Math.round(r.totalFrais*100)/100,trajet:Math.round(r.trajet*100)/100,refac:Math.round(r.refac*100)/100});
      if(ok){toast('Estimation enregistrée sur le projet');c.estId=null}break}
    case'copyEst':{const r=calcFrais(ui.calc);copy(r.lines.map(l=>l.k+' ('+l.d+') : '+eur2(l.v)).join('\n')+'\nTotal frais : '+eur2(r.totalFrais)+'\nPrestation : '+eur2(r.presta)+(r.trajet?'\nTemps de trajet : '+eur2(r.trajet):'')+'\nCoût total : '+eur2(r.presta+r.trajet+r.refac));break}
    case'loadEst':{const x=byId('estimations',id);Object.assign(ui.calc,x.params||{},{projetId:x.projetId,ressourceId:x.ressourceId,libelle:x.libelle,estId:x.id});location.hash='calculateur';break}
    case'delEst':confirmBox('Supprimer cette estimation ?',()=>del('estimations',id));break;
    case'pfSave':case'pfRefresh':{const key=b.dataset.k;const i=key.lastIndexOf('_');const pid=key.slice(0,i),m=key.slice(i+1);const pf=pfOf(pid,m)||{};
      const o={projetId:pid,mois:m,statut:act==='pfSave'?document.getElementById('pfStatut').value:(pf.statut||'Brouillon'),bdc:act==='pfSave'?document.getElementById('pfBdc').value.trim():(pf.bdc||''),notes:act==='pfSave'?document.getElementById('pfNotes').value:(pf.notes||''),lignes:pfLines(pid,m).map(l=>Object.assign({},l,{pu:Math.round(l.pu*100)/100,montant:Math.round(l.montant*100)/100}))};
      if(o.statut==='BDC reçu'&&!o.bdc){toast('Saisissez le numéro du BDC.');document.getElementById('pfBdc').focus();return}
      const hist=(pf.historique||[]).slice(-19);if(pf.statut!==o.statut)hist.push({statut:o.statut,le:new Date().toISOString()});o.historique=hist;
      if(await save('prefactures',key,o))toast('Préfacture enregistrée');break}
    case'pfCsv':dl(pfFile(b.dataset.k)+'.csv',pfCsv(b.dataset.k));break;
    case'pfHtml':dl(pfFile(b.dataset.k)+'.html',pfHtml(b.dataset.k));break;
    case'pfCopy':copy(pfText(b.dataset.k));break;
    case'addProfil':{const r=readRegles();r.profils.push({id:uid('b'),nom:'Nouveau barème',hebergement:'reel',hotel:0,hotelEstime:90,dejeuner:0,diner:0,perDiem:0,location:'reel',locationJour:0,locationEstimee:50,regle:''});S.regles=r;render();break}
    case'delProfil':{const r=readRegles();if(r.profils.length<2){toast('Gardez au moins un barème.');return}r.profils.splice(+b.dataset.i,1);S.regles=r;render();break}
    case'saveRegles':await saveRegles(readRegles());toast('Règles enregistrées');break;
    case'resetRegles':confirmBox('Remplacer vos règles par les valeurs par défaut ?',async()=>{await saveRegles(clone(DEFAULT_REGLES));toast('Valeurs par défaut rétablies')});break;
  }
});
function readRegles(){
  const r=clone(S.regles);const m=document.getElementById('main');
  m.querySelectorAll('[data-r]').forEach(el=>{r[el.dataset.r]=el.type==='checkbox'?el.checked:num(el.value)});
  r.estimations=Object.assign({},DEFAULT_REGLES.estimations,r.estimations||{});
  m.querySelectorAll('[data-e]').forEach(el=>{r.estimations[el.dataset.e]=num(el.value)});
  m.querySelectorAll('[data-pi]').forEach(box=>{const z=r.profils[+box.dataset.pi];box.querySelectorAll('[data-z]').forEach(el=>{const k=el.dataset.z;z[k]=['nom','regle','hebergement','location'].includes(k)?el.value:num(el.value)})});
  return r;
}
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.ui){ui[t.dataset.ui]=t.value;pending=false;render();return}
  if(t.dataset.c){const k=t.dataset.c;ui.calc[k]=t.type==='checkbox'?t.checked:t.value;
    if(k==='projetId'&&t.value){const p=byId('projets',t.value);if(p){if(p.distanceKm)ui.calc.km=p.distanceKm;const wd=workdays(p.mesDebut,p.mesFin);if(wd)ui.calc.jours=wd}}
    if(k==='ressourceId'){ui.calc.tjm='';if(t.value)ui.calc.profil=profilOfRes(t.value)}
    if(['cas','projetId','ressourceId','mode','profil'].includes(k)){pending=false;render()}else renderCalcResult();return}
  if(t.dataset.pleo){const f=t.files&&t.files[0];t.value='';if(f)chargerFichierPleo(f);return}
  if(t.dataset.pf&&ui.pleo){ui.pleo.f[t.dataset.pf]=t.value;pending=false;render();return}
  if(t.dataset.pk&&ui.pleo){const tr=t.closest('tr[data-pi]');if(!tr)return;const l=ui.pleo.lignes[+tr.dataset.pi];const k=t.dataset.pk;
    if(k==='refac'){l.refac=t.checked;return}
    if(k==='motif'){l.motif=t.value;return}
    if(k==='rid'){const cle=cleOwner(l.owner);ui.pleo.lignes.filter(x=>cleOwner(x.owner)===cle&&!x.ex).forEach(x=>{x.rid=t.value;if(!x.pid||x.via!=='manuel'){const pp=projetPour(x.rid,x.iso);x.pid=pp.pid;x.via=pp.via}});if(t.value)memoriserAlias(l.owner,t.value)}
    else if(k==='pid'){l.pid=t.value;l.via=t.value?'manuel':''}
    else l[k]=t.value;
    pending=false;render();return}
  if(t.dataset.jeff){const mm=t.dataset.jeff;const v=t.value===''?null:num(t.value);S.moisCfg[mm]=Object.assign({},S.moisCfg[mm],{joursEffectifs:v});
    const {error}=await sb.from(TBL('config')).upsert({id:'mois_'+mm,data:S.moisCfg[mm],maj_le:new Date().toISOString()});if(error)handleErr(error);else toast('Jours effectifs enregistrés');pending=false;render();return}
  if(t.dataset.mc||t.dataset.mcall){const pid=ui.saisieProjet||(list('projets')[0]||{}).id;const m=ui.saisieMois;
    const ids=t.dataset.mcall?[...document.querySelectorAll('[data-mc]')].map(x=>x.dataset.mc):[t.dataset.mc];
    for(const rid of ids)await moisComplet(pid,rid,m,t.checked);
    toast(t.checked?'Mois complet enregistré':'Jours effacés');pending=false;render();return}
  if(t.dataset.temps){const [rid,ph]=t.dataset.temps.split('|');const pid=ui.saisieProjet||(list('projets')[0]||{}).id;const m=ui.saisieMois;const id=[pid,rid,m,ph].join('_');const v=num(t.value);
    if(!t.value||v===0){if(byId('temps',id))await del('temps',id)}else if(!byId('temps',id)||num(byId('temps',id).jours)!==v){await save('temps',id,{projetId:pid,ressourceId:rid,mois:m,phase:ph,jours:v})}
    toast('Enregistré');return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.pk==='motif'&&ui.pleo){const tr=t.closest('tr[data-pi]');if(tr)ui.pleo.lignes[+tr.dataset.pi].motif=t.value;return}if(t.dataset.c&&t.type==='number'){ui.calc[t.dataset.c]=t.value;renderCalcResult()}});

render();
initDb();
})();
</script>
