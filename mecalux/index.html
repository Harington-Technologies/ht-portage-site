<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{--navy:#21324E;--navy2:#304870;--steel:#435B7B;--rose:#C187A1;--plum:#784E61;--blush:#F3E6EC;--bg:#F1F4F7;--line:#E4E9F0;--line2:#D7D7D7;--ink:#1B1C1C;--muted:#4A5468;--ok:#2E6B4F;--okbg:#E3F1EA;--warn:#8A5A00;--warnbg:#FBF0D9;--bad:#A3343B;--badbg:#F8E3E4}
*{box-sizing:border-box}
body{margin:0;font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
a{color:var(--plum)}a:hover{color:var(--navy)}
.app{min-height:100vh;display:flex;flex-wrap:wrap}
nav.side{flex:1 1 240px;max-width:100%;background:var(--navy);color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:28px}
@media(min-width:900px){nav.side{max-width:260px;position:sticky;top:0;height:100vh;overflow:auto}}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px;color:#fff;text-decoration:none}
.brand .logo{width:48px;height:48px;border-radius:14px;background:var(--navy2);display:flex;align-items:center;justify-content:center;flex:none}
.brand b{font-size:17px;display:block}.brand small{font-size:13px;color:#A7B3C6}
.menu{display:flex;flex-direction:column;gap:4px}
.menu a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#D9E0EA;text-decoration:none;font-size:15px;font-weight:600}
.menu a:hover{background:#2A3E60;color:#fff}
.menu a.on{background:var(--navy2);color:#fff}
.menu .badge{margin-left:auto;background:var(--rose);color:var(--navy);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.sidebox{margin-top:auto;background:var(--navy2);border-radius:16px;padding:16px;font-size:13px;color:#D9E0EA;display:flex;flex-direction:column;gap:6px}
.sidebox .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A7B3C6}
main{flex:999 1 560px;min-width:0;padding:32px clamp(16px,4vw,48px) 56px;display:flex;flex-direction:column;gap:24px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.eyebrow{margin:0;font-size:14px;font-weight:600;font-style:italic;letter-spacing:.08em;text-transform:uppercase;color:var(--plum)}
h1{margin:4px 0 0;font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--navy)}
h2{margin:0;font-size:18px;font-weight:700;color:var(--navy)}
h3{margin:0;font-size:15px;font-weight:700;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;color:var(--navy)}
.kpi .s{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.hero .t{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.hero .m{font-size:19px;font-weight:700}
.btn{font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;border:0;display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:40px}
.btn.p{background:var(--plum);color:#fff}.btn.p:hover{background:#5f3d4d;color:#fff}
.btn.r{background:var(--rose);color:var(--navy)}
.btn.o{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.g{background:transparent;color:var(--plum);padding:8px 10px}
.btn.d{background:#fff;color:var(--bad);border:1.5px solid #E2B5B9}
.btn.sm{font-size:13px;padding:6px 12px;min-height:32px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}

.scroll{overflow-x:auto;margin:0 -8px;padding:0 8px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--line);color:var(--navy)}
.pill.dev{background:#DCE5F2;color:#21324E}.pill.mes{background:var(--blush);color:#5f3d4d}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.muted{color:var(--muted)}.small{font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--steel);border-radius:99px}
.bar.w>i{background:#C08A1E}.bar.x>i{background:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:#fff;min-height:40px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:var(--rose)}
input[type=checkbox]{min-height:auto;width:18px;height:18px;accent-color:var(--plum)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--bg);border-radius:14px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0}
.dl div{display:flex;flex-direction:column;gap:2px}.dl dt{font-size:13px;color:var(--muted)}.dl dd{margin:0;font-weight:700}
.note{background:var(--blush);border-radius:14px;padding:14px 16px;font-size:14px}
.note.i{background:#E8EEF6}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.res-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.res-line:last-child{border-bottom:0}
.res-line .d{color:var(--muted);font-size:12.5px}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px}
.total b{font-size:24px}
.gantt{display:grid;gap:0;font-size:12.5px;min-width:820px}
.gantt .gh{font-weight:700;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line2);text-transform:capitalize}
.gantt .gl{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .gc{border-bottom:1px solid var(--line);border-left:1px solid var(--line);position:relative;min-height:38px}
.gantt .gc.today{background:#FAF3F6}
.gbar{position:absolute;top:9px;height:20px;border-radius:6px;font-size:11px;font-weight:700;padding:2px 6px;overflow:hidden;white-space:nowrap}
.gbar.dev{background:var(--steel);color:#fff}.gbar.mes{background:var(--rose);color:var(--navy)}
.heat{display:inline-block;min-width:44px;padding:4px 6px;border-radius:8px;text-align:center;font-weight:700;font-size:12.5px}
dialog{border:0;border-radius:20px;padding:0;max-width:min(720px,94vw);width:100%;box-shadow:0 20px 60px rgba(33,50,78,.3)}
dialog.large{max-width:min(1100px,96vw)}
.visu{width:100%;height:72vh;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:block}img.visu{object-fit:contain}
#occupe{position:fixed;inset:0;z-index:9999;background:rgba(33,50,78,.45);display:flex;align-items:center;justify-content:center;cursor:wait}
#occupe .boite{background:#fff;border-radius:16px;padding:22px 28px;display:flex;align-items:center;gap:14px;font-weight:600;color:var(--navy);box-shadow:0 20px 60px rgba(33,50,78,.3);max-width:90vw}
#occupe .rond{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--plum);animation:tourne .8s linear infinite;flex:none}
@keyframes tourne{to{transform:rotate(360deg)}}
dialog::backdrop{background:rgba(33,50,78,.45)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:18px;max-height:88vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--navy);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pf{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:18px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--line);color:var(--muted)}
.steps span.done{background:var(--okbg);color:var(--ok)}.steps span.cur{background:var(--navy);color:#fff}
.inp-n{width:84px;text-align:right}
.cal{border-collapse:separate;border-spacing:2px;font-size:12px}
.cal th.cn{position:sticky;left:0;background:#fff;z-index:1;text-align:left;min-width:180px;padding:0 8px 0 0;font-weight:600;font-size:13px;white-space:nowrap}
.cal thead th.cd{min-width:30px;text-align:center;font-weight:600;color:var(--muted);font-size:11px;line-height:1.25;padding:3px 0;border-radius:6px}
.cal thead th.cd b{display:block;font-size:13px;color:var(--navy)}
.cal thead th.cd.we{background:#E9EDF2}.cal thead th.cd.fe{background:#F6E1EA}
.cal td.cc{padding:0}.cal td.n,.cal th.n{padding:0 6px;text-align:right;font-variant-numeric:tabular-nums}
.cb{width:30px;height:32px;border:1px solid var(--line2);border-radius:6px;background:#fff;font:inherit;font-weight:700;font-size:12px;cursor:pointer;touch-action:none;padding:0;color:var(--navy);display:block}
.cb.we{background:#E9EDF2}.cb.fe{background:#F6E1EA;border-color:#E2B9CB}
.cb.t-dev,.sw.t-dev{background:#435B7B;color:#fff;border-color:#435B7B}.cb.t-mes,.sw.t-mes{background:#C187A1;color:#21324E;border-color:#C187A1}
.cb.t-pil,.sw.t-pil{background:#5B3F8C;color:#fff;border-color:#5B3F8C}.cb.t-pil.demi{background:linear-gradient(90deg,#5B3F8C 50%,#fff 50%)}
.cb.t-depl,.sw.t-depl{background:#1F6F78;color:#fff;border-color:#1F6F78}.cb.t-rd,.sw.t-rd{background:#8A5A00;color:#fff;border-color:#8A5A00}.cb.t-conge,.sw.t-conge{background:#2E6B4F;color:#fff;border-color:#2E6B4F}
.cb{font-size:11px}.sw{min-width:20px;width:auto;padding:0 3px}
.cb.bc{height:22px;font-size:10.5px;border-style:dashed;margin-bottom:6px}
.cb.bset{border-style:solid}
.cb.demi{color:var(--navy)!important;text-align:right;padding-right:3px;font-size:10px}
.cb.t-dev.demi{background:linear-gradient(90deg,#435B7B 50%,#fff 50%)}.cb.t-mes.demi{background:linear-gradient(90deg,#C187A1 50%,#fff 50%)}
.cb.t-depl.demi{background:linear-gradient(90deg,#1F6F78 50%,#fff 50%)}.cb.t-rd.demi{background:linear-gradient(90deg,#8A5A00 50%,#fff 50%)}.cb.t-conge.demi{background:linear-gradient(90deg,#2E6B4F 50%,#fff 50%)}
.cal tr.rt th.cn{vertical-align:middle}
.cal th.cn.lb{font-size:11.5px;font-weight:600;color:var(--muted);padding-left:12px;vertical-align:top;padding-top:3px}
.cb:disabled{cursor:default}.cb:disabled:not([class*=' t-']){opacity:.6}
.cb:focus-visible{outline:2px solid var(--plum);outline-offset:1px}
.sw{display:inline-flex;width:20px;height:20px;border-radius:5px;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:6px;border:1px solid}
.tabs button.on .sw{border-color:#fff}
.tbl th button.tri{font:inherit;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;display:inline-flex;gap:2px;align-items:center}
.tbl th button.tri:hover,.tbl th[aria-sort=ascending] button.tri,.tbl th[aria-sort=descending] button.tri{color:var(--navy)}
.chg-t td.chg{min-width:84px;padding:6px 6px;vertical-align:top}.chg-t td.chg.prevu .chg-bar{opacity:.55;outline:1.5px dashed var(--line2);outline-offset:1px}
.chg-bar{display:flex;height:9px;border-radius:4px;overflow:hidden;background:var(--bg)}.chg-bar i{display:block;height:100%}
.chg-n{font-size:11px;font-weight:700;margin-top:4px;white-space:nowrap;display:flex;gap:6px;flex-wrap:wrap}.chg-t td.sur .chg-n{text-decoration:underline wavy var(--bad)}
.tbl tr.frow th{padding:6px 6px 10px;border-bottom:1px solid var(--line2);text-transform:none;letter-spacing:0}
.tbl tr.frow input,.tbl tr.frow select{width:100%;min-width:70px;min-height:34px;padding:6px 8px;font-size:13px;font-weight:400;border-radius:8px}
.tbl tr.frow input.on,.tbl tr.frow select.on{border-color:var(--plum);background:var(--blush)}
@media(max-width:600px){.grid2{grid-template-columns:1fr}h1{font-size:26px}}
</style>

<script>
(function(){
"use strict";
/* ---------- constantes ---------- */
const COLLS=['projets','ressources','affectations','temps','frais','estimations','prefactures','calendrier','imports','perdiem'];
/* Barèmes Harington · déplacements Mecalux (livret d'accueil CDC Mecalux) */
const DEFAULT_REGLES={
  profils:[
    {id:'fr',code:'H',nom:'Forfait avec hébergement',hebergement:'forfait',hotel:56,hotelEstime:90,dejeuner:20,diner:20,perDiem:0,location:'forfait',locationJour:40,locationEstimee:50,
     regle:'Hors Île-de-France avec hébergement : hôtel 56 € + déjeuner 20 € + dîner 20 € par jour (hôtel au réel possible si justifié). Sans hébergement : déjeuner 20 €. Location voiture 40 € par jour travaillé et facturé. Carburant, péage, avion, train, bus au réel avec justificatif.'},
    {id:'tn',code:'P',nom:'Per diem',hebergement:'reel',hotel:0,hotelEstime:90,dejeuner:0,diner:0,perDiem:70,location:'reel',locationJour:0,locationEstimee:50,
     regle:'Per diem 70 € par jour hors hébergement. Hébergement, billet d\'avion, location voiture, carburant, péage, train et bus au réel, justificatif obligatoire dans Pleo.'}
  ],
  estimations:{carburantKm:0.12,peageKm:0.07,carburantJourSite:10,trainAR:150,avionAR:350},
  seuilJourneeKm:80, nuitsParSemaine:4, nuitsDepart:1, nuitsArrivee:2,
  trajetFacture:false, trajetCoef:0.5,
  margeFrais:0, fraisRefacturablesParDefaut:true, majSamedi:150, majDimFerie:200, voitureHarington:45, perDiemSuper:70
};
const CAS={
  journee:{nom:'Déplacement à la journée',desc:'Retour au domicile chaque soir, pas d\'hôtel.'},
  semaine:{nom:'Grand déplacement · retour chaque week-end',desc:'Sur site du lundi au vendredi, un aller-retour par semaine.'},
  continu:{nom:'Grand déplacement · week-ends sur place',desc:'Reste sur site les week-ends, un seul aller-retour.'},
  ponctuel:{nom:'Intervention ponctuelle',desc:'Mission courte avec un seul aller-retour.'}
};
const STATUTS_PF=['Brouillon','Envoyée à Zakia','Validée Mecalux','BDC reçu','Facturée'];
const CAT_FRAIS=['Forfait hôtel','Hôtel (au réel)','Forfait repas','Per diem','Repas','Location voiture','Voiture Harington','Carburant','Péages','Train','Avion','Bus / taxi','Parking','Divers'];
const CAT_FORFAIT=['Forfait hôtel','Forfait repas','Per diem','Voiture Harington'];
const CAT_JOUR=['Hôtel (au réel)','Location voiture','Voiture Harington']; // saisis en prix par jour × jours travaillés
const MOIS_FR=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOIS_LONG=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ---------- état ---------- */
const S={regles:clone(DEFAULT_REGLES),moisCfg:{},pleoAlias:{}};COLLS.forEach(c=>S[c]={});
let dbState='init', readOnly=false;
const ui={filtres:{tblRes:{5:'Actif'}},dashClient:'',dashRes:'',pfMois:curMonth(),saisieMois:curMonth(),saisieProjet:'',planStart:addMonths(curMonth(),-1),projTab:'synthese',
  calc:{projetId:'',ressourceId:'',cas:'semaine',profil:'fr',jours:10,km:500,mode:'voiture',location:true,nuitPrix:'',arPrix:'',nuitsDepart:'',nuitsArrivee:'',tjm:'',trainNb:'',trainPrix:'',avionNb:'',avionPrix:'',divers:[],qKm:'',qCarb:'',qPeage:''}};

/* ---------- utilitaires ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0}
const fmtE=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmtE2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
function eur(v){return fmtE.format(v||0)}function eur2(v){return fmtE2.format(v||0)}function nf(v){return fmtN.format(v||0)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function curMonth(){return today().slice(0,7)}
function addMonths(m,k){let [y,mo]=m.split('-').map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+String(mo).padStart(2,'0')}
function moisLabel(m){if(!m)return'';const [y,mo]=m.split('-');return MOIS_LONG[+mo-1]+' '+y}
function moisCourt(m){const [y,mo]=m.split('-');return MOIS_FR[+mo-1]+' '+y.slice(2)}
function dateFr(d){if(!d)return'—';const [y,m,j]=d.split('-');return +j+' '+MOIS_FR[+m-1]+' '+y}
function list(c){return Object.values(S[c])}
function byId(c,id){return S[c][id]}
function monthsBetween(a,b){if(!a||!b)return[];let out=[],m=a.slice(0,7),e=b.slice(0,7),g=0;while(m<=e&&g<60){out.push(m);m=addMonths(m,1);g++}return out}
function workdays(a,b){if(!a||!b||b<a)return 0;let n=0,d=new Date(a+'T12:00:00'),e=new Date(b+'T12:00:00');const fer={};while(d<=e){const w=d.getDay();const y=d.getFullYear();if(!fer[y])fer[y]=new Set(feriesFR(y).map(f=>f[0]));const iso=y+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(w&&w<6&&!fer[y].has(iso))n++;d.setDate(d.getDate()+1)}return n} // lundi-vendredi hors jours fériés

/* ---------- calculs métier ---------- */
function tjmFor(pid,rid,phase){const a=list('affectations').find(x=>x.projetId===pid&&x.ressourceId===rid&&x.phase===phase)||list('affectations').find(x=>x.projetId===pid&&x.ressourceId===rid);if(a&&num(a.tjm))return num(a.tjm);const r=byId('ressources',rid);return r?num(r.tjmVente):0}
function phaseOf(p,d){d=d||today();if(p.cloture)return'termine';if(p.devDebut&&d<p.devDebut)return'avenir';if(p.devFin&&d<=p.devFin)return'dev';if(p.mesDebut&&d<p.mesDebut)return'inter';if(p.mesFin&&d<=p.mesFin)return'mes';if(p.mesFin&&d>p.mesFin)return'retard';return'avenir'}
const PHASE_LBL={avenir:['À venir',''],dev:['Développement','dev'],inter:['Avant mise en service','warn'],mes:['Mise en service','mes'],retard:['Dépassement','bad'],termine:['Terminé','ok']};
function phasePill(p){const k=phaseOf(p);return '<span class="pill '+PHASE_LBL[k][1]+'">'+PHASE_LBL[k][0]+'</span>'}
function projStats(pid){
  const aff=list('affectations').filter(a=>a.projetId===pid);
  const tmp=list('temps').filter(t=>t.projetId===pid);
  const fr=list('frais').filter(f=>f.projetId===pid&&f.statut!=='ecarte');
  const est=list('estimations').filter(e=>e.projetId===pid);
  const joursPrev=aff.reduce((s,a)=>s+num(a.joursPrevus),0);
  const montPrev=aff.reduce((s,a)=>s+num(a.joursPrevus)*(num(a.tjm)||num((byId('ressources',a.ressourceId)||{}).tjmVente)),0);
  const fraisPrev=est.reduce((s,e)=>s+num(e.totalFrais),0);
  const joursReal=tmp.reduce((s,t)=>s+num(t.jours),0);
  const couples=[...new Set(tmp.map(t=>t.ressourceId+'|'+t.mois).concat(list('calendrier').filter(c=>c.projetId===pid).map(c=>c.ressourceId+'|'+c.mois)))];
  const montReal=couples.reduce((s,k)=>{const [rid,mo]=k.split('|');return s+prestationLignes(pid,rid,mo).reduce((x,l)=>x+l.montant,0)},0);
  const fraisBareme=list('calendrier').filter(c=>c.projetId===pid).reduce((s,c)=>s+resumeBaremes(c.baremes,c.jours).montant,0);
  const fraisReal=fr.reduce((s,f)=>s+num(f.montant),0)+fraisBareme;
  const fraisRefac=fr.filter(f=>f.refacturable!==false).reduce((s,f)=>s+num(f.montant),0);
  const resIds=[...new Set(aff.map(a=>a.ressourceId))];
  return {joursPrev,montPrev,fraisPrev,joursReal,montReal,fraisReal,fraisRefac,resIds,totalPrev:montPrev+fraisPrev,totalReal:montReal+fraisReal};
}
/* jours facturés au TJM, avec majoration samedi / dimanche et férié (à partir du calendrier quand il existe) */
function prestationLignes(pid,rid,mois){const out=[];const R=S.regles;const kS=num(R.majSamedi||150)/100,kD=num(R.majDimFerie||200)/100;
  const c=list('calendrier').find(x=>x.projetId===pid&&x.ressourceId===rid&&x.mois===mois&&x.jours&&Object.keys(x.jours).length);
  const lib=ph=>ph==='mes'?'Mise en service sur site':ph==='pil'?'Pilotage':'Développement';
  if(c){const info={};joursMois(mois).forEach(j=>info[j.iso]=j);const b={dev:{n:0,sam:0,dim:0},mes:{n:0,sam:0,dim:0},pil:{n:0,sam:0,dim:0}};
    Object.entries(c.jours).forEach(([iso,v])=>{const x=pj(v),j=info[iso];if(!x||!j||!b[x.t])return;b[x.t][j.ferie||j.w===0?'dim':j.w===6?'sam':'n']+=x.q});
    ['dev','mes','pil'].forEach(ph=>{const tj=tjmFor(pid,rid,ph),q=b[ph];
      if(q.n)out.push({type:'prestation',libelle:lib(ph),qte:q.n,unite:'j',pu:tj,montant:q.n*tj});
      if(q.sam)out.push({type:'prestation',libelle:lib(ph)+' · samedi ('+nf(kS*100)+' %)',qte:q.sam,unite:'j',pu:tj*kS,montant:q.sam*tj*kS});
      if(q.dim)out.push({type:'prestation',libelle:lib(ph)+' · dimanche et jours fériés ('+nf(kD*100)+' %)',qte:q.dim,unite:'j',pu:tj*kD,montant:q.dim*tj*kD})});
    return out}
  list('temps').filter(t=>t.projetId===pid&&t.ressourceId===rid&&t.mois===mois&&num(t.jours)>0).sort((a,b)=>a.phase>b.phase?1:-1).forEach(t=>{const tj=tjmFor(pid,rid,t.phase);out.push({type:'prestation',libelle:lib(t.phase),qte:num(t.jours),unite:'j',pu:tj,montant:num(t.jours)*tj})});
  return out}
/* nom lisible du marchand : Pleo met parfois un identifiant technique à la place */
const estIdTech=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(String(v||''));
function libMarchand(f){return (f.marchand&&!estIdTech(f.marchand))?f.marchand:(f.note||f.categoriePleo||'')}
const RUBRIQUES=[['prestation','Jours d\'intervention'],['bareme','Frais au barème'],['frais','Frais réels']];
function pfLines(pid,mois){
  const lines=[];const m=1+num(S.regles.margeFrais)/100;const marge=m!==1?' (+'+nf(S.regles.margeFrais)+' %)':'';
  const tmp=list('temps').filter(t=>t.projetId===pid&&t.mois===mois&&num(t.jours)>0);
  const fr=list('frais').filter(f=>f.projetId===pid&&f.mois===mois&&f.refacturable!==false&&f.statut!=='ecarte');
  const cals=list('calendrier').filter(c=>c.projetId===pid&&c.mois===mois&&c.baremes&&Object.keys(c.baremes).length);
  const calJ=list('calendrier').filter(c=>c.projetId===pid&&c.mois===mois&&c.jours&&Object.keys(c.jours).length);
  const rids=[...new Set(tmp.map(t=>t.ressourceId).concat(cals.map(c=>c.ressourceId),calJ.map(c=>c.ressourceId),fr.map(f=>f.ressourceId||'')))];
  const nomDe=rid=>(byId('ressources',rid)||{}).nom||(rid?'?':'Sans collaborateur');
  rids.sort((x,y)=>nomDe(x).localeCompare(nomDe(y))).forEach(rid=>{const r=byId('ressources',rid)||{};const collab={id:rid,nom:nomDe(rid),code:r.code||''};
    prestationLignes(pid,rid,mois).forEach(l=>lines.push(Object.assign(l,{collab})));
    majBaremes();const c=cals.find(x=>x.ressourceId===rid);if(c){const n={};Object.entries(c.baremes).forEach(([iso,b])=>{if(BAREMES_J[b]&&baremeCompte(iso,c.jours))n[b]=(n[b]||0)+1});
      ORDRE_B.filter(b=>n[b]).forEach(b=>{const mb=montantBareme(b);lines.push({type:'bareme',collab,libelle:'Barème '+codeB(b)+' · '+BAREMES_J[b].nom+marge,qte:n[b],unite:'j',pu:mb.v*m,montant:n[b]*mb.v*m})})}
    // frais réels détaillés : par jour (jours × prix) ou une ligne par dépense (date, marchand ou note)
    fr.filter(f=>(f.ressourceId||'')===rid).sort((a,b)=>((a.categorie||'')+(a.date||''))>((b.categorie||'')+(b.date||''))?1:-1).forEach(f=>{const cat=f.categorie||'Divers';
      if(f.parJour&&num(f.jours))lines.push({type:'frais',collab,libelle:cat+marge,qte:num(f.jours),unite:'j',pu:num(f.prixJour)*m,montant:num(f.montant)*m});
      else{const det=[f.date?dateFr(f.date).replace(/ \d{4}$/,''):'',libMarchand(f)].filter(Boolean).join(' · ');lines.push({type:'frais',collab,libelle:cat+(det?' · '+det:'')+marge,qte:1,unite:'',pu:num(f.montant)*m,montant:num(f.montant)*m})}});
  });
  return lines;
}
function pfGroupes(L){const out=[];L.forEach(l=>{const k=l.collab?l.collab.id:'';let g=out.find(x=>x.k===k);if(!g){g={k,collab:l.collab||null,lignes:[],jours:0,presta:0,bareme:0,frais:0,total:0};out.push(g)}
  g.lignes.push(l);g.total+=num(l.montant);if(l.type==='prestation'){g.jours+=num(l.qte);g.presta+=num(l.montant)}else if(l.type==='bareme')g.bareme+=num(l.montant);else g.frais+=num(l.montant)});return out}

/* calculateur de frais */
function calcFrais(c){
  const R=S.regles,P=profilById(c.profil),E=Object.assign({},DEFAULT_REGLES.estimations,R.estimations||{});
  const jours=Math.max(0,Math.round(num(c.jours)));
  const km=num(c.km);
  const sem=Math.max(1,Math.ceil(jours/5));
  const nDep=c.nuitsDepart===''||c.nuitsDepart==null?num(R.nuitsDepart):num(c.nuitsDepart),nArr=c.nuitsArrivee===''||c.nuitsArrivee==null?num(R.nuitsArrivee):num(c.nuitsArrivee);
  const cas=c.cas;
  const lines=[],warn=[];
  if(cas==='journee'&&km>num(R.seuilJourneeKm))warn.push('La distance dépasse '+R.seuilJourneeKm+' km : un déplacement à la journée semble peu réaliste, vérifiez le cas choisi.');
  let nuits=0,nbAR=1,joursWE=0;
  if(cas==='journee'){nbAR=jours}
  else if(cas==='semaine'){nbAR=sem;nuits=Math.min(Math.max(0,jours-sem),sem*num(R.nuitsParSemaine))}
  else if(cas==='continu'){joursWE=2*(sem-1);nuits=Math.max(0,jours+joursWE-1)}
  else {nuits=Math.max(0,jours-1)}
  // nuits en plus au départ et à l'arrivée, à chaque aller-retour (pas pour un déplacement à la journée)
  const nuitsExtra=cas==='journee'?0:(nDep+nArr)*nbAR;nuits+=nuitsExtra;
  const presence=jours+joursWE+nuitsExtra; // jours passés sur place (travaillés, week-ends sur site, nuits en plus)
  const R2=v=>Math.round(v*100)/100;
  // Hébergement
  if(nuits){
    const reelSaisi=num(c.nuitPrix);
    if(P.hebergement==='forfait'&&!reelSaisi)lines.push({k:'Hôtel (forfait)',d:nuits+' nuit'+(nuits>1?'s':'')+' × '+eur2(P.hotel),v:nuits*num(P.hotel),t:'forfait'});
    else{const pu=reelSaisi||num(P.hotelEstime);lines.push({k:'Hébergement (au réel)',d:nuits+' nuit'+(nuits>1?'s':'')+' × '+eur2(pu)+(reelSaisi?' (prix saisi)':' (estimation)'),v:nuits*pu,t:'reel'})}
  }
  // Repas / per diem
  if(num(P.perDiem)){lines.push({k:'Per diem hors hébergement',d:presence+' j × '+eur2(P.perDiem),v:presence*num(P.perDiem),t:'forfait'})}
  else{
    if(num(P.dejeuner))lines.push({k:'Déjeuner (forfait)',d:presence+' j × '+eur2(P.dejeuner),v:presence*num(P.dejeuner),t:'forfait'});
    const diners=cas==='journee'?0:nuits;
    if(diners&&num(P.diner))lines.push({k:'Dîner (forfait)',d:diners+' × '+eur2(P.diner),v:diners*num(P.diner),t:'forfait'});
  }
  // Transport principal
  const mode=cas==='journee'?'voiture':c.mode;
  if(mode==='voiture'){
    const kmTot=nbAR*2*km;
    lines.push({k:'Carburant trajets (au réel)',d:nf(kmTot)+' km × '+eur2(E.carburantKm)+' (estimation)',v:kmTot*num(E.carburantKm),t:'reel'});
    if(num(E.peageKm))lines.push({k:'Péages (au réel)',d:nf(kmTot)+' km × '+eur2(E.peageKm)+' (estimation)',v:kmTot*num(E.peageKm),t:'reel'});
  }else{
    const pu=num(c.arPrix)||num(mode==='train'?E.trainAR:E.avionAR);
    lines.push({k:(mode==='train'?'Train':'Avion')+' (au réel)',d:nbAR+' A/R × '+eur2(pu)+(num(c.arPrix)?' (prix saisi)':' (estimation)'),v:nbAR*pu,t:'reel'});
  }
  // Location de voiture : jours travaillés uniquement
  if(c.location){
    if(P.location==='forfait')lines.push({k:'Location voiture (forfait)',d:jours+' j travaillés × '+eur2(P.locationJour),v:jours*num(P.locationJour),t:'forfait'});
    else lines.push({k:'Location voiture (au réel)',d:presence+' j × '+eur2(P.locationEstimee)+' (estimation)',v:presence*num(P.locationEstimee),t:'reel'});
    if(mode!=='voiture'&&num(E.carburantJourSite)&&!(num(c.qKm)||num(c.qCarb)||num(c.qPeage)))lines.push({k:'Carburant sur place (au réel)',d:jours+' j × '+eur2(E.carburantJourSite)+' (estimation)',v:jours*num(E.carburantJourSite),t:'reel'});
  }
  // trajet quotidien logement → site, chaque jour travaillé
  const qKm=num(c.qKm),qC=c.qCarb!==''&&c.qCarb!=null?num(c.qCarb):qKm*2*num(E.carburantKm),qP=c.qPeage!==''&&c.qPeage!=null?num(c.qPeage):qKm*2*num(E.peageKm);
  if(jours&&qC>0)lines.push({k:'Carburant quotidien (logement → site)',d:jours+' j travaillés × '+eur2(qC)+(c.qCarb!==''&&c.qCarb!=null?'':' ('+nf(2*qKm)+' km × '+eur2(E.carburantKm)+', estimation)'),v:jours*qC,t:'reel'});
  if(jours&&qP>0)lines.push({k:'Péage quotidien (logement → site)',d:jours+' j travaillés × '+eur2(qP)+(c.qPeage!==''&&c.qPeage!=null?'':' ('+nf(2*qKm)+' km × '+eur2(E.peageKm)+', estimation)'),v:jours*qP,t:'reel'});
  // frais complémentaires : train et avion à part, frais divers
  const tNb=num(c.trainNb),aNb=num(c.avionNb);
  if(tNb>0){const pu=num(c.trainPrix)||num(E.trainAR);lines.push({k:'Train (en plus)',d:nf(tNb)+' A/R × '+eur2(pu)+(num(c.trainPrix)?'':' (estimation)'),v:tNb*pu,t:'reel'})}
  if(aNb>0){const pu=num(c.avionPrix)||num(E.avionAR);lines.push({k:'Avion (en plus)',d:nf(aNb)+' A/R × '+eur2(pu)+(num(c.avionPrix)?'':' (estimation)'),v:aNb*pu,t:'reel'})}
  (c.divers||[]).forEach(d=>{if(num(d.montant))lines.push({k:'Divers · '+(String(d.lib||'').trim()||'sans libellé'),d:'',v:num(d.montant),t:'reel'})});
  lines.forEach(l=>l.v=R2(l.v));
  const totalFrais=lines.reduce((s,l)=>s+l.v,0);
  const forfaits=lines.filter(l=>l.t==='forfait').reduce((s,l)=>s+l.v,0);
  const tjm=num(c.tjm)||(c.ressourceId?num((byId('ressources',c.ressourceId)||{}).tjmVente):0);
  const presta=jours*tjm;
  const trajetJ=R.trajetFacture&&cas!=='journee'?nbAR*num(R.trajetCoef):0;
  const trajet=trajetJ*tjm;
  const refac=totalFrais*(1+num(R.margeFrais)/100);
  return {lines,totalFrais,forfaits,reel:totalFrais-forfaits,tjm,presta,trajetJ,trajet,refac,total:presta+trajet+totalFrais,nuits,nuitsExtra,nDep,nArr,nbAR,jours,sem,warn,mode,profil:P};
}

const MODE_DEV=false;
const TBL=c=>'mecalux_'+c;
const toSnake=k=>k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase());
function toRow(c,id,obj){const row={id};const cols=TABLES[c];Object.keys(obj).forEach(k=>{const sk=toSnake(k);if(sk==='id'||!cols.includes(sk))return;let v=obj[k];if(v===''||v===undefined)v=null;row[sk]=v});return row}
const NUMS=['jours_mes','taux','depenses_perso','nb_lignes','total','tjm_vente','tjm_cout','distance_km','budget_montant','jours_prevus','tjm','jours','montant','total_frais','trajet','refac'];
function fromRow(r){const o={};Object.keys(r).forEach(k=>{let v=r[k];if(v!=null&&typeof v!=='object'&&NUMS.includes(k))v=Number(v);if(v===null)v='';o[toCamel(k)]=v});return o}
let sb=null,session=null,membre=null,estAdmin=false,monRole='',peutPleo=false,maRessource='',etatDemande='',authMsg='',channel=null;
async function save(c,id,obj){
  obj=Object.assign({},obj);delete obj.id;obj.majLe=new Date().toISOString();
  const prev=S[c][id];S[c][id]=Object.assign({id},obj);scheduleRender();
  const {error}=await sb.from(TBL(c)).upsert(toRow(c,id,obj));
  if(error){if(prev)S[c][id]=prev;else delete S[c][id];handleErr(error);render();return false}
  return true;
}
async function del(c,id){
  const prev=S[c][id];delete S[c][id];render();
  const {error}=await sb.from(TBL(c)).delete().eq('id',id);
  if(error){if(prev)S[c][id]=prev;handleErr(error);render()}
}
async function saveRegles(r){S.regles=r;render();const {error}=await sb.from(TBL('config')).upsert({id:'regles',data:r,maj_le:new Date().toISOString()});if(error)handleErr(error)}
function handleErr(e){
  console.error(e);
  if(e&&e.code==='23503')toast('Impossible : cet élément est encore utilisé ailleurs (affectations, jours ou frais).');
  else if(e&&(e.code==='42501'||/row-level security/i.test(e.message||'')))toast('Accès refusé : votre adresse n\'est pas dans l\'équipe autorisée.');
  else if(e&&e.code==='23514')toast('Valeur refusée par la base (dates ou statut incohérents).');
  else toast('Enregistrement impossible : '+((e&&e.message)||'réessayez.'));
}
let pending=false;
function scheduleRender(){
  if(typeof paint!=='undefined'&&paint){pending=true;return}
  const a=document.activeElement;
  if(a&&document.getElementById('main').contains(a)&&a.matches('input,select,textarea')){pending=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(pending){pending=false;scheduleRender()}},150)});

async function loadAll(){
  dbState='loading';render();
  try{
    if(MODE_DEV){membre=true}else{
    const {data:ok,error:e0}=await sb.rpc('mecalux_est_membre');
    if(e0)throw e0;
    membre=!!ok;
    if(membre){const {data:ro}=await sb.rpc('mecalux_role');monRole=ro||'';estAdmin=monRole==='admin';peutPleo=['admin','superuser','harington'].includes(monRole);if(monRole==='superuser'){const {data:mr}=await sb.rpc('mecalux_ma_ressource');maRessource=mr||''}if(estAdmin)setTimeout(chargerAcces,0)}}
    if(!membre){const {data:etat}=await sb.rpc('mecalux_demander_acces');etatDemande=etat||'';dbState='refuse';render();return}
    const res=await Promise.all(COLLS.map(c=>sb.from(TBL(c)).select('*')));
    res.forEach((r,i)=>{if(r.error)throw r.error;const o={};r.data.forEach(row=>{o[row.id]=fromRow(row)});S[COLLS[i]]=o});
    const {data:cfgs,error:e1}=await sb.from(TBL('config')).select('id,data');if(e1)throw e1;
    const cfg=(cfgs||[]).find(c=>c.id==='regles');
    S.regles=cfg&&cfg.data?Object.assign(clone(DEFAULT_REGLES),cfg.data):clone(DEFAULT_REGLES);
    S.moisCfg={};(cfgs||[]).forEach(c=>{if(/^mois_/.test(c.id))S.moisCfg[c.id.slice(5)]=c.data||{};if(c.id==='pleo_alias')S.pleoAlias=c.data||{};if(c.id==='agenda_alias')S.agendaAlias=c.data||{};if(c.id==='analyse_attrib')S.analyseAttrib=c.data||{}});
    dbState='ok';
  }catch(e){console.error(e);dbState='erreur';authMsg=(e&&e.message)||''}
  render();
  subscribe();
}
function subscribe(){
  if(channel)return;
  channel=sb.channel('mecalux').on('postgres_changes',{event:'*',schema:'public'},p=>{
    const t=String(p.table||'').replace(/^mecalux_/,'');
    if(t==='config'){if(p.new&&p.new.id==='regles'&&p.new.data){S.regles=Object.assign(clone(DEFAULT_REGLES),p.new.data);scheduleRender()}
      else if(p.new&&/^mois_/.test(p.new.id||'')){S.moisCfg[p.new.id.slice(5)]=p.new.data||{};scheduleRender()}
      else if(p.new&&p.new.id==='pleo_alias'){S.pleoAlias=p.new.data||{}}else if(p.new&&p.new.id==='agenda_alias'){S.agendaAlias=p.new.data||{}}else if(p.new&&p.new.id==='analyse_attrib'){S.analyseAttrib=p.new.data||{}}return}
    if(!S[t])return;
    if(p.eventType==='DELETE'){if(p.old&&p.old.id)delete S[t][p.old.id]}
    else if(p.new&&p.new.id){S[t][p.new.id]=fromRow(p.new)}
    scheduleRender();
  }).subscribe();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(session||MODE_DEV)&&membre&&dbState==='ok'){loadAll()}});

async function initDb(){
  const cfg=window.HTP_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey){dbState='config';render();return}
  if(MODE_DEV){
    sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'mecalux-dev'}});
    loadAll();return;
  }
  // Session propre au pilotage (page de connexion : connexion.html)
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'mecalux-pilotage'}});
  const {data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((ev,s)=>{const was=!!session;session=s;if(s&&!was)loadAll();if(!s){membre=null;COLLS.forEach(c=>S[c]={});if(channel){sb.removeChannel(channel);channel=null}location.replace('connexion.html')}});
  if(!session){location.replace('connexion.html');return}
  // Double authentification obligatoire : sans code validé, retour à la page de connexion
  const niv=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(!niv.data||niv.data.currentLevel!=='aal2'){location.replace('connexion.html?mfa=1');return}
  surveillerInactivite();loadAll();
}
// Déconnexion automatique après 30 minutes sans activité (souris, clavier, toucher)
function surveillerInactivite(){let t=Date.now();const MAX=30*60*1000;
  ['mousemove','keydown','click','touchstart','scroll'].forEach(e=>document.addEventListener(e,()=>{t=Date.now()},{passive:true,capture:true}));
  setInterval(async()=>{if(Date.now()-t>MAX&&!occupeN)deconnecter('connexion.html?expire=1')},30000)}
// Déconnexion de ce navigateur uniquement (ne ferme pas les autres sites du même compte) ; nettoyage forcé si besoin
async function deconnecter(cible){let r=null;try{r=await sb.auth.signOut({scope:'local'})}catch(e){r={error:e}}
  if(r&&r.error){try{Object.keys(localStorage).filter(k=>k.indexOf('mecalux-pilotage')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}location.replace(cible||'connexion.html')}
function formPwd(){
  openForm('Changer mon mot de passe',[{k:'pwd',l:'Nouveau mot de passe (8 caractères minimum)',type:'password',req:true,full:true}],{},async o=>{
    if(o.pwd.length<8){document.getElementById('frmErr').textContent='8 caractères minimum.';return false}
    const {error}=await sb.auth.updateUser({password:o.pwd});if(error){document.getElementById('frmErr').textContent=error.message;return false}toast('Mot de passe modifié');return true});
}

  const st={init:'Connexion…',loading:'Chargement des données…',ok:MODE_DEV?'Mode développement · sans connexion':'Données à jour',login:'Non connecté',refuse:'Accès non autorisé',erreur:'Erreur de connexion',config:'Configuration manquante'}[dbState]||'';
  const who=MODE_DEV?'':(session&&session.user?session.user.email:'');
  document.getElementById('sidebox').innerHTML='<span class="k">'+(who?'Connecté':'État')+'</span><span style="word-break:break-all">'+esc(who||st)+'</span>'+(who?'<span class="small">'+esc((ROLES[monRole]?ROLES[monRole]+' · ':'')+st)+'</span><div class="row" style="margin-top:4px"><button class="btn sm" style="background:transparent;color:#F3E6EC;border:1px solid #6B7FA3" data-act="pwd">Mot de passe</button><button class="btn sm" style="background:transparent;color:#F3E6EC;border:1px solid #6B7FA3" data-act="logout">Déconnexion</button></div>':'')+'<span class="k" style="margin-top:6px">Circuit de facturation</span><span>Préfacture → Zakia → validation Mecalux → BDC</span>';
  document.getElementById('menu').style.display=(dbState==='ok'||dbState==='loading')?'':'none';

function render(){
  renderMenu();
  const r=route(),m=document.getElementById('main');
  if(dbState==='ok'&&!routeAutorisee(r)){location.replace('#tableau-de-bord');return}
  let html='';
  try{
    if(r.startsWith('projet-'))html=vProjet(r.slice(7));
    else if(r.startsWith('prefacture-'))html=vPrefacture(r.slice(11));
    else html=({'tableau-de-bord':vDash,projets:vProjets,ressources:vRessources,planning:vPlanning,calculateur:vCalc,saisie:vSaisie,'import-pleo':vImportPleo,prefactures:vPrefactures,restitutions:vRestitutions,'analyse-frais':vAnalyseFrais,perdiem:vPerdiem,'import-agenda':vImportAgenda,regles:vRegles,acces:vAcces}[r]||vDash)();
  }catch(e){console.error(e);html='<div class="card">Erreur d\'affichage : '+esc(e.message)+'</div>'}
  if(dbState==='login'){location.replace('connexion.html');return}
  if(dbState==='config'){m.innerHTML='<section class="card"><h1>Configuration manquante</h1><p style="margin:0">La configuration Supabase du site (assets/js/config.js) est introuvable.</p></section>';return}
  if(dbState==='refuse'){const em=esc(session&&session.user.email);const txt=etatDemande==='refusee'?'Votre demande d\'accès pour <b>'+em+'</b> n\'a pas été acceptée. Si vous pensez qu\'il s\'agit d\'une erreur, contactez votre interlocuteur Harington.':'Votre compte (<b>'+em+'</b>) est bien créé. '+(etatDemande==='demande_creee'?'Votre demande d\'accès vient d\'être transmise':'Votre demande d\'accès a été transmise')+' à l\'équipe Harington : vous recevrez un e-mail dès qu\'elle sera validée.';
    m.innerHTML='<section class="card" style="max-width:560px"><h1>'+(etatDemande==='refusee'?'Accès non accordé':'Demande en attente de validation')+'</h1><p style="margin:0">'+txt+'</p><div class="row">'+(etatDemande==='refusee'?'':'<button class="btn p" data-act="reload">J\'ai reçu la validation : actualiser</button>')+'<button class="btn o" data-act="logout">Se déconnecter</button></div></section>';return}
  if(dbState==='erreur'){m.innerHTML='<section class="card"><h1>Connexion à la base impossible</h1><p class="muted" style="margin:0">'+esc(authMsg)+'</p><button class="btn p" data-act="reload" style="align-self:flex-start">Réessayer</button></section>';return}
  if(dbState==='init'){m.innerHTML='';return}
  m.innerHTML=(MODE_DEV?'<div class="banner">Mode développement : accès sans connexion. N\'enregistrez pas encore de données sensibles.</div>':'')+(dbState==='loading'?'<div class="banner" style="background:#E8EEF6;color:var(--navy)">Chargement des données…</div>':'')+html;
  if(r==='calculateur')renderCalcResult();
  m.querySelectorAll('table.triable').forEach(appliquerTri);
  m.querySelectorAll('table.filtrable').forEach(appliquerFiltres);
}
function head(eyebrow,title,actions){return '<header class="top"><div><p class="eyebrow">'+esc(eyebrow)+'</p><h1>'+esc(title)+'</h1></div><div class="row">'+(actions||'')+'</div></header>'}
function selRes(name,val,empty){return '<select name="'+name+'" data-k="'+name+'">'+(empty?'<option value="">'+empty+'</option>':'')+list('ressources').filter(r=>estActif(r)||r.id===val).sort((a,b)=>a.nom.localeCompare(b.nom)).map(r=>'<option value="'+r.id+'"'+(r.id===val?' selected':'')+'>'+esc(r.nom)+'</option>').join('')+'</select>'}
function selProj(name,val,empty){return '<select name="'+name+'" data-k="'+name+'">'+(empty?'<option value="">'+empty+'</option>':'')+list('projets').sort((a,b)=>(a.client+a.nom).localeCompare(b.client+b.nom)).map(p=>'<option value="'+p.id+'"'+(p.id===val?' selected':'')+'>'+esc(p.client+' · '+p.nom)+'</option>').join('')+'</select>'}
function clients(){return [...new Set(list('projets').map(p=>p.client).filter(Boolean))].sort()}
function bar(pct){const c=pct>100?'x':pct>85?'w':'';return '<div class="bar '+c+'" role="img" aria-label="'+Math.round(pct)+' %"><i style="width:'+Math.min(100,pct)+'%"></i></div>'}

/* ---------- vues ---------- */
function vDash(){
  let projs=list('projets');
  if(ui.dashClient)projs=projs.filter(p=>p.client===ui.dashClient);
  if(ui.dashRes)projs=projs.filter(p=>list('affectations').some(a=>a.projetId===p.id&&a.ressourceId===ui.dashRes));
  const st=projs.map(p=>({p,s:projStats(p.id),ph:phaseOf(p)}));
  const actifs=st.filter(x=>['dev','inter','mes','retard'].includes(x.ph));
  const mois=curMonth();
  const surSite=new Set(list('affectations').filter(a=>a.phase==='mes').filter(a=>{const p=byId('projets',a.projetId);return p&&phaseOf(p)==='mes'}).map(a=>a.ressourceId));
  const totPrev=st.reduce((s,x)=>s+x.s.totalPrev,0),totReal=st.reduce((s,x)=>s+x.s.totalReal,0);
  const fraisMois=list('frais').filter(f=>f.mois===mois&&f.statut!=='ecarte'&&projs.some(p=>p.id===f.projetId)).reduce((s,f)=>s+num(f.montant),0);
  const pfMois=addMonths(mois,-1);
  const pfTodo=list('projets').filter(p=>pfLines(p.id,pfMois).length&&(!pfOf(p.id,pfMois)||pfOf(p.id,pfMois).statut==='Brouillon'));
  const alerts=[];
  st.forEach(({p,s,ph})=>{
    if(ph==='retard')alerts.push(['bad',esc(p.client+' · '+p.nom)+' : la mise en service devait finir le '+dateFr(p.mesFin)+'.',p.id]);
    else if(s.joursPrev&&s.joursReal/s.joursPrev>0.9)alerts.push(['warn',esc(p.client+' · '+p.nom)+' : '+Math.round(100*s.joursReal/s.joursPrev)+' % des jours prévus consommés.',p.id]);
    if(p.mesDebut&&p.mesDebut>today()&&p.mesDebut<=addDays(today(),21))alerts.push(['',esc(p.client+' · '+p.nom)+' : départ sur site le '+dateFr(p.mesDebut)+'. Préparez les réservations.',p.id]);
  });
  let h=head(moisLabel(mois),'Tableau de bord','<a class="btn o" href="#calculateur">'+ic('calc',18)+'Estimer des frais</a><button class="btn p" data-act="newProjet">+ Nouveau projet</button>');
  if(pfTodo.length)h+='<section class="hero" aria-label="Action en attente"><div style="display:flex;flex-direction:column;gap:6px;max-width:640px"><span class="t">Préfactures · '+moisLabel(pfMois)+'</span><span class="m">'+pfTodo.length+' préfacture'+(pfTodo.length>1?'s':'')+' à préparer pour Zakia.</span><span style="color:#D9E0EA">'+pfTodo.map(p=>esc(p.client)).join(', ')+'</span></div><a class="btn r" href="#prefactures" data-pfmois="'+pfMois+'">Préparer les préfactures</a></section>';
  h+='<div class="filters"><label class="f">Client<select data-ui="dashClient"><option value="">Tous les clients</option>'+clients().map(c=>'<option'+(c===ui.dashClient?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label><label class="f">Ressource'+selRes('dashRes',ui.dashRes,'Toutes les ressources').replace('data-k="dashRes"','data-ui="dashRes"')+'</label></div>';
  h+='<section class="kpis" aria-label="Indicateurs clés">'+
    kpi('Projets en cours',actifs.length,st.length+' projet'+(st.length>1?'s':'')+' au total')+
    kpi('Ressources sur site',surSite.size,'en mise en service aujourd\'hui')+
    kpi('Budget prévu',eur(totPrev),'jours × TJM + frais estimés')+
    kpi('Réalisé à date',eur(totReal),totPrev?Math.round(100*totReal/totPrev)+' % du prévu':'—')+
    kpi('Frais · '+MOIS_FR[+mois.slice(5)-1],eur(fraisMois),'saisis ce mois-ci')+
  '</section>';
  h+='<section class="card"><div class="card-h"><h2>Suivi par projet</h2><a href="#projets" class="small" style="font-weight:600">Tous les projets</a></div>';
  if(!st.length)h+='<div class="empty">Aucun projet pour l\'instant. Créez votre premier projet pour commencer le suivi.</div>';
  else h+='<div class="scroll"><table class="tbl"><thead><tr><th>Client · projet</th><th>Phase</th><th>Ressources</th><th>Échéance MES</th><th class="n">Jours réal. / prévus</th><th>Consommé</th><th class="n">Prévu</th><th class="n">Réalisé</th><th class="n">Dont frais</th></tr></thead><tbody>'+
    st.sort((a,b)=>(a.p.mesFin||'9')>(b.p.mesFin||'9')?1:-1).map(({p,s})=>{const pct=s.joursPrev?100*s.joursReal/s.joursPrev:0;
      return '<tr><td><a href="#projet-'+p.id+'" style="font-weight:700;color:var(--navy);text-decoration:none">'+esc(p.client)+'</a><div class="small muted">'+esc(p.nom)+(p.site?' · '+esc(p.site):'')+'</div></td><td>'+phasePill(p)+'</td><td class="small">'+(s.resIds.map(id=>esc((byId('ressources',id)||{}).nom||'?')).join(', ')||'<span class="muted">—</span>')+'</td><td class="small">'+dateFr(p.mesFin)+delai(p)+'</td><td class="n">'+nf(s.joursReal)+' / '+nf(s.joursPrev)+'</td><td>'+bar(pct)+'</td><td class="n">'+eur(s.totalPrev)+'</td><td class="n">'+eur(s.totalReal)+'</td><td class="n">'+eur(s.fraisReal)+'</td></tr>'}).join('')+
    '</tbody><tfoot><tr><td colspan="6">Total</td><td class="n">'+eur(totPrev)+'</td><td class="n">'+eur(totReal)+'</td><td class="n">'+eur(st.reduce((s,x)=>s+x.s.fraisReal,0))+'</td></tr></tfoot></table></div>';

  // répartition par client
  const byC={};st.forEach(({p,s})=>{byC[p.client]=(byC[p.client]||0)+s.totalPrev});
  const mx=Math.max(1,...Object.values(byC));
  h+='<section class="card"><h2>Budget prévu par client</h2>'+(Object.keys(byC).length?'<div style="display:flex;flex-direction:column;gap:12px">'+Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([c,v])=>'<div style="display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center"><span style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c)+'</span><div class="bar" style="height:14px"><i style="width:'+(100*v/mx)+'%;background:var(--navy)"></i></div><span class="small" style="font-weight:700;font-variant-numeric:tabular-nums">'+eur(v)+'</span></div>').join('')+'</div>':'<div class="empty">Pas encore de données.</div>')+'</section>';
  h+='</div>';
  return h;
}
function addDays(d,k){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+k);return x.toISOString().slice(0,10)}
function delai(p){if(!p.mesFin||p.cloture)return'';const d=Math.round((new Date(p.mesFin)-new Date(today()))/864e5);if(d<0)return'<div class="small" style="color:var(--bad);font-weight:700">+'+(-d)+' j de retard</div>';return'<div class="small muted">dans '+d+' j</div>'}
function kpi(l,v,s){return '<div class="kpi"><span class="l">'+esc(l)+'</span><span class="v">'+v+'</span><span class="s">'+esc(s)+'</span></div>'}

function pillVisibilite(p){if(!peutPleo)return '';return p.visibleMecalux?'<span class="pill ok" title="Les utilisateurs Mecalux voient ce projet">Visible Mecalux</span>':'<span class="pill" title="Projet interne : invisible pour les utilisateurs Mecalux">Interne Harington</span>'}
function vProjets(){

function appliquerTri(tbl){const t=(ui.tri||{})[tbl.id];tbl.querySelectorAll('button.tri').forEach(b=>{const on=t&&+b.dataset.tri===t.col;b.closest('th').setAttribute('aria-sort',on?(t.dir>0?'ascending':'descending'):'none');b.querySelector('.fl').textContent=on?(t.dir>0?' ▲':' ▼'):''});

function appliquerFiltres(tbl){
  const f=ui.filtres[tbl.id]||{};const keys=Object.keys(f).filter(k=>f[k]);
  const lignes=[...tbl.tBodies[0].rows];let vis=0;
  lignes.forEach(tr=>{
    const ok=keys.every(k=>{
      const v=String(f[k]).trim().toLowerCase();const cell=tr.cells[k];if(!cell)return true;
      const txt=cell.textContent.trim().toLowerCase();
      const el=tbl.querySelector('[data-f="'+k+'"]');
      if(el&&el.tagName==='SELECT')return txt===v;
      const m=v.match(/^(>=|<=|>|<|=)\s*(-?[\d\s.,]+)$/);
      if(m){const n=parseFloat(txt.replace(/[^\d,.-]/g,'').replace(',','.'));const x=parseFloat(m[2].replace(/\s/g,'').replace(',','.'));if(isNaN(n))return false;

/* jours effectifs du mois : lundi-vendredi hors jours fériés français (modifiable par mois) */
function paques(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),j=((h+l-7*m+114)%31)+1;return new Date(Date.UTC(y,mo-1,j))}
function feriesFR(y){const P=paques(y),add=(d,n)=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
  return [[y+'-01-01','Jour de l\'an'],[add(P,1),'Lundi de Pâques'],[y+'-05-01','Fête du Travail'],[y+'-05-08','Victoire 1945'],[add(P,39),'Ascension'],[add(P,50),'Lundi de Pentecôte'],[y+'-07-14','Fête nationale'],[y+'-08-15','Assomption'],[y+'-11-01','Toussaint'],[y+'-11-11','Armistice'],[y+'-12-25','Noël']]}
function joursOuvres(m){const [y,mo]=m.split('-').map(Number);const fer=feriesFR(y).filter(f=>f[0].slice(0,7)===m);const fs=new Set(fer.map(f=>f[0]));let n=0;const dim=new Date(y,mo,0).getDate();
  for(let d=1;d<=dim;d++){const iso=m+'-'+String(d).padStart(2,'0');const w=new Date(Date.UTC(y,mo-1,d)).getUTCDay();if(w&&w<6&&!fs.has(iso))n++}
  return {n,feries:fer.filter(f=>{const w=new Date(f[0]+'T12:00:00Z').getUTCDay();return w&&w<6})}}
function joursEffectifs(m){const c=S.moisCfg[m];return c&&c.joursEffectifs!=null&&c.joursEffectifs!==''?num(c.joursEffectifs):joursOuvres(m).n}
function phaseDefaut(pid,rid){const ph=list('affectations').filter(a=>a.projetId===pid&&a.ressourceId===rid).map(a=>a.phase);
  if(ph.includes('mes')&&!ph.includes('dev'))return 'mes';if(ph.includes('dev')&&!ph.includes('mes'))return 'dev';
  const p=byId('projets',pid);return p&&['mes','retard'].includes(phaseOf(p))?'mes':'dev'}
async function setJours(pid,rid,m,ph,v){const id=[pid,rid,m,ph].join('_');const cur=byId('temps',id);
  if(!v){if(cur)await del('temps',id);return}
  if(!cur||num(cur.jours)!==v)await save('temps',id,{projetId:pid,ressourceId:rid,mois:m,phase:ph,jours:v})}
async function moisComplet(pid,rid,m,coche){const je=joursEffectifs(m);
  if(coche){const ph=phaseDefaut(pid,rid),autre=ph==='dev'?'mes':'dev';await setJours(pid,rid,m,autre,0);await setJours(pid,rid,m,ph,je)}
  else{await setJours(pid,rid,m,'dev',0);await setJours(pid,rid,m,'mes',0)}}

/* ---------- calendrier jour par jour ---------- */
const TYPES_J={dev:{c:'D',nom:'Développement',court:'Dév.'},mes:{c:'M',nom:'Mise en service',court:'MES'},pil:{c:'P',nom:'Pilotage',court:'Pilot.',techLead:true},depl:{c:'DP',nom:'Déplacement',court:'Dépl.',nonTravaille:true},rd:{c:'R',nom:'R&D',court:'R&D',nonTravaille:true,sansBareme:true},conge:{c:'C',nom:'Congés',court:'Congés',nonTravaille:true,sansBareme:true}};
const totalTravaille=rs=>Object.keys(TYPES_J).filter(k=>!TYPES_J[k].nonTravaille).reduce((x,k)=>x+rs[k].total,0);
/* barème de frais du jour (montants selon le pays du collaborateur, cf. Règles de frais) */
/* les 3 barèmes Mecalux (montants repris de la page Règles de frais) */
/* barèmes du jour = liste configurée dans « Règles de frais » (S.regles.profils) */
const COUL_B=[['#F3E6EC','#5f3d4d','#C187A1'],['#FBF0D9','#6B4700','#D9B25E'],['#DCE5F2','#21324E','#8FA3C0'],['#E3F1EA','#2E6B4F','#8CC3A6'],['#EEE7F7','#4B2E7A','#B9A2DD'],['#E6F3F4','#1F5F66','#8DC4C9'],['#F7E9E1','#7A3E1D','#D9A88A']];
let BAREMES_J={},ORDRE_B=[];
function majBaremes(){const L=(S.regles.profils||DEFAULT_REGLES.profils);BAREMES_J={};ORDRE_B=[];L.forEach((z,i)=>{BAREMES_J[z.id]={nom:z.nom||'Barème '+(i+1),code:(z.code||'B'+(i+1)).slice(0,4),i};ORDRE_B.push(z.id)})}
const codeB=id=>BAREMES_J[id]?BAREMES_J[id].code:'?';
function styleB(id){const b=BAREMES_J[id];if(!b)return '';const c=COUL_B[b.i%COUL_B.length];return 'background:'+c[0]+';color:'+c[1]+';border:1px solid '+c[2]}
function montantBareme(id){const P=(S.regles.profils||[]).find(z=>z.id===id);if(!P)return {v:0,reel:false,loc:0};const pd=num(P.perDiem);let v=0,reel=false;
  if(P.hebergement==='forfait')v+=num(P.hotel);else reel=true;
  v+=pd||num(P.dejeuner)+num(P.diner);const loc=P.location==='forfait'?num(P.locationJour):0;v+=loc;
  return {v,reel,loc}}
function detailBareme(id){const P=(S.regles.profils||[]).find(z=>z.id===id);if(!P)return 'barème supprimé';const pd=num(P.perDiem);const parts=[];
  if(P.hebergement==='forfait'){if(num(P.hotel))parts.push('hôtel '+eur(P.hotel))}else parts.push('hôtel au réel');
  if(pd)parts.push('per diem '+eur(pd));else{if(num(P.dejeuner))parts.push('déjeuner '+eur(P.dejeuner));if(num(P.diner))parts.push('dîner '+eur(P.diner))}
  if(P.location==='forfait'&&num(P.locationJour))parts.push('location '+eur(P.locationJour));else if(P.location==='reel')parts.push('location au réel');
  return parts.join(' + ')+' = '+eur(montantBareme(id).v)+' par jour'}
const JS_COURT=['D','L','M','M','J','V','S'];
function calId(pid,rid,m){return [pid,rid,m].join('_')}
function calOf(pid,rid,m){return byId('calendrier',calId(pid,rid,m))}
function joursMois(m){const [y,mo]=m.split('-').map(Number);const fer={};feriesFR(y).forEach(f=>fer[f[0]]=f[1]);const dim=new Date(y,mo,0).getDate();const out=[];
  for(let d=1;d<=dim;d++){const iso=m+'-'+String(d).padStart(2,'0');const w=new Date(Date.UTC(y,mo-1,d)).getUTCDay();out.push({iso,d,w,we:w===0||w===6,ferie:fer[iso]||''})}return out}
/* valeur d'un jour : 'dev' = journée, 'dev/2' = demi-journée */
function pj(v){if(!v)return null;const [t,f]=String(v).split('/');return {t,q:f==='2'?0.5:1,demi:f==='2'}}
const libJour=v=>{const x=pj(v);return x&&TYPES_J[x.t]?TYPES_J[x.t].c+(x.demi?'½':''):''};
function resumeJours(jours,m){const info={};joursMois(m).forEach(j=>info[j.iso]=j);const r={};Object.keys(TYPES_J).forEach(t=>r[t]={ouvre:0,we:0,ferie:0,total:0});
  Object.entries(jours||{}).forEach(([iso,v])=>{const j=info[iso],x=pj(v);if(!j||!x||!r[x.t])return;r[x.t][j.ferie?'ferie':j.we?'we':'ouvre']+=x.q;r[x.t].total+=x.q});return r}
/* jours non travaillés (pas de TJM) : déplacement, R&D, congés ; barème possible le jour de déplacement, jamais en R&D ni en congés */
function baremeCompte(iso,jours){const x=pj((jours||{})[iso]);return !(x&&TYPES_J[x.t]&&TYPES_J[x.t].sansBareme)}
function resumeBaremes(baremes,jours){const n={};let tot=0,reel=0;Object.entries(baremes||{}).forEach(([iso,b])=>{if(!BAREMES_J[b]||!baremeCompte(iso,jours))return;n[b]=(n[b]||0)+1;const x=montantBareme(b);tot+=x.v;if(x.reel)reel++});return {n,montant:tot,nuitsReel:reel}}
let paint=null;
function draftOf(pid,rid,m,kind){const D=kind==='b'?(ui.draftB=ui.draftB||{}):(ui.draft=ui.draft||{});const k=calId(pid,rid,m);if(!D[k])D[k]=Object.assign({},((calOf(pid,rid,m)||{})[kind==='b'?'baremes':'jours'])||{});return D[k]}
/* jours travaillés d'un collaborateur sur un projet et un mois (calendrier, hors congés et R&D, demi-journées comprises) */
function joursTravCal(pid,rid,m){const c=calOf(pid,rid,m);if(!c||!c.jours)return 0;return Object.values(c.jours).reduce((x,v)=>{const j=pj(v);return x+(j&&TYPES_J[j.t]&&!TYPES_J[j.t].nonTravaille?j.q:0)},0)}
async function majFraisParJour(pid,rid,m){const n=joursTravCal(pid,rid,m);for(const f of list('frais').filter(x=>x.parJour&&x.joursAuto!==false&&x.projetId===pid&&x.ressourceId===rid&&x.mois===m)){const mt=Math.round(num(f.prixJour)*n*100)/100;if(num(f.montant)!==mt||num(f.jours)!==n)await save('frais',f.id,Object.assign({},f,{montant:mt,jours:n}))}}
async function saveCal(pid,rid,m,jours,extra){
  const cur=calOf(pid,rid,m)||{};jours=jours||cur.jours||{};const baremes=(extra&&extra.baremes)||cur.baremes||{};
  const r=resumeJours(jours,m);r.baremes=resumeBaremes(baremes,jours);
  const ok=await save('calendrier',calId(pid,rid,m),Object.assign({projetId:pid,ressourceId:rid,mois:m,jours,baremes,resume:r,valide:!!cur.valide,valideLe:cur.valideLe||''},extra||{},{baremes}));
  if(ok){await setJours(pid,rid,m,'dev',r.dev.total);await setJours(pid,rid,m,'mes',r.mes.total);if(r.pil.total||byId('temps',[pid,rid,m,'pil'].join('_')))await setJours(pid,rid,m,'pil',r.pil.total);await majFraisParJour(pid,rid,m)}
  return ok;
}
function cellClass(v,j){const x=pj(v);return 'cb'+(j.we?' we':'')+(j.ferie?' fe':'')+(x?' t-'+x.t+(x.demi?' demi':''):'')}
function bcellClass(b,j){return 'cb bc'+(j.we?' we':'')+(j.ferie?' fe':'')+(b?' bset':'')}
function infoJour(iso){return joursMois(iso.slice(0,7)).find(x=>x.iso===iso)}
function majCellule(btn,v){const kind=btn.dataset.bcell?'b':'j';const iso=(btn.dataset.cell||btn.dataset.bcell).split('|')[1];const j=infoJour(iso);
  if(kind==='b'){btn.className=bcellClass(v,j);btn.textContent=v?codeB(v):'';btn.setAttribute('style',v?styleB(v):'')}else{btn.className=cellClass(v,j);btn.textContent=libJour(v)}}
const celluleDe=el=>el&&el.closest&&el.closest('[data-cell],[data-bcell]');
const estTechLead=rid=>/^tech\s*lead$/i.test(((byId('ressources',rid)||{}).role||'').trim());
function peindre(btn){if(!paint||btn.disabled)return;const kind=btn.dataset.bcell?'b':'j';if(kind!==paint.kind)return;const [rid,iso]=(btn.dataset.cell||btn.dataset.bcell).split('|');
  if(kind==='j'&&paint.val&&pj(paint.val)&&pj(paint.val).t==='pil'&&!estTechLead(rid)){if(!paint.averti){paint.averti=true;toast('Le pilotage est réservé aux Tech lead.')}return}const d=draftOf(paint.pid,rid,paint.m,kind);
  if(paint.val)d[iso]=paint.val;else delete d[iso];paint.rows.add(rid);majCellule(btn,paint.val)}
function debutPeinture(b){const pid=ui.saisieProjet||(list('projets')[0]||{}).id,m=ui.saisieMois;const kind=b.dataset.bcell?'b':'j';const [rid,iso]=(b.dataset.cell||b.dataset.bcell).split('|');const cur=draftOf(pid,rid,m,kind)[iso];
  const pz=kind==='b'?ui.pinceauB:ui.pinceau;let val;
  if(kind==='b')val=pz&&cur!==pz?pz:'';
  else if(!pz)val='';else if(cur===pz)val=pz+'/2';else if(cur===pz+'/2')val='';else val=pz; // journée → demi-journée → vide
  paint={pid,m,kind,val,rows:new Set()};peindre(b)}
document.addEventListener('pointerdown',e=>{const b=celluleDe(e.target);if(!b||b.disabled||e.button>0)return;e.preventDefault();debutPeinture(b)});
document.addEventListener('pointermove',e=>{if(!paint)return;const b=celluleDe(document.elementFromPoint(e.clientX,e.clientY));if(b)peindre(b)});
async function finPeinture(){if(!paint)return;const p=paint;paint=null;const D=p.kind==='b'?ui.draftB:ui.draft;
  for(const rid of p.rows){const k=calId(p.pid,rid,p.m);if(p.kind==='b')await saveCal(p.pid,rid,p.m,null,{baremes:D[k]});else await saveCal(p.pid,rid,p.m,D[k]);delete D[k]}pending=false;render()}
document.addEventListener('pointerup',finPeinture);document.addEventListener('pointercancel',finPeinture);

function moisPrecedent(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7)}

function restitution(m,seulVisibles){
  const cal=list('calendrier').filter(c=>c.mois===m);const projets={};const autres={rd:{},conge:{}};
  cal.forEach(c=>{const p=byId('projets',c.projetId);if(!p)return;const r=byId('ressources',c.ressourceId);if(!r)return;
    Object.entries(c.jours||{}).forEach(([iso,v])=>{const x=pj(v);if(!x)return;
      if(x.t==='dev'||x.t==='mes'||x.t==='pil'){if(seulVisibles&&!p.visibleMecalux)return;const P=projets[p.id]=projets[p.id]||{p,res:{}};const L=P.res[r.id]=P.res[r.id]||{r,dev:0,mes:0,pil:0};L[x.t]+=x.q}
      else if(x.t==='rd'||x.t==='conge'){const A=autres[x.t][r.id]=autres[x.t][r.id]||{r,j:{}};A.j[iso]=Math.max(A.j[iso]||0,x.q)}})});
  const tri=(a,b)=>a.r.nom.localeCompare(b.r.nom);

    return {titre:libProjet(P.p),lignes:lignes.map(l=>({nom:l.r.nom,service:l.r.role||'',dev:l.dev,mes:l.mes,pil:l.pil,total:l.dev+l.mes+l.pil})),total:lignes.reduce((t,l)=>t+l.dev+l.mes+l.pil,0)}}).filter(b=>b.total>0);
  [['rd','R&D'],['conge','Congé']].forEach(([k,lib])=>{const lignes=Object.values(autres[k]).map(A=>({nom:A.r.nom,service:A.r.role||'',dev:'',mes:'',pil:'',total:Object.values(A.j).reduce((t,q)=>t+q,0)})).filter(l=>l.total>0).sort((a,b)=>a.nom.localeCompare(b.nom));
    if(lignes.length)blocs.push({titre:lib,lignes,total:lignes.reduce((t,l)=>t+l.total,0),autre:true})});

async function enregistrerPleo(){const P=ui.pleo;const dec=P.lignes.filter(l=>l.d&&l.rid&&l.pid);const manque=P.lignes.filter(l=>l.d&&(!l.rid||!l.pid));
  if(!dec.length){toast('Aucune ligne décidée et complète (collaborateur et projet) à enregistrer.');return}

  try{
  const dts=P.lignes.map(l=>l.iso).sort();const nomI=String(P.nom!=null?P.nom:nomImportDefaut(P.lignes,P.fichier)).trim()||nomImportDefaut(P.lignes,P.fichier);
  if(!P.importId||!byId('imports',P.importId))P.importId='imp_'+Date.now().toString(36);const impPrev=byId('imports',P.importId)||{};
  const okI=await save('imports',P.importId,Object.assign({},impPrev,{nom:nomI,fichier:P.fichier,source:'pleo',dateDebut:dts[0]||'',dateFin:dts[dts.length-1]||'',nbLignes:P.lignes.length,total:Math.round(P.lignes.reduce((t,l)=>t+l.mont,0)*100)/100,creeLe:impPrev.creeLe||new Date().toISOString()}));
  if(!okI)return;
  for(const l of dec){nI++;occupeMsg('Enregistrement des dépenses : '+nI+' / '+dec.length+(nbJ?' · '+nbJ+' justificatif'+(nbJ>1?'s':'')+' stocké'+(nbJ>1?'s':''):'')+'…');const id=l.ex||('pleo_'+l.key);const cur=byId('frais',id)||{};
    let chemins=Array.isArray(cur.justifs)?cur.justifs.slice():[];
    if(l.fichiers&&l.fichiers.length){chemins=[];for(const fch of l.fichiers){const path='pleo/'+l.recu+'/'+fch.nom;
      if(!envoyes[path]){const {error}=await sb.storage.from(BUCKET_J).upload(path,fch.blob,{upsert:true,contentType:fch.blob.type});envoyes[path]=error?'err':'ok';if(error){errJ++;console.error(error)}else nbJ++}
      if(envoyes[path]==='ok')chemins.push(path)}}
    const r=await save('frais',id,Object.assign({},cur,{projetId:l.pid,ressourceId:l.rid,mois:l.mois||l.iso.slice(0,7),date:l.iso,categorie:l.cat,montant:l.mont,note:cur.note||l.note||'',refacturable:l.d==='valide'?l.refac:false,justif:chemins.length?true:l.justif!==false,importId:P.importId,justifs:chemins,pleoReceipt:l.recu||cur.pleoReceipt||'',dejaFacture:false,source:'pleo',statut:l.d,motif:l.d==='ecarte'?l.motif:'',pleoRef:l.key,marchand:l.mar,categoriePleo:l.cp}));
    if(r){ok++;l.ex=id;const k=l.pid+'|'+l.iso.slice(0,7);parMP[k]=(parMP[k]||0)+1}}
  }finally{libre()}
  ui.pleoMois=(P.lignes.map(l=>l.iso).sort()[0]||'').slice(0,7)||ui.pleoMois;
  const reste=P.lignes.filter(l=>!l.d||!l.rid||!l.pid);
  const msgJ=nbJ?' · '+nbJ+' justificatif'+(nbJ>1?'s':'')+' stocké'+(nbJ>1?'s':''):'';if(errJ)setTimeout(()=>toast(errJ+' justificatif(s) n\'ont pas pu être stockés.'),2800);
  if(!reste.length){ui.pleo=null;toast(ok+' dépenses enregistrées, réparties sur '+Object.keys(parMP).length+' projet(s) et mois'+msgJ)}
  else{P.lignes=reste;P.f={collab:manque.some(l=>!l.rid)?'?':'',cat:'',dec:'',proj:manque.some(l=>!l.pid)?'?':''};toast(ok+' dépenses enregistrées. Il reste '+reste.length+' ligne(s) à trier ou à compléter.')}
  render()}

function pfText(key){const {p,m,pf,L,tot}=pfData(key);return 'Préfacture '+p.client+' · '+p.nom+' · '+moisLabel(m)+(pf&&pf.bdc?' · BDC '+pf.bdc:'')+'\n'+pfGroupes(L).map(g=>(g.collab?'\n'+g.collab.nom+(g.collab.code?' ('+g.collab.code+')':''):'')+RUBRIQUES.map(([t,lib])=>{const ls=g.lignes.filter(l=>(l.type||'frais')===t);return ls.length?'\n  '+lib+'\n'+ls.map(l=>'    '+l.libelle+'\t'+nf(l.qte)+' '+l.unite+'\t'+eur2(l.pu)+'\t'+eur2(l.montant)).join('\n'):''}).join('')+(g.collab?'\n  Sous-total\t\t\t'+eur2(g.total):'')).join('\n')+'\n\n'+RUBRIQUES.map(([t,lib])=>'Total '+lib.toLowerCase()+'\t\t\t'+eur2(totRub(L,t))).join('\n')+'\nTotal HT\t\t\t'+eur2(tot)}
function pfCsv(key){const {p,m,pf,L,tot}=pfData(key);const q=s=>'"'+String(s).replace(/"/g,'""')+'"';const n=v=>String((+v).toFixed(2)).replace('.',',');const lib=t=>(RUBRIQUES.find(r=>r[0]===(t||'frais'))||[0,''])[1];
  return '\ufeff'+[['Client','Projet','Période','BDC','Trigramme','Collaborateur','Rubrique','Désignation','Quantité','Unité','PU HT','Montant HT'].map(q).join(';')].concat(L.map(l=>[p.client,p.nom,m,pf&&pf.bdc||'',l.collab?l.collab.code:'',l.collab?l.collab.nom:'',lib(l.type),l.libelle,n(l.qte),l.unite,n(l.pu),n(l.montant)].map((v,k)=>k>=8&&k!==9?v:q(v)).join(';'))).concat(RUBRIQUES.map(([t,lb])=>['','','','','','','','Total '+lb.toLowerCase(),'','','',n(totRub(L,t))].map((v,k)=>k===11?v:q(v)).join(';')),[['','','','','','','','Total HT','','','',n(tot)].map((v,k)=>k===11?v:q(v)).join(';')]).join('\r\n')}
function visionneuse(sousTitre,docs,apres){
  const montrer=i=>{const d=docs[i];const img=/\.(jpe?g|png|webp|gif)$/i.test(d.nom);
    document.getElementById('visuZone').innerHTML=img?'<img class="visu" src="'+esc(d.url)+'" alt="'+esc(d.nom)+'">':'<iframe class="visu" src="'+esc(d.url)+'" title="'+esc(d.nom)+'"></iframe>';
    document.getElementById('visuOnglet').href=d.url;document.querySelectorAll('[data-visu]').forEach(x=>x.classList.toggle('p',+x.dataset.visu===i))};
  dlg.classList.add('large');dlg.addEventListener('close',()=>{dlg.classList.remove('large');if(apres)apres()},{once:true});
  document.getElementById('dlgBody').innerHTML='<div class="row" style="align-items:baseline"><h2 style="margin:0">Justificatif'+(docs.length>1?'s':'')+'</h2><span class="small muted">'+sousTitre+'</span></div>'+
    (docs.length>1?'<div class="row" style="gap:6px;flex-wrap:wrap">'+docs.map((d,i)=>'<button type="button" class="btn o sm" data-visu="'+i+'">'+esc(d.nom)+'</button>').join('')+'</div>':'')+
    '<div id="visuZone"></div><div class="row"><a id="visuOnglet" class="btn o" target="_blank" rel="noopener">Ouvrir dans un onglet</a><span class="sp"></span><button class="btn p" data-dlg="close">Fermer</button></div>';
  document.getElementById('dlgBody').querySelectorAll('[data-visu]').forEach(x=>x.addEventListener('click',()=>montrer(+x.dataset.visu)));
  montrer(0);dlg.showModal()}
function pfHtml(key){const {p,m,pf,L,tot}=pfData(key);return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Préfacture '+esc(p.client)+' '+m+'</title><style>body{font-family:Arial,sans-serif;color:#1B1C1C;max-width:800px;margin:40px auto;padding:0 20px}h1{color:#21324E;font-size:22px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}td.n,th.n{text-align:right}tfoot td{font-weight:bold;border-top:2px solid #21324E}.m{color:#4A5468;font-size:13px}</style></head><body><p class="m">PRÉFACTURE · POUR VALIDATION</p><h1>'+esc(p.client)+' · '+esc(p.nom)+'</h1><p class="m">'+esc(p.site||'')+(p.refMecalux?' · Réf. Mecalux '+esc(p.refMecalux):'')+'<br>Période : '+moisLabel(m)+(pf&&pf.bdc?'<br>Bon de commande : '+esc(pf.bdc):'')+'<br>Statut : '+esc(pf&&pf.statut||'À préparer')+'</p><table><thead><tr><th>Désignation</th><th class="n">Qté</th><th class="n">PU HT</th><th class="n">Montant HT</th></tr></thead><tbody>'+pfGroupes(L).map(g=>(g.collab?'<tr><td colspan="4" style="background:#21324E;color:#fff;font-weight:bold">'+esc(g.collab.nom)+(g.collab.code?' ('+esc(g.collab.code)+')':'')+'</td></tr>':'')+RUBRIQUES.map(([t,lib])=>{const ls=g.lignes.filter(l=>(l.type||'frais')===t);return ls.length?'<tr><td colspan="4" style="color:#000;font-weight:bold;font-size:14px">'+lib+'</td></tr>'+ls.map(l=>'<tr><td style="padding-left:22px">'+esc(l.libelle)+'</td><td class="n">'+nf(l.qte)+' '+esc(l.unite)+'</td><td class="n">'+eur2(l.pu)+'</td><td class="n">'+eur2(l.montant)+'</td></tr>').join(''):''}).join('')+(g.collab?'<tr><td colspan="3" class="n m">Sous-total '+esc(g.collab.nom)+'</td><td class="n"><b>'+eur2(g.total)+'</b></td></tr>':'')).join('')+'</tbody><tfoot>'+RUBRIQUES.map(([t,lib])=>'<tr><td colspan="3" style="font-weight:normal;border-top:0">Total '+lib.toLowerCase()+'</td><td class="n" style="font-weight:normal;border-top:0">'+eur2(totRub(L,t))+'</td></tr>').join('')+'<tr><td colspan="3">Total HT</td><td class="n">'+eur2(tot)+'</td></tr></tfoot></table>'+(pf&&pf.notes?'<p><b>Notes :</b> '+esc(pf.notes)+'</p>':'')+'</body></html>'}
function dl(filename,data){
  const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':'text/html;charset=utf-8';
  const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

document.addEventListener('click',async e=>{

    case'pinceau':ui.pinceau=b.dataset.t;render();break;
    case'pinceauB':ui.pinceauB=b.dataset.t;render();break;
    case'calBareme':case'calBaremeAll':{const pid=ui.saisieProjet||(list('projets')[0]||{}).id,m=ui.saisieMois;const bz=ui.pinceauB;
      const rids=act==='calBaremeAll'?[...new Set([...document.querySelectorAll('[data-bcell]')].filter(x=>!x.disabled).map(x=>x.dataset.bcell.split('|')[0]))]:[b.dataset.rid];let n=0;
      for(const rid of rids){const c=calOf(pid,rid,m);if(c&&c.valide)continue;const jours=(c&&c.jours)||{};const bar=Object.assign({},(c&&c.baremes)||{});
        Object.entries(jours).forEach(([iso,v])=>{const t=(pj(v)||{}).t;if(TYPES_J[t]&&TYPES_J[t].sansBareme)return;if(bz)bar[iso]=bz;else delete bar[iso];n++});await saveCal(pid,rid,m,null,{baremes:bar})}
      toast(n?n+' jour'+(n>1?'s':'')+' : '+(bz&&BAREMES_J[bz]?BAREMES_J[bz].nom:'barème retiré'):'Aucun jour travaillé saisi : choisissez d\'abord les jours.');render();break}
    case'calFill':case'calFillAll':case'calClear':{const pid=ui.saisieProjet||(list('projets')[0]||{}).id,m=ui.saisieMois;const t=ui.pinceau||'dev';
      const rids=act==='calFillAll'?[...new Set([...document.querySelectorAll('[data-cell]')].filter(x=>!x.disabled).map(x=>x.dataset.cell.split('|')[0]))]:[b.dataset.rid];
      for(const rid of rids){const c=calOf(pid,rid,m);if(c&&c.valide)continue;const d=Object.assign({},(c&&c.jours)||{});
