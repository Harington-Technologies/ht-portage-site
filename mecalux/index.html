<style>
:root{--navy:#21324E;--navy2:#304870;--steel:#435B7B;--rose:#C187A1;--plum:#784E61;--blush:#F3E6EC;--bg:#F1F4F7;--line:#E4E9F0;--line2:#D7D7D7;--ink:#1B1C1C;--muted:#4A5468;--ok:#2E6B4F;--okbg:#E3F1EA;--warn:#8A5A00;--warnbg:#FBF0D9;--bad:#A3343B;--badbg:#F8E3E4}
*{box-sizing:border-box}
body{margin:0;font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
a{color:var(--plum)}a:hover{color:var(--navy)}
.app{min-height:100vh;display:flex;flex-wrap:wrap}
nav.side{flex:1 1 240px;max-width:100%;background:var(--navy);color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:28px}
@media(min-width:900px){nav.side{max-width:260px;position:sticky;top:0;height:100vh;overflow:auto}}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px;color:#fff;text-decoration:none}
.brand .logo{width:48px;height:48px;border-radius:14px;background:var(--navy2);display:flex;align-items:center;justify-content:center;flex:none}
.brand b{font-size:17px;display:block}.brand small{font-size:13px;color:#A7B3C6}
.menu{display:flex;flex-direction:column;gap:4px}
.menu a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#D9E0EA;text-decoration:none;font-size:15px;font-weight:600}
.menu a:hover{background:#2A3E60;color:#fff}
.menu a.on{background:var(--navy2);color:#fff}
.menu .badge{margin-left:auto;background:var(--rose);color:var(--navy);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.sidebox{margin-top:auto;background:var(--navy2);border-radius:16px;padding:16px;font-size:13px;color:#D9E0EA;display:flex;flex-direction:column;gap:6px}
.sidebox .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A7B3C6}
main{flex:999 1 560px;min-width:0;padding:32px clamp(16px,4vw,48px) 56px;display:flex;flex-direction:column;gap:24px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.eyebrow{margin:0;font-size:14px;font-weight:600;font-style:italic;letter-spacing:.08em;text-transform:uppercase;color:var(--plum)}
h1{margin:4px 0 0;font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--navy)}
h2{margin:0;font-size:18px;font-weight:700;color:var(--navy)}
h3{margin:0;font-size:15px;font-weight:700;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;color:var(--navy)}
.kpi .s{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.hero .t{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.hero .m{font-size:19px;font-weight:700}
.btn{font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;border:0;display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:40px}
.btn.p{background:var(--plum);color:#fff}.btn.p:hover{background:#5f3d4d;color:#fff}
.btn.r{background:var(--rose);color:var(--navy)}
.btn.o{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.g{background:transparent;color:var(--plum);padding:8px 10px}
.btn.d{background:#fff;color:var(--bad);border:1.5px solid #E2B5B9}
.btn.sm{font-size:13px;padding:6px 12px;min-height:32px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-top:1.5px solid var(--navy);color:var(--navy)}
.scroll{overflow-x:auto;margin:0 -8px;padding:0 8px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--line);color:var(--navy)}
.pill.dev{background:#DCE5F2;color:#21324E}.pill.mes{background:var(--blush);color:#5f3d4d}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.muted{color:var(--muted)}.small{font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--steel);border-radius:99px}
.bar.w>i{background:#C08A1E}.bar.x>i{background:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:#fff;min-height:40px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:var(--rose)}
input[type=checkbox]{min-height:auto;width:18px;height:18px;accent-color:var(--plum)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--bg);border-radius:14px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0}
.dl div{display:flex;flex-direction:column;gap:2px}.dl dt{font-size:13px;color:var(--muted)}.dl dd{margin:0;font-weight:700}
.note{background:var(--blush);border-radius:14px;padding:14px 16px;font-size:14px}
.note.i{background:#E8EEF6}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.res-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.res-line:last-child{border-bottom:0}
.res-line .d{color:var(--muted);font-size:12.5px}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px}
.total b{font-size:24px}
.gantt{display:grid;gap:0;font-size:12.5px;min-width:820px}
.gantt .gh{font-weight:700;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line2);text-transform:capitalize}
.gantt .gl{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .gc{border-bottom:1px solid var(--line);border-left:1px solid var(--line);position:relative;min-height:38px}
.gantt .gc.today{background:#FAF3F6}
.gbar{position:absolute;top:9px;height:20px;border-radius:6px;font-size:11px;font-weight:700;padding:2px 6px;overflow:hidden;white-space:nowrap}
.gbar.dev{background:var(--steel);color:#fff}.gbar.mes{background:var(--rose);color:var(--navy)}
.heat{display:inline-block;min-width:44px;padding:4px 6px;border-radius:8px;text-align:center;font-weight:700;font-size:12.5px}
dialog{border:0;border-radius:20px;padding:0;max-width:min(720px,94vw);width:100%;box-shadow:0 20px 60px rgba(33,50,78,.3)}
dialog::backdrop{background:rgba(33,50,78,.45)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:18px;max-height:88vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--navy);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pf{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:18px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--line);color:var(--muted)}
.steps span.done{background:var(--okbg);color:var(--ok)}.steps span.cur{background:var(--navy);color:#fff}
.inp-n{width:84px;text-align:right}
.tbl tr.frow th{padding:6px 6px 10px;border-bottom:1px solid var(--line2);text-transform:none;letter-spacing:0}
.tbl tr.frow input,.tbl tr.frow select{width:100%;min-width:70px;min-height:34px;padding:6px 8px;font-size:13px;font-weight:400;border-radius:8px}
.tbl tr.frow input.on,.tbl tr.frow select.on{border-color:var(--plum);background:var(--blush)}
@media(max-width:600px){.grid2{grid-template-columns:1fr}h1{font-size:26px}}
</style>

<script>
(function(){
"use strict";
/* ---------- constantes ---------- */
const COLLS=['projets','ressources','affectations','temps','frais','estimations','prefactures'];
/* Barèmes Harington · déplacements Mecalux (livret d'accueil CDC Mecalux) */
const DEFAULT_REGLES={
  profils:[
    {id:'fr',nom:'Collaborateur France',hebergement:'forfait',hotel:56,hotelEstime:90,dejeuner:20,diner:20,perDiem:0,location:'forfait',locationJour:40,locationEstimee:50,
     regle:'Hors Île-de-France avec hébergement : hôtel 56 € + déjeuner 20 € + dîner 20 € par jour (hôtel au réel possible si justifié). Sans hébergement : déjeuner 20 €. Location voiture 40 € par jour travaillé et facturé. Carburant, péage, avion, train, bus au réel avec justificatif.'},
    {id:'tn',nom:'Collaborateur Tunisie',hebergement:'reel',hotel:0,hotelEstime:90,dejeuner:0,diner:0,perDiem:70,location:'reel',locationJour:0,locationEstimee:50,
     regle:'Per diem 70 € par jour hors hébergement. Hébergement, billet d\'avion, location voiture, carburant, péage, train et bus au réel, justificatif obligatoire dans Pleo.'}
  ],
  estimations:{carburantKm:0.12,peageKm:0.07,carburantJourSite:10,trainAR:150,avionAR:350},
  seuilJourneeKm:80, nuitsParSemaine:4, arriveeVeille:true,
  trajetFacture:false, trajetCoef:0.5,
  margeFrais:0, fraisRefacturablesParDefaut:true
};
const CAS={
  journee:{nom:'Déplacement à la journée',desc:'Retour au domicile chaque soir, pas d\'hôtel.'},
  semaine:{nom:'Grand déplacement · retour chaque week-end',desc:'Sur site du lundi au vendredi, un aller-retour par semaine.'},
  continu:{nom:'Grand déplacement · week-ends sur place',desc:'Reste sur site les week-ends, un seul aller-retour.'},
  ponctuel:{nom:'Intervention ponctuelle',desc:'Mission courte avec un seul aller-retour.'}
};
const STATUTS_PF=['Brouillon','Envoyée à Zakia','Validée Mecalux','BDC reçu','Facturée'];
const CAT_FRAIS=['Forfait hôtel','Hôtel (au réel)','Forfait repas','Per diem','Location voiture','Carburant','Péages','Train','Avion','Bus / taxi','Parking','Divers'];
const CAT_FORFAIT=['Forfait hôtel','Forfait repas','Per diem'];
const MOIS_FR=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOIS_LONG=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ---------- état ---------- */
const S={regles:clone(DEFAULT_REGLES)};COLLS.forEach(c=>S[c]={});
let dbState='init', readOnly=false;
const ui={filtres:{tblRes:{6:'Actif'}},dashClient:'',dashRes:'',pfMois:curMonth(),saisieMois:curMonth(),saisieProjet:'',planStart:addMonths(curMonth(),-1),projTab:'synthese',
  calc:{projetId:'',ressourceId:'',cas:'semaine',profil:'fr',jours:10,km:500,mode:'voiture',location:true,nuitPrix:'',arPrix:'',arriveeVeille:null,tjm:''}};

/* ---------- utilitaires ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0}
const fmtE=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmtE2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
function eur(v){return fmtE.format(v||0)}function eur2(v){return fmtE2.format(v||0)}function nf(v){return fmtN.format(v||0)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function curMonth(){return today().slice(0,7)}
function addMonths(m,k){let [y,mo]=m.split('-').map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+String(mo).padStart(2,'0')}
function moisLabel(m){if(!m)return'';const [y,mo]=m.split('-');return MOIS_LONG[+mo-1]+' '+y}
function moisCourt(m){const [y,mo]=m.split('-');return MOIS_FR[+mo-1]+' '+y.slice(2)}
function dateFr(d){if(!d)return'—';const [y,m,j]=d.split('-');return +j+' '+MOIS_FR[+m-1]+' '+y}
function list(c){return Object.values(S[c])}
function byId(c,id){return S[c][id]}
function monthsBetween(a,b){if(!a||!b)return[];let out=[],m=a.slice(0,7),e=b.slice(0,7),g=0;while(m<=e&&g<60){out.push(m);m=addMonths(m,1);g++}return out}
function workdays(a,b){if(!a||!b||b<a)return 0;let n=0,d=new Date(a+'T12:00:00'),e=new Date(b+'T12:00:00');while(d<=e){const w=d.getDay();if(w&&w<6)n++;d.setDate(d.getDate()+1)}return n}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function profilById(id){const P=S.regles.profils||DEFAULT_REGLES.profils;return P.find(z=>z.id===id)||P[0]}
function estActif(r){return !!r&&r.actif!==false&&!(r.dateFin&&r.dateFin<today())}
function paysOf(id){return ({fr:'FR',tn:'TN'})[id]||profilById(id).nom}
function profilOfRes(rid){const r=byId('ressources',rid);return r&&r.profil||'fr'}
const ICON={
 dash:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
 proj:'<path d="M3 21V9l6-4v4l6-4v4l6-4v16z"/>',
 res:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/>',
 plan:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h5M10 17h6"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h4"/>',
 saisie:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/>',
 pf:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
 regles:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
};
function ic(k,s){return '<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>'}

/* ---------- calculs métier ---------- */
function tjmFor(pid,rid,phase){const a=list('affectations').find(x=>x.projetId===pid&&x.ressourceId===rid&&x.phase===phase)||list('affectations').find(x=>x.projetId===pid&&x.ressourceId===rid);if(a&&num(a.tjm))return num(a.tjm);const r=byId('ressources',rid);return r?num(r.tjmVente):0}
function phaseOf(p,d){d=d||today();if(p.cloture)return'termine';if(p.devDebut&&d<p.devDebut)return'avenir';if(p.devFin&&d<=p.devFin)return'dev';if(p.mesDebut&&d<p.mesDebut)return'inter';if(p.mesFin&&d<=p.mesFin)return'mes';if(p.mesFin&&d>p.mesFin)return'retard';return'avenir'}
const PHASE_LBL={avenir:['À venir',''],dev:['Développement','dev'],inter:['Avant mise en service','warn'],mes:['Mise en service','mes'],retard:['Dépassement','bad'],termine:['Terminé','ok']};
function phasePill(p){const k=phaseOf(p);return '<span class="pill '+PHASE_LBL[k][1]+'">'+PHASE_LBL[k][0]+'</span>'}
function projStats(pid){
  const aff=list('affectations').filter(a=>a.projetId===pid);
  const tmp=list('temps').filter(t=>t.projetId===pid);
  const fr=list('frais').filter(f=>f.projetId===pid);
  const est=list('estimations').filter(e=>e.projetId===pid);
  const joursPrev=aff.reduce((s,a)=>s+num(a.joursPrevus),0);
  const montPrev=aff.reduce((s,a)=>s+num(a.joursPrevus)*(num(a.tjm)||num((byId('ressources',a.ressourceId)||{}).tjmVente)),0);
  const fraisPrev=est.reduce((s,e)=>s+num(e.totalFrais),0);
  const joursReal=tmp.reduce((s,t)=>s+num(t.jours),0);
  const montReal=tmp.reduce((s,t)=>s+num(t.jours)*tjmFor(pid,t.ressourceId,t.phase),0);
  const fraisReal=fr.reduce((s,f)=>s+num(f.montant),0);
  const fraisRefac=fr.filter(f=>f.refacturable!==false).reduce((s,f)=>s+num(f.montant),0);
  const resIds=[...new Set(aff.map(a=>a.ressourceId))];
  return {joursPrev,montPrev,fraisPrev,joursReal,montReal,fraisReal,fraisRefac,resIds,totalPrev:montPrev+fraisPrev,totalReal:montReal+fraisReal};
}
function pfLines(pid,mois){
  const lines=[];
  const tmp=list('temps').filter(t=>t.projetId===pid&&t.mois===mois&&num(t.jours)>0);
  tmp.sort((a,b)=>(a.phase>b.phase?1:-1));
  tmp.forEach(t=>{const r=byId('ressources',t.ressourceId)||{nom:'?'};const tj=tjmFor(pid,t.ressourceId,t.phase);
    lines.push({type:'prestation',libelle:(t.phase==='mes'?'Mise en service sur site':'Développement')+' · '+r.nom,qte:num(t.jours),unite:'j',pu:tj,montant:num(t.jours)*tj})});
  const m=1+num(S.regles.margeFrais)/100;
  const fr=list('frais').filter(f=>f.projetId===pid&&f.mois===mois&&f.refacturable!==false);
  const g={};fr.forEach(f=>{const k=f.categorie||'Divers';g[k]=(g[k]||0)+num(f.montant)});
  Object.keys(g).sort().forEach(k=>lines.push({type:'frais',libelle:'Frais de déplacement · '+k+(m!==1?' (+'+nf(S.regles.margeFrais)+' %)':''),qte:1,unite:'forfait',pu:g[k]*m,montant:g[k]*m}));
  return lines;
}

/* calculateur de frais */
function calcFrais(c){
  const R=S.regles,P=profilById(c.profil),E=Object.assign({},DEFAULT_REGLES.estimations,R.estimations||{});
  const jours=Math.max(0,Math.round(num(c.jours)));
  const km=num(c.km);
  const sem=Math.max(1,Math.ceil(jours/5));
  const veille=c.arriveeVeille==null?R.arriveeVeille:c.arriveeVeille;
  const cas=c.cas;
  const lines=[],warn=[];
  if(cas==='journee'&&km>num(R.seuilJourneeKm))warn.push('La distance dépasse '+R.seuilJourneeKm+' km : un déplacement à la journée semble peu réaliste, vérifiez le cas choisi.');
  let nuits=0,nbAR=1,joursWE=0;
  if(cas==='journee'){nbAR=jours}
  else if(cas==='semaine'){nbAR=sem;nuits=Math.min(Math.max(0,jours-sem),sem*num(R.nuitsParSemaine));if(veille)nuits+=sem}
  else if(cas==='continu'){joursWE=2*(sem-1);nuits=Math.max(0,jours+joursWE-1)+(veille?1:0)}
  else {nuits=Math.max(0,jours-1)+(veille?1:0)}
  const presence=jours+joursWE; // jours passés sur place (travaillés + week-ends sur site)
  const R2=v=>Math.round(v*100)/100;
  // Hébergement
  if(nuits){
    const reelSaisi=num(c.nuitPrix);
    if(P.hebergement==='forfait'&&!reelSaisi)lines.push({k:'Hôtel (forfait)',d:nuits+' nuit'+(nuits>1?'s':'')+' × '+eur2(P.hotel),v:nuits*num(P.hotel),t:'forfait'});
    else{const pu=reelSaisi||num(P.hotelEstime);lines.push({k:'Hébergement (au réel)',d:nuits+' nuit'+(nuits>1?'s':'')+' × '+eur2(pu)+(reelSaisi?' (prix saisi)':' (estimation)'),v:nuits*pu,t:'reel'})}
  }
  // Repas / per diem
  if(num(P.perDiem)){lines.push({k:'Per diem hors hébergement',d:presence+' j × '+eur2(P.perDiem),v:presence*num(P.perDiem),t:'forfait'})}
  else{
    if(num(P.dejeuner))lines.push({k:'Déjeuner (forfait)',d:presence+' j × '+eur2(P.dejeuner),v:presence*num(P.dejeuner),t:'forfait'});
    const diners=cas==='journee'?0:nuits;
    if(diners&&num(P.diner))lines.push({k:'Dîner (forfait)',d:diners+' × '+eur2(P.diner),v:diners*num(P.diner),t:'forfait'});
  }
  // Transport principal
  const mode=cas==='journee'?'voiture':c.mode;
  if(mode==='voiture'){
    const kmTot=nbAR*2*km;
    lines.push({k:'Carburant trajets (au réel)',d:nf(kmTot)+' km × '+eur2(E.carburantKm)+' (estimation)',v:kmTot*num(E.carburantKm),t:'reel'});
    if(num(E.peageKm))lines.push({k:'Péages (au réel)',d:nf(kmTot)+' km × '+eur2(E.peageKm)+' (estimation)',v:kmTot*num(E.peageKm),t:'reel'});
  }else{
    const pu=num(c.arPrix)||num(mode==='train'?E.trainAR:E.avionAR);
    lines.push({k:(mode==='train'?'Train':'Avion')+' (au réel)',d:nbAR+' A/R × '+eur2(pu)+(num(c.arPrix)?' (prix saisi)':' (estimation)'),v:nbAR*pu,t:'reel'});
  }
  // Location de voiture : jours travaillés uniquement
  if(c.location){
    if(P.location==='forfait')lines.push({k:'Location voiture (forfait)',d:jours+' j travaillés × '+eur2(P.locationJour),v:jours*num(P.locationJour),t:'forfait'});
    else lines.push({k:'Location voiture (au réel)',d:presence+' j × '+eur2(P.locationEstimee)+' (estimation)',v:presence*num(P.locationEstimee),t:'reel'});
    if(mode!=='voiture'&&num(E.carburantJourSite))lines.push({k:'Carburant sur place (au réel)',d:jours+' j × '+eur2(E.carburantJourSite)+' (estimation)',v:jours*num(E.carburantJourSite),t:'reel'});
  }
  lines.forEach(l=>l.v=R2(l.v));
  const totalFrais=lines.reduce((s,l)=>s+l.v,0);
  const forfaits=lines.filter(l=>l.t==='forfait').reduce((s,l)=>s+l.v,0);
  const tjm=num(c.tjm)||(c.ressourceId?num((byId('ressources',c.ressourceId)||{}).tjmVente):0);
  const presta=jours*tjm;
  const trajetJ=R.trajetFacture&&cas!=='journee'?nbAR*num(R.trajetCoef):0;
  const trajet=trajetJ*tjm;
  const refac=totalFrais*(1+num(R.margeFrais)/100);
  return {lines,totalFrais,forfaits,reel:totalFrais-forfaits,tjm,presta,trajetJ,trajet,refac,total:presta+trajet+totalFrais,nuits,nbAR,jours,sem,warn,mode,profil:P};
}

// Remettre à false et appliquer le bloc « Retour au mode sécurisé » de supabase/mecalux-mode-dev.sql avant la mise en service.
const MODE_DEV=true;
const TBL=c=>'mecalux_'+c;
const toSnake=k=>k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase());
function toRow(c,id,obj){const row={id};const cols=TABLES[c];Object.keys(obj).forEach(k=>{const sk=toSnake(k);if(sk==='id'||!cols.includes(sk))return;let v=obj[k];if(v===''||v===undefined)v=null;row[sk]=v});return row}
const NUMS=['tjm_vente','tjm_cout','distance_km','budget_montant','jours_prevus','tjm','jours','montant','total_frais','trajet','refac'];
function fromRow(r){const o={};Object.keys(r).forEach(k=>{let v=r[k];if(v!=null&&NUMS.includes(k))v=Number(v);if(v===null)v='';o[toCamel(k)]=v});return o}
let sb=null,session=null,membre=null,authMsg='',channel=null;
async function save(c,id,obj){
  obj=Object.assign({},obj);delete obj.id;obj.majLe=new Date().toISOString();
  const prev=S[c][id];S[c][id]=Object.assign({id},obj);scheduleRender();
  const {error}=await sb.from(TBL(c)).upsert(toRow(c,id,obj));
  if(error){if(prev)S[c][id]=prev;else delete S[c][id];handleErr(error);render();return false}
  return true;
}
async function del(c,id){
  const prev=S[c][id];delete S[c][id];render();
  const {error}=await sb.from(TBL(c)).delete().eq('id',id);
  if(error){if(prev)S[c][id]=prev;handleErr(error);render()}
}
async function saveRegles(r){S.regles=r;render();const {error}=await sb.from(TBL('config')).upsert({id:'regles',data:r,maj_le:new Date().toISOString()});if(error)handleErr(error)}
function handleErr(e){
  console.error(e);
  if(e&&e.code==='23503')toast('Impossible : cet élément est encore utilisé ailleurs (affectations, jours ou frais).');
  else if(e&&(e.code==='42501'||/row-level security/i.test(e.message||'')))toast('Accès refusé : votre adresse n\'est pas dans l\'équipe autorisée.');
  else if(e&&e.code==='23514')toast('Valeur refusée par la base (dates ou statut incohérents).');
  else toast('Enregistrement impossible : '+((e&&e.message)||'réessayez.'));
}
let pending=false;
function scheduleRender(){
  const a=document.activeElement;
  if(a&&document.getElementById('main').contains(a)&&a.matches('input,select,textarea')){pending=true;return}
  render();
}

async function loadAll(){
  dbState='loading';render();
  try{
    if(MODE_DEV){membre=true}else{
    const {data:ok,error:e0}=await sb.rpc('mecalux_est_membre');
    if(e0)throw e0;
    membre=!!ok;}
    if(!membre){dbState='refuse';render();return}
    const res=await Promise.all(COLLS.map(c=>sb.from(TBL(c)).select('*')));
    res.forEach((r,i)=>{if(r.error)throw r.error;const o={};r.data.forEach(row=>{o[row.id]=fromRow(row)});S[COLLS[i]]=o});
    const {data:cfg}=await sb.from(TBL('config')).select('data').eq('id','regles').maybeSingle();
    S.regles=cfg&&cfg.data?Object.assign(clone(DEFAULT_REGLES),cfg.data):clone(DEFAULT_REGLES);
    dbState='ok';
  }catch(e){console.error(e);dbState='erreur';authMsg=(e&&e.message)||''}
  render();
  subscribe();
}
function subscribe(){
  if(channel)return;
  channel=sb.channel('mecalux').on('postgres_changes',{event:'*',schema:'public'},p=>{
    const t=String(p.table||'').replace(/^mecalux_/,'');
    if(t==='config'){if(p.new&&p.new.id==='regles'&&p.new.data){S.regles=Object.assign(clone(DEFAULT_REGLES),p.new.data);scheduleRender()}return}
    if(!S[t])return;
    if(p.eventType==='DELETE'){if(p.old&&p.old.id)delete S[t][p.old.id]}
    else if(p.new&&p.new.id){S[t][p.new.id]=fromRow(p.new)}
    scheduleRender();
  }).subscribe();
}

  const cfg=window.HTP_CONFIG||{};

    sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'mecalux-dev'}});

  // Même session que l'espace HT Portage (storageKey partagée)

  if(session)loadAll();else{dbState='login';render()}
}

function appliquerFiltres(tbl){
  const f=ui.filtres[tbl.id]||{};const keys=Object.keys(f).filter(k=>f[k]);
  const lignes=[...tbl.tBodies[0].rows];let vis=0;
  lignes.forEach(tr=>{
    const ok=keys.every(k=>{
      const v=String(f[k]).trim().toLowerCase();const cell=tr.cells[k];if(!cell)return true;
      const txt=cell.textContent.trim().toLowerCase();
      const el=tbl.querySelector('[data-f="'+k+'"]');
      if(el&&el.tagName==='SELECT')return txt===v;
      const m=v.match(/^(>=|<=|>|<|=)\s*(-?[\d\s.,]+)$/);
      if(m){const n=parseFloat(txt.replace(/[^\d,.-]/g,'').replace(',','.'));const x=parseFloat(m[2].replace(/\s/g,'').replace(',','.'));if(isNaN(n))return false;
        return m[1]==='>'?n>x:m[1]==='<'?n<x:m[1]==='>='?n>=x:m[1]==='<='?n<=x:n===x}
      return txt.includes(v);
    });
    tr.hidden=!ok;if(ok)vis++;
  });
  const c=document.getElementById(tbl.id+'-compte');if(c)c.textContent=(keys.length?vis+' sur '+lignes.length:lignes.length)+' ressource'+(lignes.length>1?'s':'');
}

  h+='<div class="grid2"><section class="card"><h2>Hypothèses pour les frais au réel</h2><p class="small muted" style="margin:0">Servent uniquement à estimer avant le départ : carburant, péages et billets sont remboursés au réel sur justificatif.</p><div class="formgrid">'+e('carburantKm','Carburant trajets','€/km')+e('peageKm','Péages','€/km')+e('carburantJourSite','Carburant sur place','€/jour')+e('trainAR','Train aller-retour','€')+e('avionAR','Avion aller-retour','€')+'</div></section>';
  h+='<section class="card"><h2>Séjour et refacturation</h2><div class="formgrid">'+f('nuitsParSemaine','Nuits max. par semaine (retour le WE)','nuits','1')+f('seuilJourneeKm','Alerte déplacement à la journée au-delà de','km','1')+f('trajetCoef','Temps de trajet par aller-retour','jour','0.25')+f('margeFrais','Frais de gestion sur frais refacturés','%','0.5')+'</div>'+cb('arriveeVeille','Arrivée la veille du premier jour par défaut')+cb('trajetFacture','Facturer le temps de trajet à Mecalux')+cb('fraisRefacturablesParDefaut','Nouvelle dépense refacturable par défaut')+'</section></div>';
  return h;
}

/* ---------- formulaires (dialogue) ---------- */
const dlg=document.getElementById('dlg');
function openForm(title,fields,data,onSave,extra){
  data=data||{};
  let h='<h2>'+esc(title)+'</h2><form id="frm" class="formgrid" novalidate>';
  fields.forEach(f=>{
    const v=data[f.k]!=null?data[f.k]:(f.def!=null?f.def:'');
    const full=f.full?' style="grid-column:1/-1"':'';
    if(f.type==='select')h+='<label class="f"'+full+'>'+esc(f.l)+'<select name="'+f.k+'"'+(f.req?' required':'')+'>'+f.opts.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>';
    else if(f.type==='check')h+='<label class="row small" style="font-weight:600;grid-column:1/-1"><input type="checkbox" name="'+f.k+'"'+(v?' checked':'')+'> '+esc(f.l)+'</label>';
    else if(f.type==='textarea')h+='<label class="f" style="grid-column:1/-1">'+esc(f.l)+'<textarea name="'+f.k+'" rows="3">'+esc(v)+'</textarea></label>';
    else h+='<label class="f"'+full+'>'+esc(f.l)+'<input name="'+f.k+'" type="'+(f.type||'text')+'"'+(f.type==='number'?' step="any" min="0"':'')+' value="'+esc(v)+'"'+(f.req?' required':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'></label>';
  });
  h+='</form><p id="frmErr" class="small" style="color:var(--bad);margin:0" role="alert"></p><div class="row">'+(extra||'')+'<span class="sp"></span><button class="btn o" type="button" data-dlg="close">Annuler</button><button class="btn p" type="button" data-dlg="ok">Enregistrer</button></div>';
  document.getElementById('dlgBody').innerHTML=h;
  dlg._save=async()=>{
    const fm=document.getElementById('frm');const o={};
    for(const f of fields){const el=fm.elements[f.k];let v=f.type==='check'?el.checked:el.value.trim();if(f.type==='number')v=v===''?'':num(v);if(f.req&&(v===''||v==null)){document.getElementById('frmErr').textContent='« '+f.l+' » est obligatoire.';el.focus();return}o[f.k]=v}
    const ok=await onSave(o);if(ok!==false){dlg.close();}
  };
  dlg.showModal();
  const first=dlg.querySelector('input,select,textarea');if(first)first.focus();
}
dlg.addEventListener('click',e=>{const b=e.target.closest('[data-dlg]');if(e.target===dlg){dlg.close();return}if(!b)return;if(b.dataset.dlg==='close')dlg.close();if(b.dataset.dlg==='ok')dlg._save();if(b.dataset.dlg==='del'&&dlg._del){dlg._del();}});
dlg.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();dlg._save()}});
function confirmBox(msg,onYes){
  document.getElementById('dlgBody').innerHTML='<h2>Confirmer</h2><p style="margin:0">'+esc(msg)+'</p><div class="row"><span class="sp"></span><button class="btn o" data-dlg="close">Annuler</button><button class="btn d" id="cfYes">Supprimer</button></div>';
  dlg.showModal();document.getElementById('cfYes').onclick=async()=>{dlg.close();await onYes()};
}
function formProjet(p){
  openForm(p?'Modifier le projet':'Nouveau projet',[
    {k:'client',l:'Client',req:true,ph:'IKEA, Limagrain, PepsiCo…'},{k:'nom',l:'Projet',req:true,ph:'Entrepôt automatisé'},
    {k:'site',l:'Site (ville, pays)',ph:'Lyon, France'},
    {k:'distanceKm',l:'Distance aller depuis la base (km)',type:'number'},{k:'refMecalux',l:'Référence Mecalux'},
    {k:'devDebut',l:'Début développement',type:'date'},{k:'devFin',l:'Fin développement',type:'date'},
    {k:'mesDebut',l:'Début mise en service',type:'date'},{k:'mesFin',l:'Fin mise en service',type:'date'},
    {k:'budgetMontant',l:'Budget client (€ HT, facultatif)',type:'number'},
    {k:'cloture',l:'Projet terminé et clôturé',type:'check'},
    {k:'notes',l:'Notes',type:'textarea'}
  ],p,async o=>{if(o.devDebut&&o.devFin&&o.devFin<o.devDebut){document.getElementById('frmErr').textContent='La fin du développement est avant son début.';return false}if(o.mesDebut&&o.mesFin&&o.mesFin<o.mesDebut){document.getElementById('frmErr').textContent='La fin de la mise en service est avant son début.';return false}
    const id=p?p.id:uid('p');const ok=await save('projets',id,Object.assign({},p||{},o));if(ok){toast('Projet enregistré');if(!p)location.hash='projet-'+id}return ok});
}
function formRes(r){
  openForm(r?'Modifier la ressource':'Nouvelle ressource',[
    {k:'nom',l:'Nom',req:true},{k:'code',l:'Trigramme',ph:'SBO'},{k:'role',l:'Rôle',ph:'Automaticien, développeur WMS…'},
    {k:'profil',l:'Pays du collaborateur (fixe le barème de frais)',type:'select',opts:(S.regles.profils||DEFAULT_REGLES.profils).map(z=>[z.id,paysOf(z.id)+' · '+z.nom]),def:'fr'},{k:'tjmVente',l:'TJM de vente (€ HT)',type:'number',req:true},
    {k:'tjmCout',l:'Coût journalier (€, facultatif)',type:'number'},{k:'email',l:'E-mail',type:'email'},
    {k:'dateFin',l:'Fin de mission ou date de départ',type:'date'},
    {k:'actif',l:'Actif (décocher si le collaborateur est parti ; il devient aussi inactif après la date de fin)',type:'check',def:true}
  ],r,async o=>{const ok=await save('ressources',r?r.id:uid('r'),Object.assign({},r||{},o));if(ok)toast('Ressource enregistrée');return ok},
  r?'<button class="btn d sm" type="button" data-dlg="del">Supprimer</button>':'');
  dlg._del=r?()=>{if(list('affectations').some(a=>a.ressourceId===r.id)){document.getElementById('frmErr').textContent='Cette ressource est affectée à des projets : retirez d\'abord ses affectations.';return}dlg.close();del('ressources',r.id)}:null;
}
function formAff(pid,a){
  if(!list('ressources').length){toast('Ajoutez d\'abord une ressource.');location.hash='ressources';return}
  const p=byId('projets',pid);
  openForm(a?'Modifier l\'affectation':'Affecter une ressource',[
    {k:'ressourceId',l:'Ressource',type:'select',opts:list('ressources').filter(r=>estActif(r)||(a&&a.ressourceId===r.id)).sort((x,y)=>x.nom.localeCompare(y.nom)).map(r=>[r.id,(r.code?r.code+' · ':'')+r.nom]),req:true},
    {k:'phase',l:'Phase',type:'select',opts:[['dev','Développement'],['mes','Mise en service sur site']],def:'dev'},
    {k:'joursPrevus',l:'Jours prévus',type:'number',req:true,def:a?'':workdays(p.devDebut,p.devFin)||''},
    {k:'tjm',l:'TJM spécifique (vide = TJM de la ressource)',type:'number'}
  ],a,async o=>{const ok=await save('affectations',a?a.id:uid('a'),Object.assign({projetId:pid},a||{},o));if(ok)toast('Affectation enregistrée');return ok},
  a?'<button class="btn d sm" type="button" data-dlg="del">Retirer</button>':'');
  dlg._del=a?()=>{dlg.close();del('affectations',a.id)}:null;
}
function formFrais(f){
  const pid=f?f.projetId:(ui.saisieProjet||(list('projets')[0]||{}).id);const m=f?f.mois:ui.saisieMois;
  const resIds=[...new Set(list('affectations').filter(a=>a.projetId===pid).map(a=>a.ressourceId))];
  const opts=(resIds.length?resIds:list('ressources').filter(r=>estActif(r)||(f&&f.ressourceId===r.id)).map(r=>r.id)).map(id=>[id,(byId('ressources',id)||{}).nom||'?']);
  openForm(f?'Modifier la dépense':'Nouvelle dépense · '+moisLabel(m),[
    {k:'date',l:'Date',type:'date',def:m===curMonth()?today():m+'-01'},{k:'ressourceId',l:'Ressource',type:'select',opts},
    {k:'categorie',l:'Catégorie',type:'select',opts:CAT_FRAIS.map(c=>[c,c])},{k:'montant',l:'Montant TTC (€)',type:'number',req:true},
    {k:'note',l:'Détail',full:true,ph:'Péage A7, hôtel Ibis Lyon…'},
    {k:'refacturable',l:'Refacturable à Mecalux',type:'check',def:S.regles.fraisRefacturablesParDefaut},
    {k:'justif',l:'Justificatif détaillé joint dans Pleo (obligatoire pour les frais au réel)',type:'check'},
    {k:'dejaFacture',l:'Déjà facturé par ailleurs (hôtel, location, billet)',type:'check'}
  ],f,async o=>{if(o.dejaFacture)o.refacturable=false;const ok=await save('frais',f?f.id:uid('f'),Object.assign({projetId:pid,mois:(o.date||m).slice(0,7)},f||{},o,{mois:(o.date||m).slice(0,7)}));if(ok)toast('Dépense enregistrée');return ok},
  f?'<button class="btn d sm" type="button" data-dlg="del">Supprimer</button>':'');
  dlg._del=f?()=>{dlg.close();del('frais',f.id)}:null;
}

/* ---------- exports ---------- */
function pfData(key){const i=key.lastIndexOf('_');const pid=key.slice(0,i),m=key.slice(i+1);const p=byId('projets',pid);const pf=pfOf(pid,m);const L=pf&&pf.lignes?pf.lignes:pfLines(pid,m);return{p,m,pf,L,tot:L.reduce((x,l)=>x+num(l.montant),0)}}
function pfFile(key){const {p,m}=pfData(key);return ('prefacture_'+p.client+'_'+p.nom+'_'+m).replace(/[^\w-]+/g,'_')}
function pfText(key){const {p,m,pf,L,tot}=pfData(key);return 'Préfacture '+p.client+' · '+p.nom+' · '+moisLabel(m)+(pf&&pf.bdc?' · BDC '+pf.bdc:'')+'\n'+L.map(l=>l.libelle+'\t'+nf(l.qte)+' '+l.unite+'\t'+eur2(l.pu)+'\t'+eur2(l.montant)).join('\n')+'\nTotal HT\t\t\t'+eur2(tot)}
function pfCsv(key){const {p,m,pf,L,tot}=pfData(key);const q=s=>'"'+String(s).replace(/"/g,'""')+'"';const n=v=>String((+v).toFixed(2)).replace('.',',');
  return '﻿'+[['Client','Projet','Période','BDC','Désignation','Quantité','Unité','PU HT','Montant HT'].map(q).join(';')].concat(L.map(l=>[p.client,p.nom,m,pf&&pf.bdc||'',l.libelle,n(l.qte),l.unite,n(l.pu),n(l.montant)].map((v,k)=>k>=5&&k!==6?v:q(v)).join(';'))).concat([['','','','','Total HT','','','',n(tot)].map((v,k)=>k===8?v:q(v)).join(';')]).join('\r\n')}
function pfHtml(key){const {p,m,pf,L,tot}=pfData(key);return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Préfacture '+esc(p.client)+' '+m+'</title><style>body{font-family:Arial,sans-serif;color:#1B1C1C;max-width:800px;margin:40px auto;padding:0 20px}h1{color:#21324E;font-size:22px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}td.n,th.n{text-align:right}tfoot td{font-weight:bold;border-top:2px solid #21324E}.m{color:#4A5468;font-size:13px}</style></head><body><p class="m">PRÉFACTURE · POUR VALIDATION</p><h1>'+esc(p.client)+' · '+esc(p.nom)+'</h1><p class="m">'+esc(p.site||'')+(p.refMecalux?' · Réf. Mecalux '+esc(p.refMecalux):'')+'<br>Période : '+moisLabel(m)+(pf&&pf.bdc?'<br>Bon de commande : '+esc(pf.bdc):'')+'<br>Statut : '+esc(pf&&pf.statut||'À préparer')+'</p><table><thead><tr><th>Désignation</th><th class="n">Qté</th><th class="n">PU HT</th><th class="n">Montant HT</th></tr></thead><tbody>'+L.map(l=>'<tr><td>'+esc(l.libelle)+'</td><td class="n">'+nf(l.qte)+' '+esc(l.unite)+'</td><td class="n">'+eur2(l.pu)+'</td><td class="n">'+eur2(l.montant)+'</td></tr>').join('')+'</tbody><tfoot><tr><td colspan="3">Total HT</td><td class="n">'+eur2(tot)+'</td></tr></tfoot></table>'+(pf&&pf.notes?'<p><b>Notes :</b> '+esc(pf.notes)+'</p>':'')+'</body></html>'}
function dl(filename,data){
  const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':'text/html;charset=utf-8';
  const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copié dans le presse-papiers')}catch(e){toast('Copie refusée par le navigateur.')}}

/* ---------- événements ---------- */
document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-pfmois],[data-calcproj],[data-saisieproj]');
  if(a){if(a.dataset.pfmois)ui.pfMois=a.dataset.pfmois;if(a.dataset.calcproj){const p=byId('projets',a.dataset.calcproj);ui.calc.projetId=p.id;if(p.distanceKm)ui.calc.km=p.distanceKm;const wd=workdays(p.mesDebut,p.mesFin);if(wd)ui.calc.jours=wd;const af=list('affectations').find(x=>x.projetId===p.id&&x.phase==='mes');if(af){ui.calc.ressourceId=af.ressourceId;ui.calc.profil=profilOfRes(af.ressourceId);if(num(af.tjm))ui.calc.tjm=af.tjm}}if(a.dataset.saisieproj)ui.saisieProjet=a.dataset.saisieproj;if(a.dataset.saisiemois)ui.saisieMois=a.dataset.saisiemois}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==='logout'){await sb.auth.signOut();return}if(act==='pwd'){formPwd();return}if(act==='reload'){loadAll();return}
  switch(act){
    case'newProjet':formProjet();break;
    case'editProjet':formProjet(byId('projets',id));break;
    case'delProjet':confirmBox('Supprimer ce projet ? Ses affectations, jours saisis, frais, estimations et préfactures seront supprimés aussi.',async()=>{await del('projets',id);location.hash='projets'});break;
    case'razFiltres':ui.filtres[b.dataset.t]={};render();break;
    case'newRes':formRes();break;
    case'editRes':formRes(byId('ressources',id));break;
    case'newAff':formAff(id);break;
    case'editAff':{const x=byId('affectations',id);formAff(x.projetId,x);break}
    case'newFrais':formFrais();break;
    case'editFrais':formFrais(byId('frais',id));break;
    case'planPrev':ui.planStart=addMonths(ui.planStart,-3);render();break;
    case'planNext':ui.planStart=addMonths(ui.planStart,3);render();break;
    case'saveEst':{const c=ui.calc;if(!c.projetId)return;const r=calcFrais(c);const lib=(document.getElementById('estLib')||{}).value||'Estimation';
      const ok=await save('estimations',c.estId||uid('e'),{projetId:c.projetId,ressourceId:c.ressourceId,libelle:lib,params:{cas:c.cas,profil:c.profil,arPrix:c.arPrix,jours:c.jours,km:c.km,mode:c.mode,location:c.location,nuitPrix:c.nuitPrix,arriveeVeille:c.arriveeVeille,tjm:c.tjm},detail:r.lines.map(l=>({k:l.k,d:l.d,v:l.v,t:l.t})),totalFrais:Math.round(r.totalFrais*100)/100,trajet:Math.round(r.trajet*100)/100,refac:Math.round(r.refac*100)/100});
      if(ok){toast('Estimation enregistrée sur le projet');c.estId=null}break}
    case'copyEst':{const r=calcFrais(ui.calc);copy(r.lines.map(l=>l.k+' ('+l.d+') : '+eur2(l.v)).join('\n')+'\nTotal frais : '+eur2(r.totalFrais)+'\nPrestation : '+eur2(r.presta)+(r.trajet?'\nTemps de trajet : '+eur2(r.trajet):'')+'\nCoût total : '+eur2(r.presta+r.trajet+r.refac));break}
    case'loadEst':{const x=byId('estimations',id);Object.assign(ui.calc,x.params||{},{projetId:x.projetId,ressourceId:x.ressourceId,libelle:x.libelle,estId:x.id});location.hash='calculateur';break}
    case'delEst':confirmBox('Supprimer cette estimation ?',()=>del('estimations',id));break;
    case'pfSave':case'pfRefresh':{const key=b.dataset.k;const i=key.lastIndexOf('_');const pid=key.slice(0,i),m=key.slice(i+1);const pf=pfOf(pid,m)||{};
      const o={projetId:pid,mois:m,statut:act==='pfSave'?document.getElementById('pfStatut').value:(pf.statut||'Brouillon'),bdc:act==='pfSave'?document.getElementById('pfBdc').value.trim():(pf.bdc||''),notes:act==='pfSave'?document.getElementById('pfNotes').value:(pf.notes||''),lignes:pfLines(pid,m).map(l=>Object.assign({},l,{pu:Math.round(l.pu*100)/100,montant:Math.round(l.montant*100)/100}))};
      if(o.statut==='BDC reçu'&&!o.bdc){toast('Saisissez le numéro du BDC.');document.getElementById('pfBdc').focus();return}
      const hist=(pf.historique||[]).slice(-19);if(pf.statut!==o.statut)hist.push({statut:o.statut,le:new Date().toISOString()});o.historique=hist;
      if(await save('prefactures',key,o))toast('Préfacture enregistrée');break}
    case'pfCsv':dl(pfFile(b.dataset.k)+'.csv',pfCsv(b.dataset.k));break;
    case'pfHtml':dl(pfFile(b.dataset.k)+'.html',pfHtml(b.dataset.k));break;
    case'pfCopy':copy(pfText(b.dataset.k));break;
    case'addProfil':{const r=readRegles();r.profils.push({id:uid('b'),nom:'Nouveau barème',hebergement:'reel',hotel:0,hotelEstime:90,dejeuner:0,diner:0,perDiem:0,location:'reel',locationJour:0,locationEstimee:50,regle:''});S.regles=r;render();break}
    case'delProfil':{const r=readRegles();if(r.profils.length<2){toast('Gardez au moins un barème.');return}r.profils.splice(+b.dataset.i,1);S.regles=r;render();break}
    case'saveRegles':await saveRegles(readRegles());toast('Règles enregistrées');break;
    case'resetRegles':confirmBox('Remplacer vos règles par les valeurs par défaut ?',async()=>{await saveRegles(clone(DEFAULT_REGLES));toast('Valeurs par défaut rétablies')});break;
  }
});
function readRegles(){
  const r=clone(S.regles);const m=document.getElementById('main');
  m.querySelectorAll('[data-r]').forEach(el=>{r[el.dataset.r]=el.type==='checkbox'?el.checked:num(el.value)});
  r.estimations=Object.assign({},DEFAULT_REGLES.estimations,r.estimations||{});
  m.querySelectorAll('[data-e]').forEach(el=>{r.estimations[el.dataset.e]=num(el.value)});
  m.querySelectorAll('[data-pi]').forEach(box=>{const z=r.profils[+box.dataset.pi];box.querySelectorAll('[data-z]').forEach(el=>{const k=el.dataset.z;z[k]=['nom','regle','hebergement','location'].includes(k)?el.value:num(el.value)})});
  return r;
}
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.ui){ui[t.dataset.ui]=t.value;pending=false;render();return}
  if(t.dataset.c){const k=t.dataset.c;ui.calc[k]=t.type==='checkbox'?t.checked:t.value;
    if(k==='projetId'&&t.value){const p=byId('projets',t.value);if(p){if(p.distanceKm)ui.calc.km=p.distanceKm;const wd=workdays(p.mesDebut,p.mesFin);if(wd)ui.calc.jours=wd}}
    if(k==='ressourceId'){ui.calc.tjm='';if(t.value)ui.calc.profil=profilOfRes(t.value)}
    if(['cas','projetId','ressourceId','mode','profil'].includes(k)){pending=false;render()}else renderCalcResult();return}
  if(t.dataset.temps){const [rid,ph]=t.dataset.temps.split('|');const pid=ui.saisieProjet||(list('projets')[0]||{}).id;const m=ui.saisieMois;const id=[pid,rid,m,ph].join('_');const v=num(t.value);
    if(!t.value||v===0){if(byId('temps',id))await del('temps',id)}else if(!byId('temps',id)||num(byId('temps',id).jours)!==v){await save('temps',id,{projetId:pid,ressourceId:rid,mois:m,phase:ph,jours:v})}
    toast('Enregistré');return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.c&&t.type==='number'){ui.calc[t.dataset.c]=t.value;renderCalcResult()}});

render();
initDb();
})();
</script>
