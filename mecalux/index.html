          if(okI){let k=0;for(const f of G.frais){occupeMsg('Rattachement des dépenses : '+(++k)+' / '+G.frais.length+'…');await save('frais',f.id,Object.assign({},f,{importId:nid}))}}}finally{libre()}
        toast('Import renommé');return true});break}
    case'impSuppr':{const G=groupesImports().find(x=>x.id===id);if(!G)break;const nom=G.imp?G.imp.nom:'Imports antérieurs (sans nom)';const tot=G.frais.reduce((t,f)=>t+num(f.montant),0);
      confirmBox('Supprimer l\'import « '+nom+' » : '+G.frais.length+' dépense'+(G.frais.length>1?'s':'')+' ('+eur2(tot)+') et leurs justificatifs ? Les préfactures déjà envoyées ne sont pas modifiées. Cette suppression est définitive.',async()=>{
        occupe('Suppression de l\'import…');let k=0;
        try{const ids=new Set(G.frais.map(f=>f.id));const restants=list('frais').filter(f=>!ids.has(f.id));const gardes=new Set(restants.flatMap(f=>f.justifs||[]));
          const aSuppr=[...new Set(G.frais.flatMap(f=>f.justifs||[]))].filter(p=>!gardes.has(p));
          for(const f of G.frais){occupeMsg('Suppression des dépenses : '+(++k)+' / '+G.frais.length+'…');await del('frais',f.id)}
          if(aSuppr.length){occupeMsg('Suppression des justificatifs…');for(let i=0;i<aSuppr.length;i+=100){const {error}=await sb.storage.from(BUCKET_J).remove(aSuppr.slice(i,i+100));if(error)console.error(error)}}
          if(G.imp)await del('imports',G.imp.id)}finally{libre()}
        toast('Import « '+nom+' » supprimé ('+k+' dépense'+(k>1?'s':'')+')')});break}
    case'pleoFermer':ui.pleo=null;render();break;
    case'ecarterFrais':{const f=byId('frais',id);if(!f)break;openForm('Écarter la dépense',[{k:'motif',l:'Motif d\'écart',req:true,full:true,ph:'Ex. repas couvert par le per diem, déjà facturé…'}],{motif:f.motif||''},async o=>{const ok=await save('frais',id,Object.assign({},f,{statut:'ecarte',motif:o.motif,refacturable:false}));if(ok)toast('Dépense écartée');return ok});break}
    case'delFrais':{const f=byId('frais',id);if(!f)break;confirmBox('Supprimer définitivement cette dépense ('+(f.marchand||f.categorie||'')+', '+eur2(f.montant)+' le '+dateFr(f.date)+') ?'+(f.source==='pleo'?' Elle réapparaîtra comme nouvelle si vous réimportez le même fichier Pleo.':''),async()=>{await del('frais',id);toast('Dépense supprimée')});break}
    case'delFraisAffiches':{const tbl=document.getElementById('tblFrais');if(!tbl)break;const ids=[...tbl.tBodies[0].rows].filter(r=>!r.hidden).map(r=>r.dataset.id).filter(Boolean);if(!ids.length){toast('Aucune dépense affichée.');break}
      const tot=ids.reduce((x,i)=>x+num((byId('frais',i)||{}).montant),0);
      confirmBox('Supprimer définitivement les '+ids.length+' dépense'+(ids.length>1?'s':'')+' affichée'+(ids.length>1?'s':'')+' ('+eur2(tot)+') ? Les dépenses masquées par les filtres et les frais écartés ne sont pas concernés.',async()=>{occupe('Suppression de '+ids.length+' dépense'+(ids.length>1?'s':'')+'…');try{let k=0;for(const i of ids){occupeMsg('Suppression : '+(++k)+' / '+ids.length+'…');await del('frais',i)}}finally{libre()}toast(ids.length+' dépense'+(ids.length>1?'s':'')+' supprimée'+(ids.length>1?'s':''))});break}
    case'calcDiversAdd':ui.calc.divers=(ui.calc.divers||[]).concat([{lib:'',montant:''}]);render();{const ins=document.querySelectorAll('[data-div$="|lib"]');if(ins.length)ins[ins.length-1].focus()}break;
    case'calcDiversDel':ui.calc.divers=(ui.calc.divers||[]).filter((_,i)=>i!==+b.dataset.i);render();break;
    case'planActifs':ui.planActifs=!ui.planActifs;render();break;
    case'voirJustif':{const f=byId('frais',id);if(!f||!(f.justifs||[]).length)break;
      const docs=[];for(const pth of f.justifs){const {data,error}=await sb.storage.from(BUCKET_J).createSignedUrl(pth,3600);if(!error&&data)docs.push({nom:pth.split('/').pop().replace(/^\d{13}-/,''),url:data.signedUrl})}
      if(!docs.length){toast('Justificatif introuvable.');break}
      visionneuse(esc((byId('ressources',f.ressourceId)||{}).nom||'')+' · '+dateFr(f.date)+' · '+esc(libMarchand(f))+' · '+eur2(f.montant),docs);break}
    case'pleoVoir':{const l=ui.pleo&&ui.pleo.lignes[+b.closest('tr[data-pi]').dataset.pi];if(!l||!(l.fichiers||[]).length)break;
      const docs=l.fichiers.map(x=>({nom:x.nom,url:URL.createObjectURL(x.blob)}));
      visionneuse(esc((byId('ressources',l.rid)||{}).nom||l.owner||'')+' · '+dateFr(l.iso)+' · '+esc(estIdTech(l.mar)?(l.cp||''):l.mar)+' · '+eur2(l.mont),docs,()=>docs.forEach(d=>URL.revokeObjectURL(d.url)));break}
    case'razFiltres':ui.filtres[b.dataset.t]={};render();break;
    case'newRes':formRes();break;
    case'editRes':formRes(byId('ressources',id));break;
    case'newAff':formAff(id);break;
    case'editAff':{const x=byId('affectations',id);formAff(x.projetId,x);break}
    case'newFrais':formFrais();break;
    case'editFrais':formFrais(byId('frais',id));break;
    case'planPrev':ui.planStart=addMonths(ui.planStart,-3);render();break;
    case'planNext':ui.planStart=addMonths(ui.planStart,3);render();break;
    case'saveEst':{const c=ui.calc;if(!c.projetId)return;const r=calcFrais(c);const lib=(document.getElementById('estLib')||{}).value||'Estimation';
      const ok=await save('estimations',c.estId||uid('e'),{projetId:c.projetId,ressourceId:c.ressourceId,libelle:lib,params:{cas:c.cas,profil:c.profil,arPrix:c.arPrix,nuitsDepart:c.nuitsDepart,nuitsArrivee:c.nuitsArrivee,trainNb:c.trainNb,trainPrix:c.trainPrix,qKm:c.qKm,qCarb:c.qCarb,qPeage:c.qPeage,avionNb:c.avionNb,avionPrix:c.avionPrix,divers:(c.divers||[]).filter(d=>num(d.montant)||String(d.lib||'').trim()),jours:c.jours,km:c.km,mode:c.mode,location:c.location,nuitPrix:c.nuitPrix,tjm:c.tjm},detail:r.lines.map(l=>({k:l.k,d:l.d,v:l.v,t:l.t})),totalFrais:Math.round(r.totalFrais*100)/100,trajet:Math.round(r.trajet*100)/100,refac:Math.round(r.refac*100)/100});
      if(ok){toast('Estimation enregistrée sur le projet');c.estId=null}break}
    case'pdfEst':pdfEstimation(Object.assign({},ui.calc),(document.getElementById('estLib')||{}).value||ui.calc.libelle);break;
    case'pdfEstId':{const x=byId('estimations',id);if(!x)break;const pr=clone(x.params||{});const c=Object.assign({},ui.calc,{trainNb:'',trainPrix:'',avionNb:'',avionPrix:'',nuitsDepart:'',nuitsArrivee:'',qKm:'',qCarb:'',qPeage:'',divers:[]},pr,{projetId:x.projetId,ressourceId:x.ressourceId});pdfEstimation(c,x.libelle);break}
    case'copyEst':{const r=calcFrais(ui.calc);copy(r.lines.map(l=>l.k+' ('+l.d+') : '+eur2(l.v)).join('\n')+'\nTotal frais : '+eur2(r.totalFrais)+'\nPrestation : '+eur2(r.presta)+(r.trajet?'\nTemps de trajet : '+eur2(r.trajet):'')+'\nCoût total : '+eur2(r.presta+r.trajet+r.refac));break}
    case'loadEst':{const x=byId('estimations',id);const pr=clone(x.params||{});Object.assign(ui.calc,{qKm:'',qCarb:'',qPeage:'',trainNb:'',trainPrix:'',avionNb:'',avionPrix:'',nuitsDepart:'',nuitsArrivee:'',divers:[]},pr,{divers:(pr.divers||[]).map(d=>Object.assign({},d))},{projetId:x.projetId,ressourceId:x.ressourceId,libelle:x.libelle,estId:x.id});location.hash='calculateur';break}
    case'delEst':confirmBox('Supprimer cette estimation ?',()=>del('estimations',id));break;
    case'pfSave':case'pfRefresh':{const key=b.dataset.k;const i=key.lastIndexOf('_');const pid=key.slice(0,i),m=key.slice(i+1);const pf=pfOf(pid,m)||{};
      const o={projetId:pid,mois:m,statut:act==='pfSave'?document.getElementById('pfStatut').value:(pf.statut||'Brouillon'),bdc:act==='pfSave'?document.getElementById('pfBdc').value.trim():(pf.bdc||''),notes:act==='pfSave'?document.getElementById('pfNotes').value:(pf.notes||''),lignes:pfLines(pid,m).map(l=>Object.assign({},l,{pu:Math.round(l.pu*100)/100,montant:Math.round(l.montant*100)/100}))};
      if(o.statut==='BDC reçu'&&!o.bdc){toast('Saisissez le numéro du BDC.');document.getElementById('pfBdc').focus();return}
      const hist=(pf.historique||[]).slice(-19);if(pf.statut!==o.statut)hist.push({statut:o.statut,le:new Date().toISOString()});o.historique=hist;
      if(await save('prefactures',key,o))toast('Préfacture enregistrée');break}
    case'pfCsv':dl(pfFile(b.dataset.k)+'.csv',pfCsv(b.dataset.k));break;
    case'pfPdf':pfPdf(b.dataset.k);break;
    case'pfHtml':dl(pfFile(b.dataset.k)+'.html',pfHtml(b.dataset.k));break;
    case'pfCopy':copy(pfText(b.dataset.k));break;
    case'addProfil':{const r=readRegles();r.profils.push({id:uid('b'),nom:'Nouveau barème',hebergement:'reel',hotel:0,hotelEstime:90,dejeuner:0,diner:0,perDiem:0,location:'reel',locationJour:0,locationEstimee:50,regle:''});S.regles=r;render();break}
    case'delProfil':{const r=readRegles();if(r.profils.length<2){toast('Gardez au moins un barème.');return}r.profils.splice(+b.dataset.i,1);S.regles=r;render();break}
    case'saveRegles':await saveRegles(readRegles());toast('Règles enregistrées');break;
  }
});
function readRegles(){
  const r=clone(S.regles);const m=document.getElementById('main');
  m.querySelectorAll('[data-r]').forEach(el=>{r[el.dataset.r]=el.type==='checkbox'?el.checked:num(el.value)});
  r.estimations=Object.assign({},DEFAULT_REGLES.estimations,r.estimations||{});
  m.querySelectorAll('[data-e]').forEach(el=>{r.estimations[el.dataset.e]=num(el.value)});
  m.querySelectorAll('[data-pi]').forEach(box=>{const z=r.profils[+box.dataset.pi];box.querySelectorAll('[data-z]').forEach(el=>{const k=el.dataset.z;z[k]=['nom','regle','hebergement','location','code'].includes(k)?(k==='code'?el.value.trim().toUpperCase():el.value):num(el.value)})});
  return r;
}
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.ui){ui[t.dataset.ui]=t.value;pending=false;render();return}
  if(t.dataset.c){const k=t.dataset.c;ui.calc[k]=t.type==='checkbox'?t.checked:t.value;
    if(k==='projetId'&&t.value){const p=byId('projets',t.value);if(p){if(p.distanceKm)ui.calc.km=p.distanceKm;const wd=workdays(p.mesDebut,p.mesFin);if(wd)ui.calc.jours=wd}}
    if(k==='ressourceId'){ui.calc.tjm=''}
    if(['cas','projetId','ressourceId','mode','profil'].includes(k)){pending=false;render()}else renderCalcResult();return}
  if(t.dataset.roleEmail){const em=t.dataset.roleEmail,ro=t.value;const {error}=await sb.from('mecalux_equipe').update({role:ro}).eq('email',em);if(error){handleErr(error);chargerAcces();return}toast(em+' : '+ROLES[ro]);chargerAcces();return}
  if(t.dataset.agenda&&t.files&&t.files[0]){const f=t.files[0];t.value='';await chargerAgenda(f);return}
  if(ui.agenda&&(t.dataset.agr||t.dataset.agp||t.dataset.agt)){const l=ui.agenda.lignes.find(x=>x.id===t.closest('tr[data-ag]').dataset.ag);if(!l)return;
    if(t.dataset.agr){l.rid=t.value;if(t.value)await memoAgenda('res',(l.initiales.join('')+' '+l.nom.join(' ')).trim(),t.value)}
    if(t.dataset.agt){l.phase=t.value}
    if(t.dataset.agp){if(l.phase==='conge')l.pid=t.value;else{ui.agenda.lignes.filter(x=>x.cleProjet===l.cleProjet&&x.phase!=='conge').forEach(x=>x.pid=t.value);await memoAgenda('tags',l.cleProjet,t.value)}}
    render();return}
  if(t.dataset.agendafiltre!==undefined&&ui.agenda){ui.agenda.filtre=t.value;render();return}
  if(t.dataset.agrempl&&ui.agenda){ui.agenda.remplacer=t.checked;render();return}
  if(t.dataset.pdperso){const f=byId('frais',t.dataset.pdperso);if(f){const ok=await save('frais',f.id,Object.assign({},f,{perso:t.checked}));if(!ok)t.checked=!t.checked;render()}return}
  if(t.dataset.ressEmail){const em=t.dataset.ressEmail;const {error}=await sb.from('mecalux_equipe').update({ressource_id:t.value||null}).eq('email',em);if(error){handleErr(error);return}toast(em+' relié à '+((byId('ressources',t.value)||{}).nom||'aucune ressource'));chargerAcces();return}
  if(t.dataset.afpleo&&t.files&&t.files[0]){const f=t.files[0];t.value='';await afImporterPleo(f);return}
  if(t.dataset.affact&&t.files&&t.files[0]){const f=t.files[0];t.value='';await afImporterFactures(f);return}
  if(t.dataset.af&&ui.af){ui.af.f[t.dataset.af]=t.value;render();return}
  if(t.dataset.afmap){await afMemo(t.dataset.afmap,t.dataset.k,t.value);return}
  if(t.dataset.restvis){ui.restVisibles=t.checked;render();return}
  if(t.dataset.pnom&&ui.pleo){ui.pleo.nom=t.value;return}
  if(t.dataset.pleo){const f=t.files&&t.files[0];t.value='';if(f)chargerFichierPleo(f);return}
  if(t.dataset.pf&&ui.pleo){ui.pleo.f[t.dataset.pf]=t.value;pending=false;render();return}
  if(t.dataset.pk&&ui.pleo){const tr=t.closest('tr[data-pi]');if(!tr)return;const l=ui.pleo.lignes[+tr.dataset.pi];const k=t.dataset.pk;
    if(k==='refac'){l.refac=t.checked;return}
    if(k==='motif'){l.motif=t.value;return}
    if(k==='rid'){const cle=cleOwner(l.owner);ui.pleo.lignes.filter(x=>cleOwner(x.owner)===cle&&!x.ex).forEach(x=>{x.rid=t.value;if(!x.pid||x.via!=='manuel'){const pp=projetPour(x.rid,x.iso);x.pid=pp.pid;x.via=pp.via;x.mois=pp.mois||x.iso.slice(0,7)}});if(t.value)memoriserAlias(l.owner,t.value)}
    else if(k==='pid'){l.pid=t.value;l.via=t.value?'manuel':'';l.mois=l.iso.slice(0,7)}
    else l[k]=t.value;
    pending=false;render();return}
  if(t.dataset.jeff){const mm=t.dataset.jeff;const v=t.value===''?null:num(t.value);S.moisCfg[mm]=Object.assign({},S.moisCfg[mm],{joursEffectifs:v});
    const {error}=await sb.from(TBL('config')).upsert({id:'mois_'+mm,data:S.moisCfg[mm],maj_le:new Date().toISOString()});if(error)handleErr(error);else toast('Jours effectifs enregistrés');pending=false;render();return}
  if(t.dataset.mc||t.dataset.mcall){const pid=ui.saisieProjet||(list('projets')[0]||{}).id;const m=ui.saisieMois;
    const ids=t.dataset.mcall?[...document.querySelectorAll('[data-mc]')].map(x=>x.dataset.mc):[t.dataset.mc];
    for(const rid of ids)await moisComplet(pid,rid,m,t.checked);
    toast(t.checked?'Mois complet enregistré':'Jours effacés');pending=false;render();return}
  if(t.dataset.temps){const [rid,ph]=t.dataset.temps.split('|');const pid=ui.saisieProjet||(list('projets')[0]||{}).id;const m=ui.saisieMois;const id=[pid,rid,m,ph].join('_');const v=num(t.value);
    if(!t.value||v===0){if(byId('temps',id))await del('temps',id)}else if(!byId('temps',id)||num(byId('temps',id).jours)!==v){await save('temps',id,{projetId:pid,ressourceId:rid,mois:m,phase:ph,jours:v})}
    toast('Enregistré');return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.div){const [i,k]=t.dataset.div.split('|');const d=(ui.calc.divers||[])[+i];if(d){d[k]=t.value;renderCalcResult()}return}if(t.dataset.pk==='motif'&&ui.pleo){const tr=t.closest('tr[data-pi]');if(tr)ui.pleo.lignes[+tr.dataset.pi].motif=t.value;return}if(t.dataset.c&&t.type==='number'){ui.calc[t.dataset.c]=t.value;renderCalcResult()}});

render();
initDb();
})();
</script>
</body>
