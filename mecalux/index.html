.cb.t-depl,.sw.t-depl{background:#1F6F78;color:#fff;border-color:#1F6F78}.cb.t-rd,.sw.t-rd{background:#8A5A00;color:#fff;border-color:#8A5A00}.cb.t-conge,.sw.t-conge{background:#2E6B4F;color:#fff;border-color:#2E6B4F}

.cb.t-depl.demi{background:linear-gradient(90deg,#1F6F78 50%,#fff 50%)}.cb.t-rd.demi{background:linear-gradient(90deg,#8A5A00 50%,#fff 50%)}.cb.t-conge.demi{background:linear-gradient(90deg,#2E6B4F 50%,#fff 50%)}
.cal tr.rt th.cn{vertical-align:middle}
.cal th.cn.lb{font-size:11.5px;font-weight:600;color:var(--muted);padding-left:12px;vertical-align:top;padding-top:3px}
.cb:disabled{cursor:default}.cb:disabled:not([class*=' t-']){opacity:.6}
.cb:focus-visible{outline:2px solid var(--plum);outline-offset:1px}

<script>
(function(){
"use strict";
/* ---------- constantes ---------- */
const COLLS=['projets','ressources','affectations','temps','frais','estimations','prefactures','calendrier','imports','perdiem','aleas','cr','fiches'];
/* Barèmes Harington · déplacements Mecalux (livret d'accueil CDC Mecalux) */
const DEFAULT_REGLES={

let dbState='init', readOnly=false;
const ui={filtres:{tblRes:{5:'Actif'}},dashClient:'',dashRes:'',pfMois:curMonth(),saisieMois:curMonth(),saisieProjet:'',planStart:addMonths(curMonth(),-1),projTab:'synthese',

function num(v){const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0}

const fmtE2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
function eur(v){return fmtE.format(v||0)}function eur2(v){return fmtE2.format(v||0)}function nf(v){return fmtN.format(v||0)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function curMonth(){return today().slice(0,7)}
function addMonths(m,k){let [y,mo]=m.split('-').map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+String(mo).padStart(2,'0')}
function moisLabel(m){if(!m)return'';const [y,mo]=m.split('-');return MOIS_LONG[+mo-1]+' '+y}
function moisCourt(m){const [y,mo]=m.split('-');return MOIS_FR[+mo-1]+' '+y.slice(2)}
function dateFr(d){if(!d)return'—';const [y,m,j]=d.split('-');return +j+' '+MOIS_FR[+m-1]+' '+y}
function list(c){return Object.values(S[c])}
function byId(c,id){return S[c][id]}
function monthsBetween(a,b){if(!a||!b)return[];let out=[],m=a.slice(0,7),e=b.slice(0,7),g=0;while(m<=e&&g<60){out.push(m);m=addMonths(m,1);g++}return out}
function workdays(a,b){if(!a||!b||b<a)return 0;let n=0,d=new Date(a+'T12:00:00'),e=new Date(b+'T12:00:00');const fer={};while(d<=e){const w=d.getDay();const y=d.getFullYear();if(!fer[y])fer[y]=new Set(feriesFR(y).map(f=>f[0]));const iso=y+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(w&&w<6&&!fer[y].has(iso))n++;d.setDate(d.getDate()+1)}return n} // lundi-vendredi hors jours fériés
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function profilById(id){const P=S.regles.profils||DEFAULT_REGLES.profils;return P.find(z=>z.id===id)||P[0]}
function estActif(r){return !!r&&r.actif!==false&&!(r.dateFin&&r.dateFin<today())}

/* ---------- calculs métier ---------- */
function tjmFor(pid,rid,phase){const a=list('affectations').find(x=>x.projetId===pid&&x.ressourceId===rid&&x.phase===phase)||list('affectations').find(x=>x.projetId===pid&&x.ressourceId===rid);if(a&&num(a.tjm))return num(a.tjm);const r=byId('ressources',rid);return r?num(r.tjmVente):0}
function phaseOf(p,d){d=d||today();if(p.cloture)return'termine';if(p.devDebut&&d<p.devDebut)return'avenir';if(p.devFin&&d<=p.devFin)return'dev';if(p.mesDebut&&d<p.mesDebut)return'inter';if(p.mesFin&&d<=p.mesFin)return'mes';if(p.mesFin&&d>p.mesFin)return'retard';return'avenir'}
const PHASE_LBL={avenir:['À venir',''],dev:['Développement','dev'],inter:['Avant mise en service','warn'],mes:['Mise en service','mes'],retard:['Dépassement','bad'],termine:['Terminé','ok']};
function phasePill(p){const k=phaseOf(p);return '<span class="pill '+PHASE_LBL[k][1]+'">'+PHASE_LBL[k][0]+'</span>'}
function projStats(pid){
  const aff=list('affectations').filter(a=>a.projetId===pid);
  const tmp=list('temps').filter(t=>t.projetId===pid);
  const fr=list('frais').filter(f=>f.projetId===pid&&fraisCompte(f));
  const est=list('estimations').filter(e=>e.projetId===pid);
  const joursPrev=aff.reduce((s,a)=>s+num(a.joursPrevus),0);
  const montPrev=aff.reduce((s,a)=>s+num(a.joursPrevus)*(num(a.tjm)||num((byId('ressources',a.ressourceId)||{}).tjmVente)),0);
  const fraisPrev=est.reduce((s,e)=>s+num(e.totalFrais),0);
  const joursReal=tmp.reduce((s,t)=>s+num(t.jours),0);
  const couples=[...new Set(tmp.map(t=>t.ressourceId+'|'+t.mois).concat(list('calendrier').filter(c=>c.projetId===pid).map(c=>c.ressourceId+'|'+c.mois)))];
  const montReal=couples.reduce((s,k)=>{const [rid,mo]=k.split('|');return s+prestationLignes(pid,rid,mo).reduce((x,l)=>x+l.montant,0)},0);
  const fraisBareme=list('calendrier').filter(c=>c.projetId===pid).reduce((s,c)=>s+resumeBaremes(c.baremes,c.jours).montant,0);
  const fraisReal=fr.reduce((s,f)=>s+num(f.montant),0)+fraisBareme;
  const fraisRefac=fr.filter(f=>f.refacturable!==false).reduce((s,f)=>s+num(f.montant),0);
  const resIds=[...new Set(aff.map(a=>a.ressourceId))];
  return {joursPrev,montPrev,fraisPrev,joursReal,montReal,fraisReal,fraisRefac,resIds,totalPrev:montPrev+fraisPrev,totalReal:montReal+fraisReal};
}
/* jours facturés au TJM, avec majoration samedi / dimanche et férié (à partir du calendrier quand il existe) */
function prestationLignes(pid,rid,mois){const out=[];const R=S.regles;const kS=num(R.majSamedi||150)/100,kD=num(R.majDimFerie||200)/100;
  const c=list('calendrier').find(x=>x.projetId===pid&&x.ressourceId===rid&&x.mois===mois&&x.jours&&Object.keys(x.jours).length);
  const lib=ph=>ph==='mes'?'Mise en service sur site':ph==='pil'?'Pilotage':ph==='pmo'?'PMO':ph==='hyp'?'Hypercare':ph==='form'?'Formation Mecalux':ph==='formh'?'Formation Harington':'Développement';
  if(c){const info={};joursMois(mois).forEach(j=>info[j.iso]=j);const b={dev:{n:0,sam:0,dim:0},mes:{n:0,sam:0,dim:0},pil:{n:0,sam:0,dim:0},pmo:{n:0,sam:0,dim:0},hyp:{n:0,sam:0,dim:0},form:{n:0,sam:0,dim:0},formh:{n:0,sam:0,dim:0}};
    // formation Harington : toujours une journée simple, même le samedi, le dimanche ou un jour férié
    entJ(c.jours).forEach(([iso,v])=>{const x=pj(v),j=info[iso];if(x&&x.t==='devfr')x.t='dev';if(!x||!j||!b[x.t])return;b[x.t][x.t==='formh'?'n':j.ferie||j.w===0?'dim':j.w===6?'sam':'n']+=x.q});
    ['dev','mes','pil','pmo','hyp','form','formh'].forEach(ph=>{const tj=tjmFor(pid,rid,ph==='formh'?'form':ph),q=b[ph];
      if(q.n)out.push({type:'prestation',libelle:lib(ph),qte:q.n,unite:'j',pu:tj,montant:q.n*tj});
      if(q.sam)out.push({type:'prestation',libelle:lib(ph)+' · samedi ('+nf(kS*100)+' %)',qte:q.sam,unite:'j',pu:tj*kS,montant:q.sam*tj*kS});
      if(q.dim)out.push({type:'prestation',libelle:lib(ph)+' · dimanche et jours fériés ('+nf(kD*100)+' %)',qte:q.dim,unite:'j',pu:tj*kD,montant:q.dim*tj*kD})});
    return out}
  list('temps').filter(t=>t.projetId===pid&&t.ressourceId===rid&&t.mois===mois&&num(t.jours)>0).sort((a,b)=>a.phase>b.phase?1:-1).forEach(t=>{const tj=tjmFor(pid,rid,t.phase);out.push({type:'prestation',libelle:lib(t.phase),qte:num(t.jours),unite:'j',pu:tj,montant:num(t.jours)*tj})});
  return out}
/* nom lisible du marchand : Pleo met parfois un identifiant technique à la place */
const estIdTech=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(String(v||''));
function libMarchand(f){return (f.marchand&&!estIdTech(f.marchand))?f.marchand:(f.note||f.categoriePleo||'')}
const RUBRIQUES=[['prestation','Jours d\'intervention'],['bareme','Frais au barème'],['frais','Frais réels']];
function pfLines(pid,mois){
  const lines=[];const m=1+num(S.regles.margeFrais)/100;const marge=m!==1?' (+'+nf(S.regles.margeFrais)+' %)':'';
  const tmp=list('temps').filter(t=>t.projetId===pid&&t.mois===mois&&num(t.jours)>0);
  const fr=list('frais').filter(f=>f.projetId===pid&&f.mois===mois&&f.refacturable!==false&&fraisCompte(f));
  const cals=list('calendrier').filter(c=>c.projetId===pid&&c.mois===mois&&c.baremes&&Object.keys(c.baremes).length);
  const calJ=list('calendrier').filter(c=>c.projetId===pid&&c.mois===mois&&c.jours&&Object.keys(c.jours).length);
  const rids=[...new Set(tmp.map(t=>t.ressourceId).concat(cals.map(c=>c.ressourceId),calJ.map(c=>c.ressourceId),fr.map(f=>f.ressourceId||'')))];
  const nomDe=rid=>(byId('ressources',rid)||{}).nom||(rid?'?':'Sans collaborateur');
  rids.sort((x,y)=>nomDe(x).localeCompare(nomDe(y))).forEach(rid=>{const r=byId('ressources',rid)||{};const collab={id:rid,nom:nomDe(rid),code:r.code||''};
    prestationLignes(pid,rid,mois).forEach(l=>lines.push(Object.assign(l,{collab})));
    majBaremes();const c=cals.find(x=>x.ressourceId===rid);if(c){const n={};Object.entries(c.baremes).forEach(([iso,b])=>{if(BAREMES_J[b]&&baremeCompte(iso,c.jours))n[b]=(n[b]||0)+1});
      ORDRE_B.filter(b=>n[b]).forEach(b=>{const mb=montantBareme(b);lines.push({type:'bareme',collab,libelle:'Barème '+codeB(b)+' · '+BAREMES_J[b].nom+marge,qte:n[b],unite:'j',pu:mb.v*m,montant:n[b]*mb.v*m})})}
    // frais réels détaillés : par jour (jours × prix) ou une ligne par dépense (date, marchand ou note)
    // petites dépenses (carburant, péages, parking) : une seule ligne par catégorie et par collaborateur
    const frR=fr.filter(f=>(f.ressourceId||'')===rid);
    CAT_GROUPEES.forEach(cat=>{const G=frR.filter(f=>f.categorie===cat&&!(f.parJour&&num(f.jours)));if(!G.length)return;const tot=G.reduce((x,f)=>x+num(f.montant),0);const ds=G.map(f=>f.date).filter(Boolean).sort();
      const per=ds.length?(ds[0]===ds[ds.length-1]?' · '+dateFr(ds[0]).replace(/ \d{4}$/,''):' · du '+dateFr(ds[0]).replace(/ \d{4}$/,'')+' au '+dateFr(ds[ds.length-1]).replace(/ \d{4}$/,'')):'';
      lines.push({type:'frais',collab,libelle:cat+' · '+G.length+' dépense'+(G.length>1?'s':'')+per+marge,qte:1,unite:'',pu:tot*m,montant:tot*m})});
    frR.filter(f=>!(CAT_GROUPEES.includes(f.categorie)&&!(f.parJour&&num(f.jours)))).sort((a,b)=>((a.categorie||'')+(a.date||''))>((b.categorie||'')+(b.date||''))?1:-1).forEach(f=>{const cat=f.categorie||'Divers';
      if(f.parJour&&num(f.jours))lines.push({type:'frais',collab,libelle:cat+marge,qte:num(f.jours),unite:'j',pu:num(f.prixJour)*m,montant:num(f.montant)*m});
      else{const det=[f.date?dateFr(f.date).replace(/ \d{4}$/,''):'',libMarchand(f)].filter(Boolean).join(' · ');lines.push({type:'frais',collab,libelle:cat+(det?' · '+det:'')+marge,qte:1,unite:'',pu:num(f.montant)*m,montant:num(f.montant)*m})}});
  });
  return lines;
}
function pfGroupes(L){const out=[];L.forEach(l=>{const k=l.collab?l.collab.id:'';let g=out.find(x=>x.k===k);if(!g){g={k,collab:l.collab||null,lignes:[],jours:0,presta:0,bareme:0,frais:0,total:0};out.push(g)}
  g.lignes.push(l);g.total+=num(l.montant);if(l.type==='prestation'){g.jours+=num(l.qte);g.presta+=num(l.montant)}else if(l.type==='bareme')g.bareme+=num(l.montant);else g.frais+=num(l.montant)});return out}
const totRub=(L,t)=>L.filter(l=>(l.type||'frais')===t).reduce((x,l)=>x+num(l.montant),0);
function pfDocId(pid,mois){return pid+'_'+mois}

/* calculateur de frais */
function calcFrais(c){
  const R=S.regles,P=profilById(c.profil),E=Object.assign({},DEFAULT_REGLES.estimations,R.estimations||{});
  const jours=Math.max(0,Math.round(num(c.jours)));
  const km=num(c.km);
  const sem=Math.max(1,Math.ceil(jours/5));
  const nDep=c.nuitsDepart===''||c.nuitsDepart==null?num(R.nuitsDepart):num(c.nuitsDepart),nArr=c.nuitsArrivee===''||c.nuitsArrivee==null?num(R.nuitsArrivee):num(c.nuitsArrivee);
  const cas=c.cas;
  const lines=[],warn=[];
  if(cas==='journee'&&km>num(R.seuilJourneeKm))warn.push('La distance dépasse '+R.seuilJourneeKm+' km : un déplacement à la journée semble peu réaliste, vérifiez le cas choisi.');
  let nuits=0,nbAR=1,joursWE=0;
  if(cas==='journee'){nbAR=jours}
  else if(cas==='semaine'){nbAR=sem;nuits=Math.min(Math.max(0,jours-sem),sem*num(R.nuitsParSemaine))}
  else if(cas==='continu'){joursWE=2*(sem-1);nuits=Math.max(0,jours+joursWE-1)}
  else {nuits=Math.max(0,jours-1)}
  // nuits en plus au départ et à l'arrivée, à chaque aller-retour (pas pour un déplacement à la journée)
  const nuitsExtra=cas==='journee'?0:(nDep+nArr)*nbAR;nuits+=nuitsExtra;
  const presence=jours+joursWE+nuitsExtra; // jours passés sur place (travaillés, week-ends sur site, nuits en plus)
  const R2=v=>Math.round(v*100)/100;
  // Hébergement
  if(nuits){
    const reelSaisi=num(c.nuitPrix);
    if(P.hebergement==='forfait'&&!reelSaisi)lines.push({k:'Hôtel (forfait)',d:nuits+' nuit'+(nuits>1?'s':'')+' × '+eur2(P.hotel),v:nuits*num(P.hotel),t:'forfait'});
    else{const pu=reelSaisi||num(P.hotelEstime);lines.push({k:'Hébergement (au réel)',d:nuits+' nuit'+(nuits>1?'s':'')+' × '+eur2(pu)+(reelSaisi?' (prix saisi)':' (estimation)'),v:nuits*pu,t:'reel'})}
  }
  // Repas / per diem
  if(num(P.perDiem)){lines.push({k:'Per diem hors hébergement',d:presence+' j × '+eur2(P.perDiem),v:presence*num(P.perDiem),t:'forfait'})}
  else{
    if(num(P.dejeuner))lines.push({k:'Déjeuner (forfait)',d:presence+' j × '+eur2(P.dejeuner),v:presence*num(P.dejeuner),t:'forfait'});
    const diners=cas==='journee'?0:nuits;
    if(diners&&num(P.diner))lines.push({k:'Dîner (forfait)',d:diners+' × '+eur2(P.diner),v:diners*num(P.diner),t:'forfait'});
  }
  // Transport principal
  const mode=cas==='journee'?'voiture':c.mode;
  if(mode==='voiture'){
    const kmTot=nbAR*2*km;
    lines.push({k:'Carburant trajets (au réel)',d:nf(kmTot)+' km × '+eur2(E.carburantKm)+' (estimation)',v:kmTot*num(E.carburantKm),t:'reel'});
    if(num(E.peageKm))lines.push({k:'Péages (au réel)',d:nf(kmTot)+' km × '+eur2(E.peageKm)+' (estimation)',v:kmTot*num(E.peageKm),t:'reel'});
  }else{
    const pu=num(c.arPrix)||num(mode==='train'?E.trainAR:E.avionAR);
    lines.push({k:(mode==='train'?'Train':'Avion')+' (au réel)',d:nbAR+' A/R × '+eur2(pu)+(num(c.arPrix)?' (prix saisi)':' (estimation)'),v:nbAR*pu,t:'reel'});
  }
  // Location de voiture : jours travaillés uniquement
  if(c.location){
    if(P.location==='forfait')lines.push({k:'Location voiture (forfait)',d:jours+' j travaillés × '+eur2(P.locationJour),v:jours*num(P.locationJour),t:'forfait'});
    else lines.push({k:'Location voiture (au réel)',d:presence+' j × '+eur2(P.locationEstimee)+' (estimation)',v:presence*num(P.locationEstimee),t:'reel'});
    if(mode!=='voiture'&&num(E.carburantJourSite)&&!(num(c.qKm)||num(c.qCarb)||num(c.qPeage)))lines.push({k:'Carburant sur place (au réel)',d:jours+' j × '+eur2(E.carburantJourSite)+' (estimation)',v:jours*num(E.carburantJourSite),t:'reel'});
  }
  // trajet quotidien logement → site, chaque jour travaillé
  const qKm=num(c.qKm),qC=c.qCarb!==''&&c.qCarb!=null?num(c.qCarb):qKm*2*num(E.carburantKm),qP=c.qPeage!==''&&c.qPeage!=null?num(c.qPeage):qKm*2*num(E.peageKm);
  if(jours&&qC>0)lines.push({k:'Carburant quotidien (logement → site)',d:jours+' j travaillés × '+eur2(qC)+(c.qCarb!==''&&c.qCarb!=null?'':' ('+nf(2*qKm)+' km × '+eur2(E.carburantKm)+', estimation)'),v:jours*qC,t:'reel'});
  if(jours&&qP>0)lines.push({k:'Péage quotidien (logement → site)',d:jours+' j travaillés × '+eur2(qP)+(c.qPeage!==''&&c.qPeage!=null?'':' ('+nf(2*qKm)+' km × '+eur2(E.peageKm)+', estimation)'),v:jours*qP,t:'reel'});
  // frais complémentaires : train et avion à part, frais divers
  const tNb=num(c.trainNb),aNb=num(c.avionNb);
  if(tNb>0){const pu=num(c.trainPrix)||num(E.trainAR);lines.push({k:'Train (en plus)',d:nf(tNb)+' A/R × '+eur2(pu)+(num(c.trainPrix)?'':' (estimation)'),v:tNb*pu,t:'reel'})}
  if(aNb>0){const pu=num(c.avionPrix)||num(E.avionAR);lines.push({k:'Avion (en plus)',d:nf(aNb)+' A/R × '+eur2(pu)+(num(c.avionPrix)?'':' (estimation)'),v:aNb*pu,t:'reel'})}
  (c.divers||[]).forEach(d=>{if(num(d.montant))lines.push({k:'Divers · '+(String(d.lib||'').trim()||'sans libellé'),d:'',v:num(d.montant),t:'reel'})});
  lines.forEach(l=>l.v=R2(l.v));
  const totalFrais=lines.reduce((s,l)=>s+l.v,0);
  const forfaits=lines.filter(l=>l.t==='forfait').reduce((s,l)=>s+l.v,0);
  const tjm=num(c.tjm)||(c.ressourceId?num((byId('ressources',c.ressourceId)||{}).tjmVente):0);
  const presta=jours*tjm;
  const trajetJ=R.trajetFacture&&cas!=='journee'?nbAR*num(R.trajetCoef):0;
  const trajet=trajetJ*tjm;
  const refac=totalFrais*(1+num(R.margeFrais)/100);
  return {lines,totalFrais,forfaits,reel:totalFrais-forfaits,tjm,presta,trajetJ,trajet,refac,total:presta+trajet+totalFrais,nuits,nuitsExtra,nDep,nArr,nbAR,jours,sem,warn,mode,profil:P};
}

const MODE_DEV=false;
const TBL=c=>'mecalux_'+c;
const toSnake=k=>k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase());
function toRow(c,id,obj){const row={id};const cols=TABLES[c];Object.keys(obj).forEach(k=>{const sk=toSnake(k);if(sk==='id'||!cols.includes(sk))return;let v=obj[k];if(v===''||v===undefined)v=null;row[sk]=v});return row}
const NUMS=['jours_mes','taux','depenses_perso','nb_lignes','total','tjm_vente','tjm_cout','distance_km','budget_montant','jours_prevus','tjm','jours','montant','total_frais','trajet','refac'];
function fromRow(r){const o={};Object.keys(r).forEach(k=>{let v=r[k];if(v!=null&&typeof v!=='object'&&NUMS.includes(k))v=Number(v);if(v===null)v='';o[toCamel(k)]=v});return o}
let sb=null,session=null,membre=null,estAdmin=false,monRole='',peutPleo=false,maRessource='',etatDemande='',authMsg='',channel=null;
async function save(c,id,obj){
  obj=Object.assign({},obj);delete obj.id;obj.majLe=new Date().toISOString();
  const prev=S[c][id];S[c][id]=Object.assign({id},obj);scheduleRender();
  const {error}=await sb.from(TBL(c)).upsert(toRow(c,id,obj));
  if(error){if(prev)S[c][id]=prev;else delete S[c][id];handleErr(error);render();return false}
  return true;
}
async function del(c,id){
  const prev=S[c][id];delete S[c][id];render();
  const {error}=await sb.from(TBL(c)).delete().eq('id',id);
  if(error){if(prev)S[c][id]=prev;handleErr(error);render()}
}
async function saveRegles(r){S.regles=r;render();const {error}=await sb.from(TBL('config')).upsert({id:'regles',data:r,maj_le:new Date().toISOString()});if(error)handleErr(error)}
function handleErr(e){
  console.error(e);
  if(e&&e.code==='23503')toast('Impossible : cet élément est encore utilisé ailleurs (affectations, jours ou frais).');
  else if(e&&(e.code==='42501'||/row-level security/i.test(e.message||'')))toast('Accès refusé : votre adresse n\'est pas dans l\'équipe autorisée.');
  else if(e&&e.code==='23514')toast('Valeur refusée par la base (dates ou statut incohérents).');
  else toast('Enregistrement impossible : '+((e&&e.message)||'réessayez.'));
}
let pending=false;
function scheduleRender(){
  if(typeof paint!=='undefined'&&paint){pending=true;return}
  const a=document.activeElement;
  if(a&&document.getElementById('main').contains(a)&&a.matches('input,select,textarea')){pending=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(pending){pending=false;scheduleRender()}},150)});

async function loadAll(){
  dbState='loading';render();
  try{
    if(MODE_DEV){membre=true}else{
    const {data:ok,error:e0}=await sb.rpc('mecalux_est_membre');
    if(e0)throw e0;
    membre=!!ok;
    if(membre){const {data:ro}=await sb.rpc('mecalux_role');monRole=ro||'';estAdmin=monRole==='admin';peutPleo=['admin','superuser','harington'].includes(monRole);if(monRole==='superuser'){const {data:mr}=await sb.rpc('mecalux_ma_ressource');maRessource=mr||''}if(estAdmin)setTimeout(chargerAcces,0)}}
    if(!membre){const {data:etat}=await sb.rpc('mecalux_demander_acces');etatDemande=etat||'';dbState='refuse';render();return}
    const res=await Promise.all(COLLS.map(c=>sb.from(TBL(c)).select('*')));
    res.forEach((r,i)=>{if(r.error)throw r.error;const o={};r.data.forEach(row=>{o[row.id]=fromRow(row)});S[COLLS[i]]=o});
    const {data:cfgs,error:e1}=await sb.from(TBL('config')).select('id,data');if(e1)throw e1;
    S.circuit={};if(!MODE_DEV){const {data:ci}=await sb.from('mecalux_circuit').select('role,nom,email');(ci||[]).forEach(x=>S.circuit[x.role]={nom:x.nom||'',email:x.email||''})}
    S.droits={};if(!MODE_DEV){const {data:dr,error:e2}=await sb.from('mecalux_droits').select('role,rubrique,autorise');if(e2)throw e2;(dr||[]).forEach(d=>{S.droits[d.role+'|'+d.rubrique]=d.autorise})}
    const cfg=(cfgs||[]).find(c=>c.id==='regles');
    S.regles=cfg&&cfg.data?Object.assign(clone(DEFAULT_REGLES),cfg.data):clone(DEFAULT_REGLES);
    S.moisCfg={};(cfgs||[]).forEach(c=>{if(/^mois_/.test(c.id))S.moisCfg[c.id.slice(5)]=c.data||{};if(c.id==='pleo_alias')S.pleoAlias=c.data||{};if(c.id==='agenda_alias')S.agendaAlias=c.data||{};if(c.id==='analyse_attrib')S.analyseAttrib=c.data||{}});
    dbState='ok';
  }catch(e){console.error(e);dbState='erreur';authMsg=(e&&e.message)||''}
  render();
  subscribe();
}
function subscribe(){
  if(channel)return;
  channel=sb.channel('mecalux').on('postgres_changes',{event:'*',schema:'public'},p=>{
    const t=String(p.table||'').replace(/^mecalux_/,'');
    if(t==='circuit'){S.circuit=S.circuit||{};const d=p.eventType==='DELETE'?p.old:p.new;if(d&&d.role){if(p.eventType==='DELETE')delete S.circuit[d.role];else S.circuit[d.role]={nom:d.nom||'',email:d.email||''}}scheduleRender();return}
    if(t==='droits'){S.droits=S.droits||{};const d=p.eventType==='DELETE'?p.old:p.new;if(d&&d.role){if(p.eventType==='DELETE')delete S.droits[d.role+'|'+d.rubrique];else S.droits[d.role+'|'+d.rubrique]=d.autorise}scheduleRender();return}
    if(t==='config'){if(p.new&&p.new.id==='regles'&&p.new.data){S.regles=Object.assign(clone(DEFAULT_REGLES),p.new.data);scheduleRender()}
      else if(p.new&&/^mois_/.test(p.new.id||'')){S.moisCfg[p.new.id.slice(5)]=p.new.data||{};scheduleRender()}
      else if(p.new&&p.new.id==='pleo_alias'){S.pleoAlias=p.new.data||{}}else if(p.new&&p.new.id==='agenda_alias'){S.agendaAlias=p.new.data||{}}else if(p.new&&p.new.id==='analyse_attrib'){S.analyseAttrib=p.new.data||{}}return}
    if(!S[t])return;
    if(p.eventType==='DELETE'){if(p.old&&p.old.id)delete S[t][p.old.id]}
    else if(p.new&&p.new.id){S[t][p.new.id]=fromRow(p.new)}
    scheduleRender();
  }).subscribe();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(session||MODE_DEV)&&membre&&dbState==='ok'){loadAll()}});

async function initDb(){
  const cfg=window.HTP_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey){dbState='config';render();return}
  if(MODE_DEV){
    sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'mecalux-dev'}});
    loadAll();return;
  }
  // Session propre au pilotage (page de connexion : connexion.html)
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'mecalux-pilotage'}});
  const {data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((ev,s)=>{const was=!!session;session=s;if(s&&!was)loadAll();if(!s){membre=null;COLLS.forEach(c=>S[c]={});if(channel){sb.removeChannel(channel);channel=null}location.replace('connexion.html')}});
  if(!session){location.replace('connexion.html');return}
  // Double authentification obligatoire : sans code validé, retour à la page de connexion
  const niv=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(!niv.data||niv.data.currentLevel!=='aal2'){location.replace('connexion.html?mfa=1');return}
  surveillerInactivite();loadAll();
}
// Déconnexion automatique après 30 minutes sans activité (souris, clavier, toucher)
function surveillerInactivite(){let t=Date.now();const MAX=30*60*1000;
  ['mousemove','keydown','click','touchstart','scroll'].forEach(e=>document.addEventListener(e,()=>{t=Date.now()},{passive:true,capture:true}));
  setInterval(async()=>{if(Date.now()-t>MAX&&!occupeN)deconnecter('connexion.html?expire=1')},30000)}
// Déconnexion de ce navigateur uniquement (ne ferme pas les autres sites du même compte) ; nettoyage forcé si besoin
async function deconnecter(cible){let r=null;try{r=await sb.auth.signOut({scope:'local'})}catch(e){r={error:e}}
  if(r&&r.error){try{Object.keys(localStorage).filter(k=>k.indexOf('mecalux-pilotage')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}location.replace(cible||'connexion.html')}
function formPwd(){
  openForm('Changer mon mot de passe',[{k:'pwd',l:'Nouveau mot de passe (8 caractères minimum)',type:'password',req:true,full:true}],{},async o=>{
    if(o.pwd.length<8){document.getElementById('frmErr').textContent='8 caractères minimum.';return false}
    const {error}=await sb.auth.updateUser({password:o.pwd});if(error){document.getElementById('frmErr').textContent=error.message;return false}toast('Mot de passe modifié');return true});
}

// Rôles : admin (tous les droits), harington (sauf gestion des accès), mecalux (sauf gestion des accès et imports Pleo)
const ROLES={admin:'Admin Harington',superuser:'Super user Harington',harington:'Utilisateur Harington',mecalux:'Utilisateur Mecalux'};
// Droits par rubrique : réglables par l'admin (page Accès), avec des verrous imposés par la sécurité de la base
const PROFILS_DROITS=['superuser','harington','mecalux'];
function verrouDroit(role,k){if(role==='admin')return true;if(k==='acces')return false;
  if(k==='perdiem'&&role!=='superuser')return false;if((k==='import-pleo'||k==='analyse-frais')&&role==='mecalux')return false;
  if(k==='tableau-de-bord')return true;return null}
function droit(role,k){const v=verrouDroit(role,k);if(v!==null)return v;const d=(S.droits||{})[role+'|'+k];return d===undefined?true:!!d}
function rubriqueDe(k){return k.startsWith('projet-')?'projets':k.startsWith('prefacture-')?'prefactures':k==='import-agenda'?'saisie':k}
function routeAutorisee(k){if(MODE_DEV)return true;return droit(monRole,rubriqueDe(k))}

  ['projets','Projets','proj'],
  ['ressources','Ressources','res'],
  ['planning','Planning','plan'],
  ['calculateur','Calculateur de frais','calc'],

  const pfAttente=list('prefactures').filter(p=>p.statut&&p.statut!=='Facturée'&&p.statut!=='Brouillon').length;
  document.getElementById('menu').innerHTML=ROUTES.filter(([k])=>routeAutorisee(k)).map(([k,l,i])=>'<a href="#'+k+'"'+(base===k?' class="on" aria-current="page"':'')+'>'+ic(i)+l+(k==='prefactures'&&pfAttente?'<span class="badge">'+pfAttente+'</span>':'')+(k==='acces'&&ui.acces&&ui.acces.demandes.filter(x=>x.statut==='en_attente').length?'<span class="badge">'+ui.acces.demandes.filter(x=>x.statut==='en_attente').length+'</span>':'')+'</a>').join('');
  const st={init:'Connexion…',loading:'Chargement des données…',ok:MODE_DEV?'Mode développement · sans connexion':'Données à jour',login:'Non connecté',refuse:'Accès non autorisé',erreur:'Erreur de connexion',config:'Configuration manquante'}[dbState]||'';
  const who=MODE_DEV?'':(session&&session.user?session.user.email:'');
  document.getElementById('sidebox').innerHTML='<span class="k">'+(who?'Connecté':'État')+'</span><span style="word-break:break-all">'+esc(who||st)+'</span>'+(who?'<span class="small">'+esc((ROLES[monRole]?ROLES[monRole]+' · ':'')+st)+'</span><div class="row" style="margin-top:4px"><button class="btn sm" style="background:transparent;color:#F3E6EC;border:1px solid #6B7FA3" data-act="pwd">Mot de passe</button><button class="btn sm" style="background:transparent;color:#F3E6EC;border:1px solid #6B7FA3" data-act="logout">Déconnexion</button></div>':'')+'<span class="k" style="margin-top:6px">Circuit de facturation</span><span>Préparation → Responsable ADV Harington → Responsable ADV Mecalux (BDC) → facture</span>';
  document.getElementById('menu').style.display=(dbState==='ok'||dbState==='loading')?'':'none';
}
function render(){
  renderMenu();
  const r=route(),m=document.getElementById('main');
  if(dbState==='ok'&&!routeAutorisee(r)){const ok=ROUTES.find(([k])=>routeAutorisee(k));location.replace('#'+(ok?ok[0]:'tableau-de-bord'));return}
  let html='';
  try{
    if(r.startsWith('projet-'))html=vProjet(r.slice(7));
    else if(r.startsWith('prefacture-'))html=vPrefacture(r.slice(11));
    else html=({'tableau-de-bord':vDash,projets:vProjets,ressources:vRessources,planning:vPlanning,calculateur:vCalc,saisie:vSaisie,'import-pleo':vImportPleo,prefactures:vPrefactures,restitutions:vRestitutions,'analyse-frais':vAnalyseFrais,perdiem:vPerdiem,'import-agenda':vImportAgenda,regles:vRegles,acces:vAcces}[r]||vDash)();
  }catch(e){console.error(e);html='<div class="card">Erreur d\'affichage : '+esc(e.message)+'</div>'}
  if(dbState==='login'){location.replace('connexion.html');return}
  if(dbState==='config'){m.innerHTML='<section class="card"><h1>Configuration manquante</h1><p style="margin:0">La configuration Supabase du site (assets/js/config.js) est introuvable.</p></section>';return}
  if(dbState==='refuse'){const em=esc(session&&session.user.email);const txt=etatDemande==='refusee'?'Votre demande d\'accès pour <b>'+em+'</b> n\'a pas été acceptée. Si vous pensez qu\'il s\'agit d\'une erreur, contactez votre interlocuteur Harington.':'Votre compte (<b>'+em+'</b>) est bien créé. '+(etatDemande==='demande_creee'?'Votre demande d\'accès vient d\'être transmise':'Votre demande d\'accès a été transmise')+' à l\'équipe Harington : vous recevrez un e-mail dès qu\'elle sera validée.';
    m.innerHTML='<section class="card" style="max-width:560px"><h1>'+(etatDemande==='refusee'?'Accès non accordé':'Demande en attente de validation')+'</h1><p style="margin:0">'+txt+'</p><div class="row">'+(etatDemande==='refusee'?'':'<button class="btn p" data-act="reload">J\'ai reçu la validation : actualiser</button>')+'<button class="btn o" data-act="logout">Se déconnecter</button></div></section>';return}
  if(dbState==='erreur'){m.innerHTML='<section class="card"><h1>Connexion à la base impossible</h1><p class="muted" style="margin:0">'+esc(authMsg)+'</p><button class="btn p" data-act="reload" style="align-self:flex-start">Réessayer</button></section>';return}
  if(dbState==='init'){m.innerHTML='';return}
  m.innerHTML=(MODE_DEV?'<div class="banner">Mode développement : accès sans connexion. N\'enregistrez pas encore de données sensibles.</div>':'')+(dbState==='loading'?'<div class="banner" style="background:#E8EEF6;color:var(--navy)">Chargement des données…</div>':'')+html;
  if(r==='calculateur')renderCalcResult();

  m.querySelectorAll('table.filtrable').forEach(appliquerFiltres);
}

function selProj(name,val,empty){return '<select name="'+name+'" data-k="'+name+'">'+(empty?'<option value="">'+empty+'</option>':'')+list('projets').sort((a,b)=>(a.client+a.nom).localeCompare(b.client+b.nom)).map(p=>'<option value="'+p.id+'"'+(p.id===val?' selected':'')+'>'+esc(p.client+' · '+p.nom)+'</option>').join('')+'</select>'}

/* ---------- vues ---------- */
function vDash(){
  let projs=list('projets');
  if(ui.dashClient)projs=projs.filter(p=>p.client===ui.dashClient);
  if(ui.dashRes)projs=projs.filter(p=>list('affectations').some(a=>a.projetId===p.id&&a.ressourceId===ui.dashRes));
  const st=projs.map(p=>({p,s:projStats(p.id),ph:phaseOf(p)}));
  const actifs=st.filter(x=>['dev','inter','mes','retard'].includes(x.ph));
  const mois=curMonth();
  const surSite=new Set(list('affectations').filter(a=>a.phase==='mes').filter(a=>{const p=byId('projets',a.projetId);return p&&phaseOf(p)==='mes'}).map(a=>a.ressourceId));
  const totPrev=st.reduce((s,x)=>s+x.s.totalPrev,0),totReal=st.reduce((s,x)=>s+x.s.totalReal,0);
  const fraisMois=list('frais').filter(f=>f.mois===mois&&fraisCompte(f)&&projs.some(p=>p.id===f.projetId)).reduce((s,f)=>s+num(f.montant),0);
  const pfMois=addMonths(mois,-1);
  const pfTodo=list('projets').filter(p=>pfLines(p.id,pfMois).length&&(!pfOf(p.id,pfMois)||pfOf(p.id,pfMois).statut==='Brouillon'));
  const alerts=[];
  st.forEach(({p,s,ph})=>{
    if(ph==='retard')alerts.push(['bad',esc(p.client+' · '+p.nom)+' : la mise en service devait finir le '+dateFr(p.mesFin)+'.',p.id]);
    else if(s.joursPrev&&s.joursReal/s.joursPrev>0.9)alerts.push(['warn',esc(p.client+' · '+p.nom)+' : '+Math.round(100*s.joursReal/s.joursPrev)+' % des jours prévus consommés.',p.id]);
    if(p.mesDebut&&p.mesDebut>today()&&p.mesDebut<=addDays(today(),21))alerts.push(['',esc(p.client+' · '+p.nom)+' : départ sur site le '+dateFr(p.mesDebut)+'. Préparez les réservations.',p.id]);
  });
  let h=head(moisLabel(mois),'Tableau de bord','<a class="btn o" href="#calculateur">'+ic('calc',18)+'Estimer des frais</a><button class="btn p" data-act="newProjet">+ Nouveau projet</button>');

}

function vPlanning(){
  const start=ui.planStart,N=12,months=[];for(let i=0;i<N;i++)months.push(addMonths(start,i));
  const end=addMonths(start,N-1);const cm=curMonth();
  const ps=list('projets').filter(p=>(p.devDebut||p.mesDebut))
    .sort((a,b)=>(a.devDebut||a.mesDebut||'')>(b.devDebut||b.mesDebut||'')?1:-1);
  let h=head('Vue sur 12 mois','Planning','<button class="btn o sm" data-act="planPrev" aria-label="Mois précédents">←</button><span style="font-weight:700;text-transform:capitalize">'+moisLabel(start)+' – '+moisLabel(end)+'</span><button class="btn o sm" data-act="planNext" aria-label="Mois suivants">→</button>');
  const pos=d=>{const m=d.slice(0,7);const i=months.indexOf(m);if(i<0)return m<start?-1:N;const dim=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return i+(+d.slice(8)-1)/dim};
  function gbar(a,b,cls,lbl){if(!a||!b)return'';let x=pos(a),y=pos(b)+0.03;if(y<0||x>=N)return'';x=Math.max(0,x);y=Math.min(N,y);return{x,y,cls,lbl}}
  let g='<div class="gantt" style="grid-template-columns:200px repeat('+N+',1fr)"><div class="gh" style="text-align:left">Projet</div>'+months.map(m=>'<div class="gh">'+moisCourt(m)+'</div>').join('');
  if(!ps.length)g+='<div class="gl muted" style="grid-column:1/-1">Ajoutez des dates aux projets pour les voir ici.</div>';
  ps.forEach(p=>{
    const bars=[gbar(p.devDebut,p.devFin,'dev','Dév.'),gbar(p.mesDebut,p.mesFin,'mes','MES')].filter(Boolean);
    g+='<div class="gl"><a href="#projet-'+p.id+'" style="font-weight:700;color:var(--navy);text-decoration:none">'+esc(p.client)+'</a> <span class="small muted">'+esc(p.nom)+'</span></div>';
    g+='<div style="grid-column:2/-1;position:relative;display:grid;grid-template-columns:repeat('+N+',1fr)">'+months.map(m=>'<div class="gc'+(m===cm?' today':'')+'"></div>').join('')+bars.map(b=>'<div class="gbar '+b.cls+'" style="left:'+(100*b.x/N)+'%;width:calc('+(100*(b.y-b.x)/N)+'% - 2px)">'+b.lbl+'</div>').join('')+'</div>';
  });
  g+='</div>';
  h+='<section class="card"><div class="card-h"><h2>Phases des projets</h2><div class="row small"><span class="pill" style="background:var(--steel);color:#fff">Développement</span><span class="pill" style="background:var(--rose);color:var(--navy)">Mise en service sur site</span></div></div><div class="scroll">'+g+'</div></section>';
  // charge par ressource : saisi (calendrier) ou prévisionnel (affectations), reste des jours ouvrés en R&D
  const rs=list('ressources').filter(r=>estActif(r)||!ui.planActifs).sort((a,b)=>a.nom.localeCompare(b.nom));
  const load={};
  list('affectations').forEach(a=>{const p=byId('projets',a.projetId);if(!p||p.cloture)return;const d1=a.phase==='mes'?p.mesDebut:p.devDebut,d2=a.phase==='mes'?p.mesFin:p.devFin;const ms=monthsBetween(d1,d2);if(!ms.length)return;
    const tot=workdays(d1,d2)||1;ms.forEach(m=>{const a1=m+'-01'>d1?m+'-01':d1;const last=m+'-'+String(new Date(+m.slice(0,4),+m.slice(5),0).getDate()).padStart(2,'0');const b1=last<d2?last:d2;const share=workdays(a1,b1)/tot*num(a.joursPrevus);
      const k=a.ressourceId+'|'+m;load[k]=load[k]||{j:0,projets:{}};load[k].j+=share;load[k].projets[p.id]=(load[k].projets[p.id]||0)+share})});
  const CAT=[['trav','Travaillé','#435B7B','#fff'],['depl','Déplacement','#1F6F78','#fff'],['conge','Congés','#2E6B4F','#fff'],['rd','R&D','#C08A1E','#1B1C1C']];
  const arr=v=>Math.round(v*2)/2;
  function charge(r,m){if(r.dateFin&&r.dateFin<m+'-01')return null;const ouv=joursOuvres(m).n;
    const cs=list('calendrier').filter(c=>c.ressourceId===r.id&&c.mois===m&&c.jours&&Object.keys(c.jours).length);
    if(cs.length){const o={src:'saisi',trav:0,depl:0,conge:0,rd:0,ouv,projets:{}};cs.forEach(c=>{valsJ(c.jours).forEach(v=>{const x=pj(v);if(!x)return;const k=x.t==='dev'||x.t==='devfr'||x.t==='mes'||x.t==='pil'||x.t==='pmo'||x.t==='hyp'||x.t==='form'||x.t==='formh'?'trav':x.t;if(o[k]!=null)o[k]+=x.q;if(k==='trav')o.projets[c.projetId]=(o.projets[c.projetId]||0)+x.q})});return o}
    const l=load[r.id+'|'+m];const trav=l?arr(l.j):0;return {src:'prevu',trav,depl:0,conge:0,rd:Math.max(0,ouv-trav),ouv,projets:l?l.projets:{}}}
  function cellule(o){if(!o)return '<td class="n muted" title="Hors effectif">—</td>';const tot=CAT.reduce((x,c)=>x+o[c[0]],0);const base=Math.max(o.ouv,tot)||1;
    const tip=(o.src==='saisi'?'Saisi au calendrier':'Prévisionnel (affectations)')+' · '+o.ouv+' j ouvrés\n'+CAT.filter(c=>o[c[0]]).map(c=>c[1]+' : '+nf(o[c[0]])+' j').join('\n')+(Object.keys(o.projets).length?'\nProjets : '+Object.entries(o.projets).map(([id,j])=>{const p=byId('projets',id);return (p?p.client:'?')+' ('+nf(arr(j))+' j)'}).join(', '):'');
    return '<td class="chg'+(o.src==='prevu'?' prevu':'')+(o.trav>o.ouv?' sur':'')+'" title="'+esc(tip)+'"><div class="chg-bar">'+CAT.map(c=>o[c[0]]?'<i style="width:'+(100*o[c[0]]/base)+'%;background:'+c[2]+'"></i>':'').join('')+'</div><div class="chg-n">'+CAT.filter(c=>o[c[0]]).map(c=>'<span style="color:'+(c[0]==='rd'?'#8A5A00':c[2])+'">'+nf(o[c[0]])+' '+c[1].charAt(0)+'</span>').join(' ')+'</div></td>'}
  const tots={};
  let t='<table class="tbl chg-t"><thead><tr><th>Ressource</th>'+months.map(m=>'<th class="n">'+moisCourt(m)+'<div class="small muted" style="font-weight:400;text-transform:none;letter-spacing:0">'+joursOuvres(m).n+' j ouvrés</div></th>').join('')+'<th class="n">Total 12 mois</th></tr></thead><tbody>'+
    rs.map(r=>{const T={trav:0,depl:0,conge:0,rd:0};const cells=months.map(m=>{const o=charge(r,m);if(o){CAT.forEach(c=>{T[c[0]]+=o[c[0]];tots[m]=tots[m]||{trav:0,depl:0,conge:0,rd:0};tots[m][c[0]]+=o[c[0]]})}return cellule(o)}).join('');
      return '<tr><td style="font-weight:600;white-space:nowrap">'+(r.code?'<span class="pill" style="margin-right:6px">'+esc(r.code)+'</span>':'')+esc(r.nom)+'</td>'+cells+'<td class="n small" style="white-space:nowrap">'+CAT.filter(c=>T[c[0]]).map(c=>'<div><b style="color:'+(c[0]==='rd'?'#8A5A00':c[2])+'">'+nf(T[c[0]])+'</b> '+c[1].toLowerCase()+'</div>').join('')+'</td></tr>'}).join('')+
    '</tbody><tfoot><tr><td>Équipe</td>'+months.map(m=>{const o=tots[m];return '<td class="n small" style="white-space:nowrap">'+(o?CAT.filter(c=>o[c[0]]).map(c=>'<div>'+nf(o[c[0]])+' '+c[1].charAt(0)+'</div>').join(''):'—')+'</td>'}).join('')+'<td></td></tr></tfoot></table>';
  h+='<section class="card"><div class="card-h"><h2>Charge par ressource (jours)</h2><label class="row small" style="font-weight:600"><input type="checkbox" data-act="planActifs"'+(ui.planActifs?' checked':'')+'> Actifs seulement</label></div>'+
    '<div class="row small">'+CAT.map(c=>'<span class="row" style="gap:6px"><i style="display:inline-block;width:14px;height:10px;border-radius:3px;background:'+c[2]+'"></i>'+c[1]+' ('+c[1].charAt(0)+')</span>').join('')+'<span class="row" style="gap:6px"><i style="display:inline-block;width:14px;height:10px;border-radius:3px;border:1.5px dashed var(--line2)"></i>Prévisionnel</span><span class="muted">· Mois saisis : calendrier de la saisie mensuelle. Mois à venir : affectations réparties sur les dates des phases ; jours ouvrés restants en R&D (mois sans affectation = R&D). Survolez une case pour le détail.</span></div>'+
    (rs.length?'<div class="scroll">'+t+'</div>':'<div class="empty">Aucune ressource.</div>')+'</section>';
  h+=vActiviteMois();
  return h;
}
/* activité du mois : jour par jour, par collaborateur, d'après la saisie mensuelle (tous projets confondus) */
function vActiviteMois(){const m=/^\d{4}-\d{2}$/.test(ui.actMois||'')?ui.actMois:curMonth();const J=joursMois(m);const jo=joursOuvres(m).n;
  const cals=list('calendrier').filter(c=>c.mois===m&&c.jours&&Object.keys(c.jours).length&&(!ui.actCollab||c.ressourceId===ui.actCollab));
  const projIds=[...new Set(cals.filter(c=>valsJ(c.jours).some(v=>{const x=pj(v);return x&&!TYPES_J[x.t].nonTravaille})).map(c=>c.projetId))].filter(id=>byId('projets',id)).sort((a,b)=>libProjet(byId('projets',a)).localeCompare(libProjet(byId('projets',b)))||String(byId('projets',a).site||'').localeCompare(String(byId('projets',b).site||'')));
  const num_=id=>projIds.indexOf(id)+1;const libP=id=>{const p=byId('projets',id)||{};return libProjet(p)+(p.site?' — '+p.site:'')};
  const rids=[...new Set(cals.map(c=>c.ressourceId))].concat(ui.actTous?list('ressources').filter(estActif).map(r=>r.id):[]);
  const rs=[...new Set(ui.actCollab?[ui.actCollab]:rids)].map(id=>byId('ressources',id)).filter(Boolean).sort((a,b)=>a.nom.localeCompare(b.nom));
  let h='<section class="card"><div class="card-h"><h2>Activité du mois par collaborateur</h2><div class="row"><button class="btn o sm" data-act="actPrev" aria-label="Mois précédent">←</button><input type="month" data-ui="actMois" value="'+m+'" aria-label="Mois" style="width:auto"><button class="btn o sm" data-act="actNext" aria-label="Mois suivant">→</button>'+
    '<select data-ui="actCollab" aria-label="Collaborateur" style="width:auto"><option value="">Tous les collaborateurs</option>'+list('ressources').filter(r=>estActif(r)||list('calendrier').some(c=>c.ressourceId===r.id&&c.mois===m)).sort((a,b)=>a.nom.localeCompare(b.nom)).map(r=>'<option value="'+r.id+'"'+(ui.actCollab===r.id?' selected':'')+'>'+esc(r.nom)+'</option>').join('')+'</select>'+
    '<label class="row small" style="font-weight:600"><input type="checkbox" data-act="actTous"'+(ui.actTous?' checked':'')+'> Tous les actifs</label></div></div>'+
    '<p class="small muted" style="margin:0">D\'après la saisie mensuelle. Une ligne par projet ; couleur et lettre = type de journée. '+jo+' jours ouvrés.</p>';
  if(!rs.length)return h+'<div class="empty">Rien de saisi pour '+moisLabel(m)+'.</div></section>';
  // une ligne par projet pour chaque collaborateur
  const th='<th style="position:sticky;left:0;background:var(--card,#fff);z-index:1">Collaborateur</th><th style="min-width:150px">Projet</th>'+J.map(j=>'<th class="jc" style="'+(j.we||j.ferie?'color:var(--muted);':'')+'" title="'+esc(j.ferie||'')+'">'+'LMMJVSD'[(j.w+6)%7]+'<br>'+j.d+'</th>').join('')+'<th class="n">Jours</th>';
  const vide=j=>'<td class="jc"><div class="cb'+(j.we?' we':'')+(j.ferie?' fe':'')+'" style="width:24px;height:26px;cursor:default;opacity:.55"></div></td>';
  let corps='';
  rs.forEach(r=>{const cs=cals.filter(c=>c.ressourceId===r.id).sort((a,b)=>libP(a.projetId).localeCompare(libP(b.projetId)));const n=Math.max(1,cs.length);
    const nomC='<td rowspan="'+n+'" style="font-weight:600;white-space:nowrap;position:sticky;left:0;background:var(--card,#fff);z-index:1;vertical-align:top;border-top:2px solid var(--line2)">'+(r.code?'<span class="pill" style="margin-right:6px">'+esc(r.code)+'</span>':'')+esc(r.nom)+'</td>';
    if(!cs.length){corps+='<tr>'+nomC+'<td class="small muted" style="border-top:2px solid var(--line2)">Rien de saisi</td>'+J.map(vide).join('')+'<td class="n muted" style="border-top:2px solid var(--line2)">0</td></tr>';return}
    cs.forEach((c,i)=>{const bt=i===0?'border-top:2px solid var(--line2);':'';let tot=0;
      corps+='<tr>'+(i===0?nomC:'')+'<td class="small" style="'+bt+'white-space:nowrap"><a href="#projet-'+c.projetId+'" style="color:var(--navy);font-weight:600">'+esc(libP(c.projetId))+'</a></td>'+
        J.map(j=>{const vj=c.jours[j.iso];const x=pj(vj);if(!x)return vide(j).replace('<td class="jc">','<td class="jc" style="'+bt+'">');pjs(vj).forEach(y=>tot+=y.q);const T=TYPES_J[x.t]||{};if(estDouble(vj))return '<td class="jc" style="'+bt+'"><div class="cb'+(j.we?' we':'')+'" style="width:24px;height:26px;cursor:default;display:flex;align-items:center;justify-content:center;'+styleJour(vj)+'" title="'+esc(dateFr(j.iso)+' · '+pjs(vj).map(y=>TYPES_J[y.t].nom).join(' + ')+' (demi-journées)')+'">'+esc(libJour(vj))+'</div></td>';
          return '<td class="jc" style="'+bt+'"><div class="cb'+(j.we?' we':'')+(j.ferie?' fe':'')+' t-'+x.t+(x.demi?' demi':'')+'" style="width:24px;height:26px;cursor:default;display:flex;align-items:center;justify-content:center;font-size:10px" title="'+esc(dateFr(j.iso)+' · '+(T.nom||'')+(x.demi?' (demi-journée)':''))+'">'+esc(T.c||'')+'</div></td>'}).join('')+
        '<td class="n" style="'+bt+'font-weight:700">'+nf(tot)+'</td></tr>'})});
  h+='<div class="scroll"><table class="tbl" style="table-layout:auto"><thead><tr>'+th+'</tr></thead><tbody>'+corps+'</tbody></table></div>';

  // récapitulatif par collaborateur
  const cols=[...projIds.map(id=>['p:'+id,libP(id)]),['depl','Déplacement'],['rd','R&D'],['conge','Congés']];
  const recap=rs.map(r=>{const o={};let trav=0;cals.filter(c=>c.ressourceId===r.id).forEach(c=>valsJ(c.jours).forEach(v=>{const x=pj(v);if(!x)return;const T=TYPES_J[x.t]||{};const k=T.nonTravaille?x.t:'p:'+c.projetId;o[k]=(o[k]||0)+x.q;if(!T.nonTravaille)trav+=x.q}));const tot=Object.values(o).reduce((a,b)=>a+b,0);return {r,o,trav,tot}});
  h+='<h3 style="margin:6px 0 0">Récapitulatif de '+moisLabel(m)+' (jours)</h3><div class="scroll"><table class="tbl"><thead><tr><th>Collaborateur</th>'+cols.map(c=>'<th class="n" style="max-width:140px;white-space:normal">'+esc(c[1])+'</th>').join('')+'<th class="n">Travaillé</th><th class="n">Total saisi</th><th class="n">Non saisi</th></tr></thead><tbody>'+
    recap.map(({r,o,trav,tot})=>'<tr><td style="font-weight:600;white-space:nowrap">'+esc(r.nom)+'</td>'+cols.map(c=>'<td class="n">'+(o[c[0]]?nf(o[c[0]]):'<span class="muted">·</span>')+'</td>').join('')+'<td class="n" style="font-weight:700">'+nf(trav)+'</td><td class="n">'+nf(tot)+'</td><td class="n"'+(jo-tot>0?' style="color:var(--bad);font-weight:700"':'')+'>'+(jo-tot>0?nf(jo-tot):'—')+'</td></tr>').join('')+
    '</tbody></table></div><p class="small muted" style="margin:0">« Non saisi » = jours ouvrés du mois sans aucune saisie (un week-end ou un jour férié saisi compte aussi dans le total).</p></section>';
  return h}

/* jours effectifs du mois : lundi-vendredi hors jours fériés français (modifiable par mois) */
function paques(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),j=((h+l-7*m+114)%31)+1;return new Date(Date.UTC(y,mo-1,j))}
function feriesFR(y){const P=paques(y),add=(d,n)=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
  return [[y+'-01-01','Jour de l\'an'],[add(P,1),'Lundi de Pâques'],[y+'-05-01','Fête du Travail'],[y+'-05-08','Victoire 1945'],[add(P,39),'Ascension'],[add(P,50),'Lundi de Pentecôte'],[y+'-07-14','Fête nationale'],[y+'-08-15','Assomption'],[y+'-11-01','Toussaint'],[y+'-11-11','Armistice'],[y+'-12-25','Noël']]}
function joursOuvres(m){const [y,mo]=m.split('-').map(Number);const fer=feriesFR(y).filter(f=>f[0].slice(0,7)===m);const fs=new Set(fer.map(f=>f[0]));let n=0;const dim=new Date(y,mo,0).getDate();
  for(let d=1;d<=dim;d++){const iso=m+'-'+String(d).padStart(2,'0');const w=new Date(Date.UTC(y,mo-1,d)).getUTCDay();if(w&&w<6&&!fs.has(iso))n++}
  return {n,feries:fer.filter(f=>{const w=new Date(f[0]+'T12:00:00Z').getUTCDay();return w&&w<6})}}
function joursEffectifs(m){const c=S.moisCfg[m];return c&&c.joursEffectifs!=null&&c.joursEffectifs!==''?num(c.joursEffectifs):joursOuvres(m).n}
function phaseDefaut(pid,rid){const ph=list('affectations').filter(a=>a.projetId===pid&&a.ressourceId===rid).map(a=>a.phase);
  if(ph.includes('mes')&&!ph.includes('dev'))return 'mes';if(ph.includes('dev')&&!ph.includes('mes'))return 'dev';
  const p=byId('projets',pid);return p&&['mes','retard'].includes(phaseOf(p))?'mes':'dev'}
async function setJours(pid,rid,m,ph,v){const id=[pid,rid,m,ph].join('_');const cur=byId('temps',id);
  if(!v){if(cur)await del('temps',id);return}
  if(!cur||num(cur.jours)!==v)await save('temps',id,{projetId:pid,ressourceId:rid,mois:m,phase:ph,jours:v})}
async function moisComplet(pid,rid,m,coche){const je=joursEffectifs(m);
  if(coche){const ph=phaseDefaut(pid,rid),autre=ph==='dev'?'mes':'dev';await setJours(pid,rid,m,autre,0);await setJours(pid,rid,m,ph,je)}
  else{await setJours(pid,rid,m,'dev',0);await setJours(pid,rid,m,'mes',0)}}

/* ---------- calendrier jour par jour ---------- */
const TYPES_J={dev:{c:'DT',nom:'Développement TN',court:'Dév. TN'},devfr:{c:'DF',nom:'Développement FR',court:'Dév. FR'},mes:{c:'M',nom:'Mise en service',court:'MES'},pil:{c:'P',nom:'Pilotage',court:'Pilot.',techLead:true},pmo:{c:'PM',nom:'PMO',court:'PMO'},hyp:{c:'H',nom:'Hypercare',court:'Hyper.'},form:{c:'FM',nom:'Formation Mecalux',court:'Form. M'},formh:{c:'FH',nom:'Formation Harington',court:'Form. H'},depl:{c:'DP',nom:'Déplacement',court:'Dépl.',nonTravaille:true},rd:{c:'R',nom:'R&D',court:'R&D',nonTravaille:true,sansBareme:true},conge:{c:'C',nom:'Congés',court:'Congés',nonTravaille:true,sansBareme:true}};

const COUL_B=[['#F3E6EC','#5f3d4d','#C187A1'],['#FBF0D9','#6B4700','#D9B25E'],['#DCE5F2','#21324E','#8FA3C0'],['#E3F1EA','#2E6B4F','#8CC3A6'],['#EEE7F7','#4B2E7A','#B9A2DD'],['#E6F3F4','#1F5F66','#8DC4C9'],['#F7E9E1','#7A3E1D','#D9A88A']];
let BAREMES_J={},ORDRE_B=[];
function majBaremes(){const L=(S.regles.profils||DEFAULT_REGLES.profils);BAREMES_J={};ORDRE_B=[];L.forEach((z,i)=>{BAREMES_J[z.id]={nom:z.nom||'Barème '+(i+1),code:(z.code||'B'+(i+1)).slice(0,4),i};ORDRE_B.push(z.id)})}

function montantBareme(id){const P=(S.regles.profils||[]).find(z=>z.id===id);if(!P)return {v:0,reel:false,loc:0};const pd=num(P.perDiem);let v=0,reel=false;

  v+=pd||num(P.dejeuner)+num(P.diner);const loc=P.location==='forfait'?num(P.locationJour):0;v+=loc;

const JS_COURT=['D','L','M','M','J','V','S'];
function calId(pid,rid,m){return [pid,rid,m].join('_')}

function joursMois(m){const [y,mo]=m.split('-').map(Number);const fer={};feriesFR(y).forEach(f=>fer[f[0]]=f[1]);const dim=new Date(y,mo,0).getDate();const out=[];
  for(let d=1;d<=dim;d++){const iso=m+'-'+String(d).padStart(2,'0');const w=new Date(Date.UTC(y,mo-1,d)).getUTCDay();out.push({iso,d,w,we:w===0||w===6,ferie:fer[iso]||''})}return out}
/* valeur d'un jour : 'dev' = journée, 'dev/2' = demi-journée */
function pj(v){if(!v)return null;const [t,f]=String(v).split('+')[0].split('/');return {t,q:f==='2'?0.5:1,demi:f==='2'}}
// une journée peut combiner deux demi-journées de types différents : « mes/2+depl/2 »
const pjs=v=>v?String(v).split('+').filter(Boolean).map(x=>pj(x)).filter(Boolean):[];
const valsJ=o=>Object.values(o||{}).flatMap(v=>String(v||'').split('+').filter(Boolean));
const entJ=o=>Object.entries(o||{}).flatMap(([d,v])=>String(v||'').split('+').filter(Boolean).map(x=>[d,x]));
const COUL_T={dev:'#435B7B',devfr:'#2F7FB5',mes:'#C187A1',pil:'#5B3F8C',pmo:'#1F5F66',hyp:'#B5651D',form:'#3E7D3A',formh:'#7A8F2A',depl:'#1F6F78',rd:'#8A5A00',conge:'#2E6B4F'};
const estDouble=v=>String(v||'').includes('+');
function styleJour(v){const L=pjs(v);if(L.length<2)return '';return 'background:linear-gradient(90deg,'+(COUL_T[L[0].t]||'#999')+' 50%,'+(COUL_T[L[1].t]||'#999')+' 50%);color:#fff;border-color:transparent;font-size:9px'}
const libJour=v=>{const L=pjs(v);if(L.length>1)return L.map(x=>(TYPES_J[x.t]||{}).c||'').join('·');const x=L[0];return x&&TYPES_J[x.t]?TYPES_J[x.t].c+(x.demi?'½':''):''};
function resumeJours(jours,m){const info={};joursMois(m).forEach(j=>info[j.iso]=j);const r={};Object.keys(TYPES_J).forEach(t=>r[t]={ouvre:0,we:0,ferie:0,total:0});
  entJ(jours||{}).forEach(([iso,v])=>{const j=info[iso],x=pj(v);if(!j||!x||!r[x.t])return;r[x.t][j.ferie?'ferie':j.we?'we':'ouvre']+=x.q;r[x.t].total+=x.q});return r}
/* jours non travaillés (pas de TJM) : déplacement, R&D, congés ; barème possible le jour de déplacement, jamais en R&D ni en congés */
// barème de frais : jours de mise en service, de déplacement, de développement FR ou de formation (Mecalux ou Harington)
const TYPES_BAREME=['mes','depl','devfr','form','formh']; // le développement FR peut porter un barème, pas le développement TN
function baremeCompte(iso,jours){return pjs((jours||{})[iso]).some(x=>TYPES_BAREME.includes(x.t))}
function resumeBaremes(baremes,jours){const n={};let tot=0,reel=0;Object.entries(baremes||{}).forEach(([iso,b])=>{if(!BAREMES_J[b]||!baremeCompte(iso,jours))return;n[b]=(n[b]||0)+1;const x=montantBareme(b);tot+=x.v;if(x.reel)reel++});return {n,montant:tot,nuitsReel:reel}}
let paint=null;
function draftOf(pid,rid,m,kind){const D=kind==='b'?(ui.draftB=ui.draftB||{}):(ui.draft=ui.draft||{});const k=calId(pid,rid,m);if(!D[k])D[k]=Object.assign({},((calOf(pid,rid,m)||{})[kind==='b'?'baremes':'jours'])||{});return D[k]}
/* jours travaillés d'un collaborateur sur un projet et un mois (calendrier, hors congés et R&D, demi-journées comprises) */
// Hôtel au réel et location de voiture : les jours tagués Déplacement (semaine comme week-end) comptent aussi
function joursDeplWeekend(pid,rid,m){const c=calOf(pid,rid,m);if(!c||!c.jours)return 0;return valsJ(c.jours).reduce((x,v)=>{const j=pj(v);return x+(j&&j.t==='depl'?j.q:0)},0)}
const CAT_AVEC_DEPL=['Hôtel (au réel)','Location voiture']; // les jours de déplacement s'ajoutent aux jours travaillés
// Location de voiture : facturée à la journée entière (une demi-journée travaillée ou de déplacement compte pour un jour)
// jours de pilotage exclus de l'hôtel et de la location de voiture
const SANS_HEBERGEMENT=['pil'];
const SANS_HOTEL=['pil','dev','devfr']; // hôtel au réel : ni pilotage ni développement (cochable au besoin)
function joursLocationCal(pid,rid,m){const c=calOf(pid,rid,m);if(!c||!c.jours)return 0;return valsJ(c.jours).reduce((x,v)=>{const j=pj(v);return x+(j&&TYPES_J[j.t]&&!SANS_HEBERGEMENT.includes(j.t)&&(!TYPES_J[j.t].nonTravaille||j.t==='depl')&&j.q>0?1:0)},0)}
function joursTravHorsPil(pid,rid,m,exclus){exclus=exclus||SANS_HEBERGEMENT;const c=calOf(pid,rid,m);if(!c||!c.jours)return 0;return valsJ(c.jours).reduce((x,v)=>{const j=pj(v);return x+(j&&TYPES_J[j.t]&&!TYPES_J[j.t].nonTravaille&&!exclus.includes(j.t)?j.q:0)},0)}
// frais par jour : décompte du calendrier par type de journée ; on choisit les types à retenir (par défaut selon la catégorie)
function typesJoursDefaut(cat){if(cat==='Hôtel (au réel)')return ['mes','pmo','hyp','form','formh','depl'];if(cat==='Location voiture')return ['dev','devfr','mes','pmo','hyp','form','formh','depl'];return Object.keys(TYPES_J).filter(k=>!TYPES_J[k].nonTravaille)}
function decompteCal(pid,rid,m,cat){const c=calOf(pid,rid,m);const o={};if(!c||!c.jours)return o;const entier=cat==='Location voiture';valsJ(c.jours).forEach(v=>{const j=pj(v);if(!j||!TYPES_J[j.t]||!(j.q>0))return;o[j.t]=(o[j.t]||0)+(entier?1:j.q)});return o}
function joursFraisCal(pid,rid,m,cat,types){const D=decompteCal(pid,rid,m,cat);const T=Array.isArray(types)&&types.length?types:typesJoursDefaut(cat);return T.reduce((x,t)=>x+(D[t]||0),0)}
function joursTravCal(pid,rid,m){const c=calOf(pid,rid,m);if(!c||!c.jours)return 0;return valsJ(c.jours).reduce((x,v)=>{const j=pj(v);return x+(j&&TYPES_J[j.t]&&!TYPES_J[j.t].nonTravaille?j.q:0)},0)}
async function majFraisParJour(pid,rid,m){for(const f of list('frais').filter(x=>x.parJour&&x.joursAuto!==false&&x.projetId===pid&&x.ressourceId===rid&&x.mois===m)){const n=joursFraisCal(pid,rid,m,f.categorie,f.typesJours);const mt=Math.round(num(f.prixJour)*n*100)/100;if(num(f.montant)!==mt||num(f.jours)!==n)await save('frais',f.id,Object.assign({},f,{montant:mt,jours:n}))}}

  for(let n=1;n<=doc.numPages;n++){const page=await doc.getPage(n);const tc=await page.getTextContent();
    const it=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5]}));
    const L=[];it.sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const l=L.find(l=>Math.abs(l.y-i.y)<2.2);if(l)l.it.push(i);else L.push({y:i.y,it:[i]})});
    L.forEach(l=>{l.it.sort((a,b)=>a.x-b.x);l.txt=l.it.map(i=>i.s).join(' ')});
    const tout=L.map(l=>l.txt).join('\n');const m=tout.match(/(Pré-Facture|Facture|Avoir)\s+N°\s*:\s*(\S+)/);if(!m)continue;
    const d=tout.match(/(\d{2}\/\d{2}\/\d{4})\s+(\S+)\s+\d+\/\d+/);const ctr=tout.match(/Numéro de contrat\s*:\s*(\S+)/);
    const iH=L.findIndex(l=>/^Code\b/.test(l.txt)&&/Description/.test(l.txt));const iB=L.findIndex(l=>/BASES HT/.test(l.txt));const lignes=[];
    if(iH>=0){const xDesc=(L[iH].it.find(i=>/^Description/.test(i.s))||{x:150}).x;let cur=null;
      for(const l of L.slice(iH+1,iB>iH?iB:undefined)){const nums=l.it.filter(i=>/^-?[\d\s  ]+,\d{2,3}$/.test(i.s));const code=l.it.find(i=>i.x<xDesc-8);
        if(nums.length>=3&&code){const v=nums.slice(-3);cur={code:code.s,desc:l.it.filter(i=>i!==code&&!v.includes(i)).map(i=>i.s).join(' '),qte:nombre(v[0].s),pu:nombre(v[1].s),montant:nombre(v[2].s),init:''};lignes.push(cur)}
        else if(cur){const t=l.txt.trim();if(/^[A-Z]{2,4}$/.test(t))cur.init=t;else cur.desc+=' '+t}}}
    pages.push({fichier,page:n,type:m[1],num:m[2],date:d?d[1]:'',contrat:ctr?ctr[1]:'',lignes})}
  return pages}

async function afCharger(){ui.af={charge:true,pleo:[],fact:[],parNum:{},parContrat:{},f:{du:'2026-01',au:'2026-09',collab:'',cat:'',type:'',tri:'net'}};
  const tout=async t=>{let out=[];for(let i=0;;i+=1000){const {data,error}=await sb.from(t).select('*').range(i,i+999);if(error){handleErr(error);break}out=out.concat(data||[]);if(!data||data.length<1000)break}return out};
  const [p,f]=await Promise.all([tout('mecalux_analyse_pleo'),tout('mecalux_analyse_factures')]);
  ui.af.pleo=p.map(x=>Object.assign(x,{montant:num(x.montant),net:num(x.net)}));ui.af.fact=f.map(x=>Object.assign(x,{montant:num(x.montant)}));
  ui.af.fact.forEach(x=>{(ui.af.parNum[x.num]=ui.af.parNum[x.num]||[]).push(x);if(x.contrat)(ui.af.parContrat[x.contrat]=ui.af.parContrat[x.contrat]||[]).push(x)});ui.af.pret=true;render()}
function afDonnees(){const A=ui.af,F=A.f;const dans=m=>m&&m>=F.du&&m<=F.au;

  const fr=A.fact.filter(x=>x.est_frais&&dans(x.mois)).map(x=>Object.assign(x,{collab:afCollabFacture(x)})).filter(x=>!afExclu(x.collab));
  const fact=fr.filter(x=>x.type!=='Pré-Facture'),pre=fr.filter(x=>x.type==='Pré-Facture');

const AF_TYPES_L=AF_TYPES.map(t=>t[1]);
const afType=cat=>{const t=AF_TYPES.find(x=>x[0]===cat);return t?t[1]:'Autres'};
const AF_NATURES={reel:'Frais réels refacturés',carbpeage:'Carburant et péage',forfait:'Forfait (barème, per diem)'};
// période couverte par une ligne de frais : « du 23/04 au 22/05 », « du 17 mai au 12 juin 2026 », « juin 2026 », « février-26 »
function afPeriode(desc,dateIso){const d=String(desc||'').toLowerCase().normalize('NFC');const ref=String(dateIso||'');const an=+ref.slice(0,4)||new Date().getFullYear();
  const iso=(a,m,j)=>a+'-'+String(m).padStart(2,'0')+'-'+String(j).padStart(2,'0');const MR=Object.keys(AF_MOIS).join('|');let r=null,expl=false;
  let m=d.match(/(\d{1,2})\/(\d{2})(?:\/(\d{4}))?\s+au\s+(\d{1,2})\/(\d{2})(?:\/(\d{4}))?/);
  if(m){expl=!!(m[3]||m[6]);const a2=+(m[6]||m[3]||an);let a1=+(m[3]||a2);if(!m[3]&&+m[2]>+m[5])a1=a2-1;r=[iso(a1,+m[2],+m[1]),iso(a2,+m[5],+m[4])]}
  if(!r){m=d.match(new RegExp('(\\d{1,2})(?:\\s+('+MR+'))?\\s+au\\s+(\\d{1,2})\\s+('+MR+')(?:\\s+(\\d{4}))?'));
    if(m){expl=!!m[5];const a2=+(m[5]||an),m2=AF_MOIS[m[4]],m1=m[2]?AF_MOIS[m[2]]:m2;r=[iso(m1>m2?a2-1:a2,m1,+m[1]),iso(a2,m2,+m[3])]}}
  if(!r){m=d.match(new RegExp('('+MR+')[\\s-]*(\\d{4}|\\d{2})\\b'));if(m){expl=true;let a=+m[2];if(a<100)a+=2000;const mm=AF_MOIS[m[1]];r=[iso(a,mm,1),iso(a,mm,new Date(a,mm,0).getDate())]}}
  if(r&&!expl&&ref&&r[0]>ref)r=r.map(x=>(+x.slice(0,4)-1)+x.slice(4));return r}
function afNature(x){const d=String(x.description||'').toLowerCase();if(x.code==='FRAIS'||/perdiem|prediem|per diem|compl[ée]ment/.test(d))return 'forfait';if(/carburant|p[ée]age/.test(d))return 'carbpeage';if(/frais (de |du )?(d[ée]placement|mission)|\bdu .+ au /.test(d))return 'reel';return 'forfait'}
function afRappro(){const A=ui.af,F=A.f;const {P}=afDonnees();

  const couvre=(b,e)=>b.per&&b.collab&&b.collab===e.collab&&String(e.date)>=b.per[0]&&String(e.date)<=b.per[1]&&(b.nature==='reel'||e.categorie==='Carburant'||e.categorie==='Péage');

  return '\ufeff'+[['Client','Projet','Période','BDC','Trigramme','Collaborateur','Rubrique','Désignation','Quantité','Unité','PU HT','Montant HT'].map(q).join(';')].concat(L.map(l=>[p.client,p.nom,m,pf&&pf.bdc||'',l.collab?l.collab.code:'',l.collab?l.collab.nom:'',lib(l.type),l.libelle,n(l.qte),l.unite,n(l.pu),n(l.montant)].map((v,k)=>k>=8&&k!==9?v:q(v)).join(';'))).concat(RUBRIQUES.map(([t,lb])=>['','','','','','','','Total '+lb.toLowerCase(),'','','',n(totRub(L,t))].map((v,k)=>k===11?v:q(v)).join(';')),[['','','','','','','','Total HT','','','',n(tot)].map((v,k)=>k===11?v:q(v)).join(';')]).join('\r\n')}
function visionneuse(sousTitre,docs,apres){
  const montrer=i=>{const d=docs[i];const img=/\.(jpe?g|png|webp|gif)$/i.test(d.nom);
    document.getElementById('visuZone').innerHTML=img?'<img class="visu" src="'+esc(d.url)+'" alt="'+esc(d.nom)+'">':'<iframe class="visu" src="'+esc(d.url)+'" title="'+esc(d.nom)+'"></iframe>';
    document.getElementById('visuOnglet').href=d.url;document.querySelectorAll('[data-visu]').forEach(x=>x.classList.toggle('p',+x.dataset.visu===i))};
  dlg.classList.add('large');dlg.addEventListener('close',()=>{dlg.classList.remove('large');if(apres)apres()},{once:true});
  document.getElementById('dlgBody').innerHTML='<div class="row" style="align-items:baseline"><h2 style="margin:0">Justificatif'+(docs.length>1?'s':'')+'</h2><span class="small muted">'+sousTitre+'</span></div>'+
    (docs.length>1?'<div class="row" style="gap:6px;flex-wrap:wrap">'+docs.map((d,i)=>'<button type="button" class="btn o sm" data-visu="'+i+'">'+esc(d.nom)+'</button>').join('')+'</div>':'')+
    '<div id="visuZone"></div><div class="row"><a id="visuOnglet" class="btn o" target="_blank" rel="noopener">Ouvrir dans un onglet</a><span class="sp"></span><button class="btn p" data-dlg="close">Fermer</button></div>';
  document.getElementById('dlgBody').querySelectorAll('[data-visu]').forEach(x=>x.addEventListener('click',()=>montrer(+x.dataset.visu)));
  montrer(0);dlg.showModal()}
function pfHtml(key){const {p,m,pf,L,tot}=pfData(key);return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Préfacture '+esc(p.client)+' '+m+'</title><style>body{font-family:Arial,sans-serif;color:#1B1C1C;max-width:800px;margin:40px auto;padding:0 20px}h1{color:#21324E;font-size:22px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}td.n,th.n{text-align:right}tfoot td{font-weight:bold;border-top:2px solid #21324E}.m{color:#4A5468;font-size:13px}</style></head><body><p class="m">PRÉFACTURE · POUR VALIDATION</p><h1>'+esc(p.client)+' · '+esc(p.nom)+'</h1><p class="m">'+esc(p.site||'')+(p.refMecalux?' · Réf. Mecalux '+esc(p.refMecalux):'')+'<br>Période : '+moisLabel(m)+(pf&&pf.bdc?'<br>Bon de commande : '+esc(pf.bdc):'')+'<br>Statut : '+esc(pf&&pf.statut||'À préparer')+'</p><table><thead><tr><th>Désignation</th><th class="n">Qté</th><th class="n">PU HT</th><th class="n">Montant HT</th></tr></thead><tbody>'+pfGroupes(L).map(g=>(g.collab?'<tr><td colspan="4" style="background:#21324E;color:#fff;font-weight:bold">'+esc(g.collab.nom)+(g.collab.code?' ('+esc(g.collab.code)+')':'')+'</td></tr>':'')+RUBRIQUES.map(([t,lib])=>{const ls=g.lignes.filter(l=>(l.type||'frais')===t);return ls.length?'<tr><td colspan="4" style="color:#000;font-weight:bold;font-size:14px">'+lib+'</td></tr>'+ls.map(l=>'<tr><td style="padding-left:22px">'+esc(l.libelle)+'</td><td class="n">'+nf(l.qte)+' '+esc(l.unite)+'</td><td class="n">'+eur2(l.pu)+'</td><td class="n">'+eur2(l.montant)+'</td></tr>').join(''):''}).join('')+(g.collab?'<tr><td colspan="3" class="n m">Sous-total '+esc(g.collab.nom)+'</td><td class="n"><b>'+eur2(g.total)+'</b></td></tr>':'')).join('')+'</tbody><tfoot>'+RUBRIQUES.map(([t,lib])=>'<tr><td colspan="3" style="font-weight:normal;border-top:0">Total '+lib.toLowerCase()+'</td><td class="n" style="font-weight:normal;border-top:0">'+eur2(totRub(L,t))+'</td></tr>').join('')+'<tr><td colspan="3">Total HT</td><td class="n">'+eur2(tot)+'</td></tr></tfoot></table>'+(pf&&pf.notes?'<p><b>Notes :</b> '+esc(pf.notes)+'</p>':'')+'</body></html>'}
function dl(filename,data){
  const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':'text/html;charset=utf-8';
  const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

        const nid='imp_'+Date.now().toString(36);const ds=G.frais.map(f=>f.date).filter(Boolean).sort();dlg.close();occupe('Création de l\'import…');
        try{const okI=await save('imports',nid,{nom:o.nom,fichier:'',source:'pleo',dateDebut:ds[0]||'',dateFin:ds[ds.length-1]||'',nbLignes:G.frais.length,total:Math.round(G.frais.reduce((t,f)=>t+num(f.montant),0)*100)/100,creeLe:new Date().toISOString()});
          if(okI){let k=0;for(const f of G.frais){occupeMsg('Rattachement des dépenses : '+(++k)+' / '+G.frais.length+'…');await save('frais',f.id,Object.assign({},f,{importId:nid}))}}}finally{libre()}
        toast('Import renommé');return true});break}
    case'impSuppr':{const G=groupesImports().find(x=>x.id===id);if(!G)break;const nom=G.imp?G.imp.nom:'Imports antérieurs (sans nom)';const tot=G.frais.reduce((t,f)=>t+num(f.montant),0);
      confirmBox('Supprimer l\'import « '+nom+' » : '+G.frais.length+' dépense'+(G.frais.length>1?'s':'')+' ('+eur2(tot)+') et leurs justificatifs ? Les préfactures déjà envoyées ne sont pas modifiées. Cette suppression est définitive.',async()=>{
        occupe('Suppression de l\'import…');let k=0;
        try{const ids=new Set(G.frais.map(f=>f.id));const restants=list('frais').filter(f=>!ids.has(f.id));const gardes=new Set(restants.flatMap(f=>f.justifs||[]));
          const aSuppr=[...new Set(G.frais.flatMap(f=>f.justifs||[]))].filter(p=>!gardes.has(p));

          if(G.imp)await del('imports',G.imp.id)}finally{libre()}
        toast('Import « '+nom+' » supprimé ('+k+' dépense'+(k>1?'s':'')+')')});break}
    case'pleoFermer':ui.pleo=null;render();break;
    case'ecarterFrais':{const f=byId('frais',id);if(!f)break;openForm('Écarter la dépense',[{k:'motif',l:'Motif d\'écart',req:true,full:true,ph:'Ex. repas couvert par le per diem, déjà facturé…'}],{motif:f.motif||''},async o=>{const ok=await save('frais',id,Object.assign({},f,{statut:'ecarte',motif:o.motif,refacturable:false}));if(ok)toast('Dépense écartée');return ok});break}
    case'delFrais':{const f=byId('frais',id);if(!f)break;confirmBox('Supprimer définitivement cette dépense ('+(f.marchand||f.categorie||'')+', '+eur2(f.montant)+' le '+dateFr(f.date)+') ?'+(f.source==='pleo'?' Elle réapparaîtra comme nouvelle si vous réimportez le même fichier Pleo.':''),async()=>{await del('frais',id);toast('Dépense supprimée')});break}
    case'delFraisAffiches':{const tbl=document.getElementById('tblFrais');if(!tbl)break;const ids=[...tbl.tBodies[0].rows].filter(r=>!r.hidden).map(r=>r.dataset.id).filter(Boolean);if(!ids.length){toast('Aucune dépense affichée.');break}
      const tot=ids.reduce((x,i)=>x+num((byId('frais',i)||{}).montant),0);
      confirmBox('Supprimer définitivement les '+ids.length+' dépense'+(ids.length>1?'s':'')+' affichée'+(ids.length>1?'s':'')+' ('+eur2(tot)+') ? Les dépenses masquées par les filtres et les frais écartés ne sont pas concernés.',async()=>{occupe('Suppression de '+ids.length+' dépense'+(ids.length>1?'s':'')+'…');try{let k=0;for(const i of ids){occupeMsg('Suppression : '+(++k)+' / '+ids.length+'…');await del('frais',i)}}finally{libre()}toast(ids.length+' dépense'+(ids.length>1?'s':'')+' supprimée'+(ids.length>1?'s':''))});break}
    case'calcDiversAdd':ui.calc.divers=(ui.calc.divers||[]).concat([{lib:'',montant:''}]);render();{const ins=document.querySelectorAll('[data-div$="|lib"]');if(ins.length)ins[ins.length-1].focus()}break;
    case'calcDiversDel':ui.calc.divers=(ui.calc.divers||[]).filter((_,i)=>i!==+b.dataset.i);render();break;
    case'planActifs':ui.planActifs=!ui.planActifs;render();break;
    case'actTous':ui.actTous=!ui.actTous;render();break;
    case'voirJustif':{const f=byId('frais',id);if(!f||!(f.justifs||[]).length)break;
      const docs=[];for(const pth of f.justifs){const {data,error}=await sb.storage.from(BUCKET_J).createSignedUrl(pth,3600);if(!error&&data)docs.push({nom:pth.split('/').pop().replace(/^\d{13}-/,''),url:data.signedUrl})}
      if(!docs.length){toast('Justificatif introuvable.');break}
      visionneuse(esc((byId('ressources',f.ressourceId)||{}).nom||'')+' · '+dateFr(f.date)+' · '+esc(libMarchand(f))+' · '+eur2(f.montant),docs);break}
    case'pleoVoir':{const l=ui.pleo&&ui.pleo.lignes[+b.closest('tr[data-pi]').dataset.pi];if(!l||!(l.fichiers||[]).length)break;
