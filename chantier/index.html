<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A2E">
<title>Chantier · Dépenses</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chantier">
<style>
:root{--vert:#1F3A2E;--vert2:#2F5A46;--sable:#F4EFE6;--fond:#FAF8F4;--carte:#FFFFFF;--encre:#1C2320;--doux:#6B746F;--ligne:#E6E1D7;--acc:#C8792B;--ok:#2E7D4F;--ko:#B3261E;--r:14px}
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fond);color:var(--encre);font-size:16px;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.tete{background:var(--vert);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
.tete h1{margin:0;font-size:18px;font-weight:700}.tete .sous{font-size:13px;opacity:.8;margin-top:2px}
.caisse{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px}
.caisse b{font-size:20px}.caisse span{font-size:13px;opacity:.85}
main{padding:16px;max-width:640px;margin:0 auto}
.vue[hidden]{display:none}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--vert)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sable);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--doux)}
.seg button[aria-pressed=true]{background:#fff;color:var(--vert);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.postes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.postes button{border:1.5px solid var(--ligne);background:#fff;border-radius:12px;padding:12px 8px;min-height:52px;font-weight:600;font-size:14px;line-height:1.2}
.postes button[aria-pressed=true]{border-color:var(--vert);background:var(--vert);color:#fff}
.champ{display:flex;flex-direction:column;gap:6px;margin-top:14px}.champ label{font-weight:600;font-size:14px}
.champ input,.champ select,.champ textarea{border:1.5px solid var(--ligne);border-radius:12px;padding:12px 14px;background:#fff;min-height:50px;width:100%}
.champ input:focus,.champ select:focus{outline:3px solid rgba(47,90,70,.25);border-color:var(--vert2)}
.montant{font-size:26px!important;font-weight:700;text-align:right}
.ligne2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.puces{display:flex;flex-wrap:wrap;gap:8px}.puces button{border:1.5px solid var(--ligne);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.puces button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.imput{font-size:13px;color:var(--doux);margin-top:6px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--vert);color:#fff;font-weight:700;font-size:17px;padding:16px;margin-top:18px}
.btn:disabled{opacity:.6}.btn--clair{background:var(--sable);color:var(--vert)}.btn--petit{display:inline-block;width:auto;padding:10px 14px;font-size:14px;margin:0}
.lien{background:none;border:0;color:var(--vert2);font-weight:600;text-decoration:underline;padding:4px 0}
.msg{margin-top:12px;font-weight:600;min-height:1.2em}.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
.sem{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sem button{border:1.5px solid var(--ligne);background:#fff;border-radius:10px;width:44px;height:44px;font-size:20px}
.sem b{font-size:17px}.sem small{display:block;color:var(--doux);font-size:13px;text-align:center}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.chiffres div{background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:10px}.chiffres span{display:block;font-size:12px;color:var(--doux)}.chiffres b{font-size:16px}
.liste{list-style:none;margin:0;padding:0}.liste li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--ligne);align-items:center}
.liste li:last-child{border-bottom:0}.liste .q{min-width:0}.liste .q b{display:block;font-size:15px}.liste .q span{font-size:13px;color:var(--doux)}
.liste .m{font-weight:700;white-space:nowrap}.liste button.ed{border:0;background:none;padding:0;text-align:left;width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center}
.groupe{font-size:13px;font-weight:700;color:var(--vert2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px;display:flex;justify-content:space-between}
.barre{height:8px;background:var(--sable);border-radius:5px;overflow:hidden;margin-top:6px}.barre i{display:block;height:100%;background:var(--vert2)}
.barre i.trop{background:var(--ko)}
.lot{border-bottom:1px solid var(--ligne);padding:12px 0}.lot:last-child{border-bottom:0}
.lot summary{list-style:none;cursor:pointer}.lot summary::-webkit-details-marker{display:none}
.lot .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px}.lot .s{display:flex;justify-content:space-between;font-size:13px;color:var(--doux);margin-top:3px}
.lot .det{font-size:13px;margin-top:10px;background:var(--fond);border-radius:10px;padding:10px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--sable);color:var(--doux);margin-left:4px;vertical-align:middle}
nav.bas{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ligne);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bas button{border:0;background:none;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--doux);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bas button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bas button[aria-current=page]{color:var(--vert)}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:18px}dialog h3{margin:0 0 4px;color:var(--vert)}
.acces{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.acces .carte{width:100%;max-width:380px}
.reprise li{align-items:center}.reprise input[type=number]{width:96px;border:1.5px solid var(--ligne);border-radius:10px;padding:8px;text-align:right;font-weight:700}
.reprise input[type=checkbox]{width:22px;height:22px}
.vide{color:var(--doux);font-size:14px;text-align:center;padding:16px 0}
.rouge{color:var(--ko)}.vert{color:var(--ok)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.kpi>div{background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:12px}
.kpi span{display:block;font-size:12px;color:var(--doux)}.kpi b{display:block;font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--doux);margin-top:3px}
.kpi .large{grid-column:1/-1}
.graph svg{width:100%;height:auto;display:block}.graph .ax{font-size:10px;fill:var(--doux)}
.graph .bar{fill:var(--vert2)}.graph .bar.cur{fill:var(--acc)}.graph .bar.sel{fill:var(--vert)}
.graph .hit{fill:transparent;cursor:pointer}
.info{font-size:13px;min-height:1.3em;margin-top:6px;color:var(--encre)}
.hb{margin:10px 0}.hb .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}.hb .t span:last-child{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hb .s{font-size:12px;color:var(--doux)}
.tab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}.tab th,.tab td{padding:8px 4px;border-bottom:1px solid var(--ligne);text-align:right}
.tab th:first-child,.tab td:first-child{text-align:left}.tab th{font-size:12px;color:var(--doux);font-weight:600}
.alerte{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ligne);font-size:14px}.alerte:last-child{border-bottom:0}
.alerte i{flex:none;font-style:normal;font-weight:800;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--acc)}
.alerte i.ko{background:var(--ko)}
@media print{nav.bas,.tete .caisse,.no-print{display:none!important}.tete{position:static}body{padding:0;background:#fff}.carte{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var API = 'https://krcsbskmttgmzzqjfudo.supabase.co/functions/v1/chantier';
  var CLE = 'sb_publishable_eOLYfFeFNzf-xzwGtcEP_g_SKCIRkqm';
  var app = document.getElementById('app');
  var POSTE_HAIKEL = 'Haikel (petites dépenses)';
  var S = { code: '', role: '', lots: [], lignes: [], postes: [], depenses: [], versements: [], vue: 'saisir', semaine: null, mode: 'depense', poste: null, payePar: 'Caisse', photo: null };
  try { S.code = localStorage.getItem('chantier-code') || ''; } catch (e) { /* stockage indisponible */ }

  // ---------- utilitaires ----------
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 3 });
  function dt(n) { return nf.format(Math.round((Number(n) || 0) * 1000) / 1000) + ' DT'; }
  function auj() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dIso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function parse(s) { var p = String(s).split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12); }
  function lundi(s) { var d = parse(s); var j = (d.getDay() + 6) % 7; d.setDate(d.getDate() - j); return dIso(d); }
  function numSemaine(s) { var d = parse(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); var a = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - a) / 864e5 - 3 + (a.getDay() + 6) % 7) / 7); }
  function plusJours(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return dIso(d); }
  function court(s) { var d = parse(s); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function lot(id) { return S.lots.find(function (l) { return l.id === id; }); }
  function posteNom(n) { return S.postes.find(function (p) { return p.nom.toLowerCase() === String(n || '').toLowerCase(); }); }
  function somme(t, k) { return t.reduce(function (s, x) { return s + (Number(x[k]) || 0); }, 0); }

  async function api(action, corps) {
    var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-chantier-code': S.code, apikey: CLE, Authorization: 'Bearer ' + CLE }, body: JSON.stringify(Object.assign({ action: action }, corps || {})) });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { var e = new Error(d.erreur || 'Erreur ' + r.status); e.status = r.status; throw e; }
    return d;
  }
  async function charger() {
    var d = await api('etat');
    S.role = d.role; S.lots = d.lots || []; S.lignes = d.lignes || []; S.postes = (d.postes || []).filter(function (p) { return p.actif; });
    S.depenses = (d.depenses || []).map(function (x) { x.montant = Number(x.montant); return x; });
    S.versements = (d.versements || []).map(function (x) { x.montant = Number(x.montant); return x; });
    S.lots.forEach(function (l) { l.marche = Number(l.marche); l.paye_initial = Number(l.paye_initial); });
    if (!S.semaine) S.semaine = lundi(auj());
  }

  // ---------- calculs ----------
  function caisse() {
    var dep = somme(S.depenses.filter(function (x) { return x.paye_par === 'Caisse'; }), 'montant');
    return somme(S.versements, 'montant') - dep;
  }
  function payeLot(l) { return l.paye_initial + somme(S.depenses.filter(function (x) { return x.lot_id === l.id && !x.deja_au_budget; }), 'montant'); }

  // ---------- écran d'accès ----------
  function ecranAcces(msg) {
    app.innerHTML = '<div class="acces"><form class="carte" id="f-acces"><h2 style="font-size:20px">Chantier · Dépenses</h2>' +
      '<p style="color:var(--doux);margin:0 0 6px;font-size:15px">Saisissez le code d\'accès qui vous a été donné.</p>' +
      '<div class="champ"><label for="code">Code d\'accès</label><input id="code" type="password" autocomplete="current-password" required></div>' +
      '<button class="btn" type="submit">Entrer</button><p class="msg ko">' + esc(msg || '') + '</p></form></div>';
    var f = document.getElementById('f-acces');
    f.code.focus();
    f.addEventListener('submit', async function (e) {
      e.preventDefault(); S.code = f.code.value.trim();
      f.querySelector('button').disabled = true;
      try { await charger(); try { localStorage.setItem('chantier-code', S.code); } catch (x) { /* rien */ } rendre(); }
      catch (err) { f.querySelector('button').disabled = false; f.querySelector('.msg').textContent = err.message; }
    });
  }

  // ---------- squelette ----------
  var ICON = {
    saisir: '<path d="M12 5v14M5 12h14"/>',
    semaine: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
    global: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    rapport: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>'
  };
  function rendre() {
    var c = caisse();
    app.innerHTML = '<header class="tete"><h1>Chantier · Dépenses</h1><div class="sous">' + (S.role === 'admin' ? 'Accès administrateur' : 'Saisie des dépenses') + '</div>' +
      '<div class="caisse"><span>Argent en caisse</span><b class="' + (c < 0 ? 'rouge' : '') + '" style="color:' + (c < 0 ? '#FFB4AB' : '#fff') + '">' + dt(c) + '</b></div></header>' +
      '<main><section class="vue" id="v-saisir"></section><section class="vue" id="v-semaine" hidden></section><section class="vue" id="v-global" hidden></section><section class="vue" id="v-rapport" hidden></section></main>' +
      '<nav class="bas">' + [['saisir', 'Saisir'], ['semaine', 'Semaine'], ['global', 'Budget'], ['rapport', 'Rapport']].map(function (x) {
        return '<button type="button" data-vue="' + x[0] + '"' + (S.vue === x[0] ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24">' + ICON[x[0]] + '</svg>' + x[1] + '</button>';
      }).join('') + '</nav><dialog id="dlg"><div class="in"></div></dialog>';
    app.querySelector('nav.bas').addEventListener('click', function (e) { var b = e.target.closest('[data-vue]'); if (b) { S.vue = b.dataset.vue; rendre(); window.scrollTo(0, 0); } });
    ['saisir', 'semaine', 'global', 'rapport'].forEach(function (v) { document.getElementById('v-' + v).hidden = S.vue !== v; });
    if (S.vue === 'saisir') vueSaisir(); else if (S.vue === 'semaine') vueSemaine(); else if (S.vue === 'rapport') vueRapport(); else vueGlobal();
  }
  async function rafraichir() { await charger(); rendre(); }

  // ---------- saisie ----------
  function personnes() {
    var p = ['Caisse'];
    S.depenses.concat(S.lignes).forEach(function (x) { var n = (x.paye_par || '').trim(); if (n && p.indexOf(n) < 0 && p.length < 8) p.push(n); });
    return p;
  }
  function vueSaisir(edit) {
    var v = document.getElementById('v-saisir');
    var mode = edit ? (edit.poste ? 'depense' : 'versement') : S.mode;
    if (edit && edit.poste) { S.poste = edit.poste; S.payePar = edit.paye_par || 'Caisse'; }
    var p = S.poste && posteNom(S.poste), l = p && lot(p.lot_id);
    var noms = S.depenses.filter(function (x) { return S.poste && x.poste.toLowerCase() === S.poste.toLowerCase() && x.detail; }).map(function (x) { return x.detail; }).filter(function (x, i, t) { return t.indexOf(x) === i; }).slice(0, 30);
    v.innerHTML =
      (edit ? '' : '<div class="seg" role="group" aria-label="Type"><button type="button" data-mode="depense" aria-pressed="' + (mode === 'depense') + '">Dépense</button><button type="button" data-mode="versement" aria-pressed="' + (mode === 'versement') + '">Argent reçu</button></div>') +
      (mode === 'depense' ?
        '<form class="carte" id="f-dep" novalidate>' + (edit ? '<h2>Modifier la dépense</h2>' : '') +
          '<h2 style="margin-bottom:8px">Pour quoi ?</h2>' + boutonsPostes() +
          '<p class="imput">' + (l ? 'Imputé sur <b>' + esc(l.code + ' · ' + cap(l.nom)) + '</b>' : (S.poste ? '<span class="rouge">Poste non relié à un lot</span>' : 'Choisissez un poste')) + '</p>' +
          '<div class="champ"><label for="detail">Nom / achat / détail</label><input id="detail" name="detail" list="noms" autocomplete="off" placeholder="Ex. : Mohammed Zeyed, sable, ciment…" value="' + esc(edit ? edit.detail || '' : '') + '"><datalist id="noms">' + noms.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist></div>' +
          '<div class="ligne2"><div class="champ"><label for="montant">Montant (DT)</label><input class="montant" id="montant" name="montant" inputmode="decimal" autocomplete="off" placeholder="0" value="' + (edit ? esc(edit.montant) : '') + '"></div>' +
          '<div class="champ"><label for="date">Date</label><input id="date" name="date" type="date" value="' + (edit ? edit.date : auj()) + '"></div></div>' +
          '<div class="champ"><label>Payé par</label><div class="puces" id="paye-par">' + personnes().map(function (n) { return '<button type="button" data-p="' + esc(n) + '" aria-pressed="' + (S.payePar === n) + '">' + (n === 'Caisse' ? 'Caisse chantier' : esc(n)) + '</button>'; }).join('') + '<button type="button" data-p="__autre">+ Autre</button></div></div>' +
          (edit && edit.photo ? '<p style="margin:12px 0 0"><button class="lien" type="button" data-voir-photo>Voir la photo du ticket</button></p>' : '') +
          '<div class="champ"><label for="photo">' + (edit && edit.photo ? 'Remplacer la photo' : 'Photo du ticket') + ' <span style="font-weight:400;color:var(--doux)">(facultatif)</span></label><input id="photo" type="file" accept="image/*" capture="environment"></div>' +
          (edit && S.role === 'admin' ? '<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" name="deja"' + (edit.deja_au_budget ? ' checked' : '') + '> Déjà comptée dans le « payé » initial du budget</label>' : '') +
          '<button class="btn" type="submit">' + (edit ? 'Enregistrer' : 'Ajouter la dépense') + '</button>' +
          (edit ? '<button class="btn btn--clair" type="button" data-annuler>Annuler</button>' + (!edit.deja_au_budget || S.role === 'admin' ? '<button class="lien rouge" type="button" data-suppr style="margin-top:14px">Supprimer cette dépense</button>' : '') : '') +
          '<p class="msg" role="status"></p></form>' +
          (edit ? '' : repriseBloc())
      :
        '<form class="carte" id="f-vers" novalidate>' + (edit ? '<h2>Modifier l\'argent reçu</h2>' : '<h2>Argent reçu pour le chantier</h2>') +
          '<div class="ligne2"><div class="champ"><label for="vmontant">Montant (DT)</label><input class="montant" id="vmontant" inputmode="decimal" placeholder="0" value="' + (edit ? esc(edit.montant) : '') + '"></div>' +
          '<div class="champ"><label for="vdate">Date</label><input id="vdate" type="date" value="' + (edit ? edit.date : auj()) + '"></div></div>' +
          '<div class="champ"><label for="vlib">De qui / pour quoi</label><input id="vlib" placeholder="Ex. : virement Wadi, avance clim…" value="' + esc(edit ? edit.libelle || '' : '') + '"></div>' +
          '<button class="btn" type="submit">' + (edit ? 'Enregistrer' : 'Ajouter') + '</button>' +
          (edit ? '<button class="btn btn--clair" type="button" data-annuler>Annuler</button><button class="lien rouge" type="button" data-suppr style="margin-top:14px">Supprimer</button>' : '') +
          '<p class="msg" role="status"></p></form>');

    v.querySelectorAll('[data-mode]').forEach(function (b) { b.addEventListener('click', function () { S.mode = b.dataset.mode; vueSaisir(); }); });
    var f = v.querySelector('form'), msg = f.querySelector('.msg');
    function dire(t, ok) { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'ko'); }
    if (edit) {
      f.querySelector('[data-annuler]').addEventListener('click', function () { S.vue = 'semaine'; rendre(); });
      var vp = f.querySelector('[data-voir-photo]'); if (vp) vp.addEventListener('click', function () { voirPhoto(edit.id); });
      var sp = f.querySelector('[data-suppr]');
      if (sp) sp.addEventListener('click', async function () {
        if (!confirm('Supprimer définitivement ?')) return;

    for (var v = 0; v <= top; v += pas) s += '<line x1="' + g + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#E6E1D7"/><text class="ax" x="' + (g - 4) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + (v >= 1000 ? Math.round(v / 1000) + 'k' : v) + '</text>';
    t.forEach(function (x, i) {
      var cx = g + lw * i + lw / 2, x0 = cx - bw / 2, y0 = y(x.dep), h = H - b - y0, r = Math.min(4, h);
      if (h > 0) s += '<path class="bar' + (i === n - 1 ? ' cur' : '') + '" data-i="' + i + '" d="M' + x0 + ' ' + (H - b) + 'V' + (y0 + r) + 'Q' + x0 + ' ' + y0 + ' ' + (x0 + r) + ' ' + y0 + 'H' + (x0 + bw - r) + 'Q' + (x0 + bw) + ' ' + y0 + ' ' + (x0 + bw) + ' ' + (y0 + r) + 'V' + (H - b) + 'Z"/>';
      if (n <= 14 || i % 2 === (n - 1) % 2) s += '<text class="ax" x="' + cx + '" y="' + (H - 4) + '" text-anchor="middle">S' + x.num + '</text>';
      s += '<rect class="hit" data-i="' + i + '" x="' + (g + lw * i) + '" y="0" width="' + lw + '" height="' + H + '"><title>S' + x.num + ' : ' + dt(x.dep) + '</title></rect>';
    });
    return s + '</svg>';
  }
  function vueRapport() {
    var v = document.getElementById('v-rapport');
    var sem = semaines(), n = sem.length, cur = sem[n - 1] || { dep: 0, rec: 0, num: numSemaine(auj()) }, prec = sem[n - 2];
    var finies = sem.slice(Math.max(0, n - 5), n - 1), moy = finies.length ? somme(finies, 'dep') / finies.length : 0;
    var M = 0, P = 0; S.lots.forEach(function (l) { M += l.marche; P += payeLot(l); });
    var R = M - P, c = caisse(), autonomie = moy > 0 && c > 0 ? c / moy : null;
    var dus = 0;
    S.lignes.forEach(function (x) { if (x.paye_par && Number(x.a_rembourser)) dus += Number(x.a_rembourser); });
    S.depenses.forEach(function (x) { if (x.paye_par !== 'Caisse' && !x.deja_au_budget) dus += x.montant; });
    var evol = prec && prec.dep ? Math.round((cur.dep - prec.dep) / prec.dep * 100) : null;

    // Période des classements
    var per = S.periode || 'tout', depuis = per === 'tout' ? '0000' : plusJours(lundi(auj()), -7 * (Number(per) - 1));
    var dp = S.depenses.filter(function (x) { return x.date >= depuis; });
    var postes = grouper(dp, function (x) { return cap(x.poste); });
    var gens = grouper(dp, function (x) { return (x.detail || '').trim(); });
    var postesAff = postes.slice(0, 7); if (postes.length > 7) postesAff.push({ nom: 'Autres postes', total: somme(postes.slice(7), 'total'), n: 0, postes: {} });

    // Lots à surveiller
    var lots = S.lots.map(function (l) { var p = payeLot(l); return { l: l, p: p, r: l.marche - p, pct: l.marche ? p / l.marche : (p ? 2 : 0) }; });
    var depasses = lots.filter(function (x) { return x.p > x.l.marche + 0.5; });
    var presque = lots.filter(function (x) { return x.pct >= 0.9 && x.pct <= 1 && x.r > 0.5; });
    var restes = lots.filter(function (x) { return x.r > 0.5; }).sort(function (a, b) { return b.r - a.r; }).slice(0, 6);

    // Alertes
    var al = [];
    if (c < 0) al.push(['ko', 'Caisse négative : ' + dt(c) + '. Il manque de l\'argent pour couvrir les dépenses payées par la caisse.']);
    depasses.forEach(function (x) { al.push(['ko', x.l.code + ' · ' + cap(x.l.nom) + ' : dépassement de ' + dt(-x.r) + ' sur le marché.']); });
    presque.forEach(function (x) { al.push(['', x.l.code + ' · ' + cap(x.l.nom) + ' : il ne reste que ' + dt(x.r) + ' sur le marché.']); });
    var sansLot = S.depenses.filter(function (x) { return !x.lot_id && !x.deja_au_budget; });
    if (sansLot.length) al.push(['', sansLot.length + ' dépense(s) sans lot (' + dt(somme(sansLot, 'montant')) + ') : relier leur poste à un lot.']);
    if (moy && cur.dep > moy * 1.5) al.push(['', 'Semaine en cours au-dessus de la moyenne : ' + dt(cur.dep) + ' contre ' + dt(moy) + ' en moyenne.']);
    var sansPhoto = S.depenses.filter(function (x) { return !x.deja_au_budget && !x.photo && x.montant >= 1000; });
    if (sansPhoto.length) al.push(['', sansPhoto.length + ' dépense(s) de 1 000 DT ou plus sans photo de ticket.']);

    v.innerHTML =
      '<div class="kpi">' +
        '<div class="large"><span>Avancement financier</span><b>' + (M ? Math.round(P / M * 100) : 0) + ' % payé</b><div class="barre" style="height:10px"><i style="width:' + (M ? Math.min(100, P / M * 100) : 0) + '%"></i></div><small>' + dt(P) + ' payés sur ' + dt(M) + '</small></div>' +
        '<div><span>Reste à payer</span><b>' + dt(R) + '</b><small>sur ' + S.lots.length + ' lots</small></div>' +
        '<div><span>Argent en caisse</span><b class="' + (c < 0 ? 'rouge' : '') + '">' + dt(c) + '</b><small>' + (autonomie != null ? 'env. ' + (autonomie < 10 ? nf.format(Math.round(autonomie * 10) / 10) : Math.round(autonomie)) + ' sem. au rythme moyen' : (c < 0 ? 'à renflouer' : '—')) + '</small></div>' +
        '<div><span>Dépensé S' + cur.num + ' (en cours)</span><b>' + dt(cur.dep) + '</b><small>' + (evol == null ? '—' : (evol > 0 ? '+' : '') + evol + ' % vs S' + prec.num) + '</small></div>' +
        '<div><span>Moyenne par semaine</span><b>' + dt(moy) + '</b><small>' + (finies.length ? finies.length + ' dernière(s) semaine(s) finie(s)' : 'pas encore de semaine finie') + '</small></div>' +
        '<div><span>Total dépensé (saisies)</span><b>' + dt(somme(S.depenses, 'montant')) + '</b><small>' + S.depenses.length + ' dépenses</small></div>' +
        '<div><span>À rembourser</span><b>' + dt(dus) + '</b><small>avancé de leur poche</small></div>' +
      '</div>' +
      (al.length ? '<div class="carte" style="border-color:var(--acc)"><h2>À surveiller (' + al.length + ')</h2>' + al.map(function (a) { return '<div class="alerte"><i class="' + a[0] + '">!</i><span>' + esc(a[1]) + '</span></div>'; }).join('') + '</div>' : '<div class="carte"><h2>À surveiller</h2><p class="vide" style="padding:4px 0">Rien à signaler.</p></div>') +
      '<div class="carte graph"><h2>Dépenses par semaine</h2>' + (n ? graphSemaines(sem.slice(-12)) + '<p class="info" id="g-info">Touchez une barre pour le détail. En orange : la semaine en cours.</p>' : '<p class="vide">Aucune dépense.</p>') + '</div>' +
      '<div class="carte"><h2>Caisse semaine par semaine</h2><table class="tab"><thead><tr><th>Semaine</th><th>Reçu</th><th>Dépensé</th><th>Reste</th><th>Caisse</th></tr></thead><tbody>' +
        sem.slice(-12).reverse().map(function (x) { return '<tr><td>S' + x.num + ' <span style="color:var(--doux)">' + court(x.lundi) + '</span></td><td>' + nf.format(Math.round(x.rec)) + '</td><td>' + nf.format(Math.round(x.dep)) + '</td><td class="' + (x.reste < 0 ? 'rouge' : '') + '">' + (x.reste > 0 ? '+' : '') + nf.format(Math.round(x.reste)) + '</td><td class="' + (x.solde < 0 ? 'rouge' : '') + '">' + nf.format(Math.round(x.solde)) + '</td></tr>'; }).join('') +
      '</tbody></table><p class="imput">En DT. Reste = argent reçu − dépenses payées par la caisse. Il est remis à Haikel en fin de semaine (poste « Haikel (petites dépenses) »), la caisse repart alors à 0.</p></div>' +
      '<div class="seg no-print" style="grid-template-columns:repeat(3,1fr)">' + [['4', '4 semaines'], ['12', '12 semaines'], ['tout', 'Depuis le début']].map(function (x) { return '<button type="button" data-per="' + x[0] + '" aria-pressed="' + (per === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>' +
      '<div class="carte"><h2>Où part l\'argent (par poste)</h2>' + (postesAff.length ? barresH(postesAff, postesAff[0].total, function (x) { return x.n ? x.n + ' dépense(s)' : ''; }) : '<p class="vide">Aucune dépense sur la période.</p>') + '<p class="imput">Total période : <b>' + dt(somme(dp, 'montant')) + '</b></p></div>' +
      '<div class="carte"><h2>Qui a été payé (top 10)</h2>' + (gens.length ? barresH(gens.slice(0, 10), gens[0].total, function (x) { return Object.keys(x.postes).join(', ') + ' · ' + x.n + ' paiement(s)'; }) : '<p class="vide">Aucune dépense sur la période.</p>') + '</div>' +
      '<div class="carte"><h2>Plus gros restes à payer</h2>' + restes.map(function (x) {
        return '<div class="hb"><div class="t"><span>' + esc(x.l.code + ' · ' + cap(x.l.nom)) + '</span><span>' + dt(x.r) + '</span></div><div class="barre"><i style="width:' + Math.min(100, Math.round(x.pct * 100)) + '%"></i></div><div class="s">payé ' + dt(x.p) + ' sur ' + dt(x.l.marche) + '</div></div>';
      }).join('') + '</div>' +
      '<button class="btn btn--clair no-print" type="button" data-imprimer>Imprimer / enregistrer en PDF</button>';

    var info = v.querySelector('#g-info'), aff = sem.slice(-12);
    v.onclick = function (e) {
      var b;
      if ((b = e.target.closest('[data-per]'))) { S.periode = b.dataset.per; return vueRapport(); }
      if (e.target.closest('[data-imprimer]')) return window.print();
      if ((b = e.target.closest('[data-i]')) && info) {
        var x = aff[Number(b.dataset.i)];
        v.querySelectorAll('.graph .bar').forEach(function (p) { p.classList.toggle('sel', p.dataset.i === b.dataset.i); });
        info.innerHTML = '<b>S' + x.num + '</b> (du ' + court(x.lundi) + ' au ' + court(plusJours(x.lundi, 6)) + ') : dépensé <b>' + dt(x.dep) + '</b> en ' + x.n + ' ligne(s) · reçu ' + dt(x.rec) + ' · reste ' + dt(x.reste) + ' · caisse ' + dt(x.solde);
      }
    };
  }
  function dialogue(html, onSubmit) {
    var d = document.getElementById('dlg'), i = d.querySelector('.in');
    i.innerHTML = '<form novalidate>' + html + '<button class="btn" type="submit">Enregistrer</button><button class="btn btn--clair" type="button" data-fermer>Annuler</button><p class="msg ko" role="status"></p></form>';
    var f = i.querySelector('form');
    f.querySelector('[data-fermer]').addEventListener('click', function () { d.close(); });
    f.addEventListener('submit', async function (e) { e.preventDefault(); try { await onSubmit(f); d.close(); await rafraichir(); S.vue = 'global'; rendre(); } catch (err) { f.querySelector('.msg').textContent = err.message; } });
    d.showModal();
  }
  function editerLot(l) {
    dialogue('<h3>' + esc(l.code + ' · ' + cap(l.nom)) + '</h3><div class="champ"><label for="lm">Marché (DT)</label><input id="lm" inputmode="decimal" value="' + l.marche + '"></div>' +
      '<div class="champ"><label for="lp">Payé au départ, hors saisies de l\'outil (DT)</label><input id="lp" inputmode="decimal" value="' + l.paye_initial + '"></div>' +
      '<div class="champ"><label for="lr">Remarque</label><input id="lr" value="' + esc(l.remarque || '') + '"></div>', async function (f) {
      await api('lot', { id: l.id, marche: f.lm.value, paye_initial: f.lp.value, remarque: f.lr.value });
    });
  }
  function editerPoste(p) {
    dialogue('<h3>' + (p ? 'Modifier le poste' : 'Nouveau poste') + '</h3><div class="champ"><label for="pn">Nom du bouton</label><input id="pn" value="' + esc(p ? p.nom : '') + '"></div>' +
      '<div class="champ"><label for="pl">Imputé sur le lot</label><select id="pl"><option value="">— aucun —</option>' + S.lots.map(function (l) { return '<option value="' + l.id + '"' + (p && p.lot_id === l.id ? ' selected' : '') + '>' + esc(l.code + ' · ' + cap(l.nom)) + '</option>'; }).join('') + '</select></div>' +
      (p ? '<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="pa"> Masquer ce bouton</label>' : ''), async function (f) {
      await api('poste', { id: p && p.id, nom: f.pn.value, lot_id: f.pl.value, actif: !(f.pa && f.pa.checked) });
    });
  }

  // ---------- démarrage ----------
  (async function () {
    if (!S.code) return ecranAcces();
    app.innerHTML = '<p class="vide" style="padding-top:40vh">Chargement…</p>';
    try { await charger(); rendre(); }
    catch (err) { ecranAcces(err.status === 401 ? '' : err.message); }
  })();
})();
</script>
